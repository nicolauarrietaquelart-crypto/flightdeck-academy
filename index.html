en the cabin altitude exceeds 10000 feet","A steady warning horn sounds and the red CABIN ALTITUDE warning lights illuminate when the cabin altitude exceeds 14000 feet.","An intermittent warning horn sounds and the red CABIN ALTITUDE lights illuminate when the cabin altitude exceeds 10000 feet"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-35","source":"tech1","category":"Warning Systems","question":"Pushing the ground proximity BELOW G/S P-INHIBIT light cancels or inhibits the alert when below 1,000 feet RA.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-15-36","source":"tech1","category":"Warning Systems","question":"When testing the Mach/Airspeed warning system in flight, the No1 and No2 systems must be tested separately to identify that the clacker sounds for both systems independently.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-1","source":"tech1","category":"Airplane General","question":"What does an amber light indicate on the Flight Deck Door Emergency Access Panel?","options":["Electronic door lock inoperative, deadbolt in use.","Access denied by Flight Deck.","Correct access code entered, if in AUTO door will unlock after timer expires.","Incorrect access code entered, after timer expires code can be entered again."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-16-2","source":"tech1","category":"Electrical","question":"The Aircraft battery need to be selected ON for STANDBY operation of the Forward Airstairs from the FWD Attendant's Panel?","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-3","source":"tech1","category":"Communications","question":"VHF antennae located on the upper fuselage are susceptible to multipath interference from other air traffic, antennae located on the lower fuselage are not as susceptible to this interference.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-4","source":"tech1","category":"Airplane General","question":"What microphone options are available to the flight crew?","options":["Headset boom microphone and hand microphone.","Hand microphone, headset boom microphone, oxygen mask microphone.","Hand microphone, headset boom microphone, oxygen mask microphone, overhead speaker microphone.","Headset boom microphone, oxygen mask microphone, ceiling speakers microphone."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-5","source":"tech1","category":"Airplane General","question":"The volume of received communications can be controlled by rotating the selected RECEIVER SWITCHES on the Radio Tuning Panel.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-6","source":"tech1","category":"Airplane General","question":"What is the effect of pushing the Pilot Call switch?","options":["Single-tone chime in passenger cabin with both pink call lights illuminated.","Two-tone chime in flight deck.","Two-tone chime in passenger cabin, with both pink master call lights illuminated.","Single-tone chime in flight deck."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-16-7","source":"tech1","category":"Airplane General","question":"The SOURCE OFF light illuminates whenever an IDG has tripped offline due to overheating.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-8","source":"tech1","category":"Airplane General","question":"Why are the covers on the Drive DISCONNECT switches red?","options":["To identify switch action is irreversible in flight.","To identify an emergency operation control switch.","For easy identification of an emergency operation in low light conditions.","To identify a NNP memory item."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-9","source":"tech1","category":"Electrical","question":"What is the purpose of the Ground Service switch on the forward attendant's panel?","options":["Provides ground power directly to the AC ground services bus for utility outlets, cabin lighting, and battery charger without powering all aircraft electrical busses.","Energises the No1 and No2 115V GND SERVICE BUS, to allow the galleys water heaters to be powered whilst the aircraft is connected to ground power.","Provides power to external services used by ground servicing personnel.","Powers and sounds external horn through the AC ground services bus to attract attention of ground servicing personnel."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-10","source":"tech1","category":"Electrical","question":"What is the effect of selecting the Drive Disconnect switch to DISCONNECT?","options":["AC Standby Bus is immediately powered by Inverter from batteries.","DRIVE light illuminates, AC electrical power is lost on associated Transfer Bus, AC Standby Bus powered from opposite Transfer Bus.","No effects take place until STANBY POWER switch is also moved to BAT.","IDG is disconnected if running, and DRIVE light illuminates."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-16-11","source":"tech1","category":"Airplane General","question":"What is the voltage of the DC Busses under normal circumstances?","options":["24v","115v","28v","22-30v"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-16-12","source":"tech1","category":"Engines & APU","question":"When will the landing gear config warning horn give an intermittent warning sound?","options":["Never.","Flaps 1 through 10, below 800 feet RA, either forward thrust lever at 20 degrees or less (or less than 34 degrees if only 1 engine running).","Flaps up through 10, below 800 feet RA, either forward thrust lever at 20 degrees or less (or less than 34 degrees if only 1 engine running).","Flaps greater than 25, below 800 feet RA, regardless of forward thrust lever position."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-13","source":"tech1","category":"Landing Gear","question":"Altitude alerting occurs when approaching or departing from the MCP selected altitude. When is the altitude alerting system inhibited?","options":["Glide slope is captured, or trailing edge flaps are extended to 25 or greater.","Landing gear is down and locked.","Leading edge flaps are extended to 25 or greater","Leading edge flaps are extended to 25 or greater and the landing gear is extended."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-14","source":"tech1","category":"Electrical","question":"When carrying out the Stall Warning Test, which of the following statements is correct?","options":["The test can be completed once AC power is available","The test can be completed on DC power","The test cannot be completed until the AC Transfer Busses have been powered for up to 4 minutes.","The test cannot be completed until the DC Busses have been powered for up to 4 minutes."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-16-15","source":"tech1","category":"FMS & Navigation","question":"The EGPWS displays terrain within 2,500 feet of the aircraft barometric altitude on the Navigation display.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-16","source":"tech1","category":"Airplane General","question":"The PSEU light, located on the forward overhead panel, will illuminate on the ground if a fault is detected in the PSEU or if an overwing exit flight lock fails to disengage when commanded.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-17","source":"tech1","category":"FMS & Navigation","question":"On the navigation display, how is the display presented in VOR, Approach and Plan modes?","options":["VOR = true north up, Approach = true north up, Plan = heading up.","VOR = true north up, Approach = heading up, Plan = heading up.","VOR = heading up, Approach = true north up, Plan = heading up.","VOR = heading up, Approach = heading up, Plan = true north up."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-16-18","source":"tech1","category":"Flight Instruments","question":"On the PFD, what does the amber annunciation \"DISPLAYS CONTROL PANEL\" indicate?","options":["The Display Select Panel on the the side the annunciation is displayed has failed.","The Displays Source Control Panel on the side the annunciation is displayed has failed.","The PFD the annunciation is displayed on has an error and information displayed may be erroneous.","The EFIS control panel on the side the annunciation is displayed has failed"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-16-19","source":"tech1","category":"Flight Instruments","question":"What condition causes an Amber IAS DISAGREE alert to appear at the bottom of the speed tape?","options":["Captain's and First Officer's airspeeds disagree by more than 5 kts for more than 5 seconds.","Selected V Ref is not correct for current aircraft configuration.","Difference of more than 10 kts for more than 10 seconds between Captain's and First Officer's airspeed indications.","V Ref has not been entered"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-20","source":"tech1","category":"Engines & APU","question":"What does a white CDS MAINT message in the lower left corner of the PFD indicate?","options":["A dispatchable CDS fault has occured prior to first engine start.","A dispatchable CDS fault has occured prior to sencond engine start","A non-dispatchable CDS fault has occured post second engine start.","A non-dispatchable CDS fault has occured prior to second engine start"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-21","source":"tech1","category":"Airplane General","question":"What does the top of the amber bar indicate at the lower end of the speed tape?","options":["Minimum manoeuvre speed (1.3g manoeuvre capability to stick shaker below approximately 20,000 feet) - (1.3g manoeuvre capability to low speed buffet above approximately 20,000 feet).","Minimum manoeuvre speed (1.3g manoeuvre capability to stick shaker above approximately 20,000 feet) - (1.3g manoeuvre capability to low speed buffet below approximately 20,000 feet).","Minimum manoeuvre speed (1.3g manoeuvre capability to stick shaker below approximately 30,000 feet) - (1.3g manoeuvre capability to low speed buffet above approximately 30,000 feet).","Minimum manoeuvre speed (1.3g manoeuvre capability to stick shaker above approximately 30,000 feet) - (1.3g manoeuvre capability to low speed buffet below approximately 30,000 feet)."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-22","source":"tech1","category":"Flight Instruments","question":"What colour is the Outer Marker Beacon (OM) displayed on the PFD?","options":["OM appears Cyan in top right corner of AI.","OM appears Magenta in lower right corner of Attitude Indicator.","OM appears White in top right corner of AI","OM appears in Magenta in top right corner of the Attitude Indicator."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-23","source":"tech1","category":"Airplane General","question":"Setting the ADF mode selector switch to ANT has what effect?","options":["No ADF bearing data available and audio reception optimised.","ADF bearing data sent to Standby Radio Magnetic Indicator as well as the DUs.","ADF bearing data switched to keel antenna only, to minimise multipath interference.","ADF bearing pointer slews to 135 degrees relative bearing."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-24","source":"tech1","category":"Automatic Flight","question":"What components comprise the Flight Management System?","options":["FMCS, AFDS, A/T, MCP, EFIS, ADIRS.","FMCS, AFDS, MCP, IRS, GPS.","FMCS, A/P, A/T, MCP, EFIS, IRS.","MCS, AFDS, A/T, IRS, GPS."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-16-25","source":"tech1","category":"FMS & Navigation","question":"On the IRS panel, if the DC FAIL light illuminates in flight all alignment data is lost and the system cannot be re-set until the aircraft id parked on the ground.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-26","source":"tech1","category":"FMS & Navigation","question":"If the aircraft present position cannot be entered through the FMC CDU, it can be entered using the ISDU keyboard.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-27","source":"tech1","category":"Fuel","question":"In flight a fuel imbalance between No1 and No2 tanks can be corrected by:","options":["Open the Crossfeed cock, turn off the pumps on the low side until the Fuel Quantity Indicators are balanced.","A Fuel imablance cannot be rectified in flight, as fuel transfer between tanks can only be carried out on the ground using the Ground Refuelling Panel switches.","Opening the crossfeed valve, turning OFF the fuel pumps for the tank with lower fuel and allowing the pumps from the tank with the higher amount of fuel to transfer fuel to the other tank until the IMBAL amber warning light extinguishes, then close the Crossfeed valve and turn back on the pumps.","Increase thrust setting on the side with higher amount of fuel and decrease thrust setting on side with lower amount of fuel."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-28","source":"tech1","category":"Fuel","question":"How many fuel pumps does each tank have, and where are they located?","options":["The centre tank has 1 AC fuel pump located on the front wall of the centre tank and 1 located on the rear wall of the centre tank. The No1 main tank has 1 pump located on the rear wall of the No1 tank and 1 pump located on the front wall of the No1 tank . The No2 tank has 1 pump located on the rear wall of the No2 tank and 1 pump located on the front wall of the No2 tank.","The centre tank has 2 AC pumps located on the forward wall of the centre tank. The No1 main tank has 2 AC pumps located on the rear wall of the No1 tank. The No2 main tank has 2 AC pumps located on the rear wall of the No2 tank","The centre tank has 2 AC fuel pumps mounted on the rear wall of the centre tank. The No1 tank has 2 AC pumps mounted in the centre tank - 1 on the front wall and one one the rear wall. The No2 tank has 2 AC pumps mounted in the centre tank - 1 on the front wall and 1 on the rear wall. There is also a Jet pump mounted in the centre tank discharging into No1 tank","The centre tank has 2 AC pumps located on the forward wall of the centre tank. The No1 main tank has 1 AC pump located on the rear wall of the No1 tank. The No2 main tank has 1 AC pump located on the rear wall of the No2 tank"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-16-29","source":"tech1","category":"Airplane General","question":"After the Centre Tank has emptied the auto shutoff logic stops the pumps, how do the pumps then function?","options":["There is no shutoff logic, the pumps continue to run with the amber LOW PRESSURE light illuminated until the Flight Crew switch the pumps to OFF.","The pumps will not funtion again until the Centre tank has been refueled above 453 kg.","The pumps can be activated if necessary by tripping the auto shutoff circuit breaker on Panel P6-1 behind the First Officer.","Switching the pumps to OFF and then back to ON recycles the auto shutoff logic and the pumps will again activate"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-16-30","source":"tech1","category":"Fuel","question":"The fuel imbalance alert is only displayed when the aircraft is in the air.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-31","source":"tech1","category":"Fuel","question":"With the Centre (CTR) tank FUEL PUMP switches ON, if an amber LOW PRESSURE light illuminates, it also immediately illuminates MASTER CAUTION and a FUEL system annunciator lights.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-32","source":"tech1","category":"Airplane General","question":"At what altitude (in feet) do the RA callouts begin?","options":["FIFTEEN HUNDRED","TWENTY FIVE HUNDRED","TWO THOUSAND","ONE THOUSAND"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-33","source":"tech1","category":"Warning Systems","question":"The stall warning test can only be carried out on the ground, the No1 and No2 systems must be carried out separately to ensure the clacker sounds when each system is tested.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-34","source":"tech1","category":"Airplane General","question":"What is the minimum distance required to make a turn away from an obstacle to the front of the aircraft?","options":["7.4m","5.4m","9.8m","12.5m"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-35","source":"tech1","category":"Airplane General","question":"In the event of having to evacuate the aircraft, Escape Straps can be used to aid egress. Which of the following statements are correct for Ryanair aircraft Escape Straps.","options":["There are only two escape straps fitted - one above each of the aft emergency exit door frames, to be attached to the door frame and the wing, to aid exiting onto the wing in a ditching situation.","There are only two escape straps fitted - one above the L2 window and one above the R2 window to allow the flight deck crew to egress through the L2 or R2 windows.","There are only two escape straps fitted - one above each of the forward emergency exit door frames, to be attached to the door frame and the wing, to aid exiting onto the wing in a ditching situation.","There are four escape straps fitted - one above the L2 window and one above the R2 window to allow the flight deck crew to egress through the L2 or R2 windows; and one above each of the aft emergency exit door frames, to be attached to the door frame and the wind to aid exiting onto the wing in a ditching situation."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-16-36","source":"tech1","category":"Fire Protection","question":"How many fire extinguishers are located on the flight deck, what type of extinguisher are they and where are they located?","options":["1 Halon extinguisher located behind the FO, and 1 CO2 extinguisher located under the second observer's jump seat.","2 Halon fire extinguishers, 1 located behind the Captain's seat and 1 located behind the FO's seat.","1 Chemical fire extinguisher, located behind the FO","1 Halon extinguisher located behind the FO, and 1 Water Glycol extinguisher located under the second observer's jump seat."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-16-37","source":"tech1","category":"Electrical","question":"How can the Emergency Exit Lights be illuminated?","options":["By lifting the guard and pushing the ON switch located on the Aft Attendant Panel.","Automatically if the three position switch located on the FWD Overhead panel switch is in the ARMED position and electrical power to DC bus No.1 fails or if AC power turned off.","If the three position switch located on the FWD Overhead panel is selected to ON.","All the above"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-16-38","source":"tech1","category":"Air Systems","question":"When the PASS OXY switch on the AFT overhead panel is selected to ON, at what cabin altitude will the passenger oxygen system activate?","options":["14,000 feet.","10,000 feet.","14,000 m.","At altitude selected ON."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-16-39","source":"tech1","category":"Airplane General","question":"Which statement is correct for the No 2 windows.","options":["The Captain's No 2 Window can be opened from outside the aircraft.","Both the Captain's and First Officer's No 2 Windows can be opened from outside the aircraft.","The First Officer's No 2 window can be opened from outside the aircraft.","The No 2 Windows cannot be opened from outside the aircraft."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-16-40","source":"tech1","category":"Airplane General","question":"A total of 99 numbered waypoints cannot be exceeded for any single route.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-41","source":"tech1","category":"Airplane General","question":"During THR HLD (Throttle Hold), if you manually move the throttle levers, the A/T will try to return them to their original position.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-42","source":"tech1","category":"Automatic Flight","question":"The autopilot disengages automatically 2 seconds after touchdown.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-43","source":"tech1","category":"Automatic Flight","question":"For approach, what altitude must the second Autopilot be selected for duel Autopilot operation?","options":["1500 feet RA","350 feet RA","500 feet RA","800 feet RA"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-16-44","source":"tech1","category":"Automatic Flight","question":"What are the components of the Automatic Flight System (AFS)?","options":["Autopilot Flight Director System, Autothrottle and MCP Mode Selector System.","Autopilot Flight Director System and Autothrottle","Flight Directors, Autothrottle, and MCP Mode Selection System","Autopilot, Autothrottle, and MCP Mode Selection System."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-45","source":"tech1","category":"Airplane General","question":"At what altitude will the FLARE manoeuvre start during AUTOLAND?","options":["50 RA.","350 feet AGL.","350 feet RA.","50 feet AGL."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-46","source":"tech1","category":"Flight Controls","question":"What does a flashing \"A\" displayed to the left of the MCP Speed indicate?","options":["limiting for maximum speed for current flap setting.","Overspeed limiting at Mmo limit","Overspeed limititing at Vmo Limit","Underspeed limiting, FMC speed or MCP selected speed cannot be reached."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-16-47","source":"tech1","category":"Air Systems","question":"If all zone and primary pack controls fail, how is cabin temperatures controlled?","options":["The last settings before the failure will be maintained until the packs are selected OFF.","The cabin temperatures cannot be controlled in this situation.","A fixed cabin temperature will be produced in this situation - 24 degrees C from the left pack, and 18 degrees C from the right pack.","The standby pack controls command the packs to produce the average temperature demand of the 2 passenger cabin zones"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-16-48","source":"tech1","category":"Engines & APU","question":"The APU is capable of supplying bleed air for two packs on the ground, or one pack in flight.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-16-49","source":"tech1","category":"Fire Protection","question":"The TRIP RESET switch is pushed to reset a PACK, WING-BODY OVERHEAT and BLEED TRIP OFF, it isolates the associated valve and extinguishes the alert.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-16-50","source":"tech1","category":"Fire Protection","question":"On the window heat panel - what do the green ON lights indicate?","options":["Illuminated means window heat needs to be switched on for that window, extinguished means heat now being applied to that window.","Extinguished means heat still being applied to window but not yet at correct operating temperature, illuminated means window at correct temperature.","Illuminated means heat being applied to windows, extinguished means windows at correct temperature","Illuminated means the window Overheat system has activated."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-17-1","source":"tech1","category":"Anti-Ice & Rain","question":"If the cowl anti-ice valve fails to move to the position indicated by the ENG ANTI-ICE switch, the COWL VALVE OPEN light remains illuminated bright blue and an amber TAI indication immediately illuminates on the CDS.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-2","source":"tech1","category":"Engines & APU","question":"The engine Cowl Anti-Ice valve is located UPSTREAM of the Engine Bleed Air Valve.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-3","source":"tech1","category":"Anti-Ice & Rain","question":"The rain removal system for the forward windows comprises of the following:","options":["Windshield wipers, hydroscopic rain repellent coating.","Windshield wipers.","Heated windows, Windshield wipers,","Windshield wipers, heated windows, hydroscopic rain repellent coating."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-4","source":"tech1","category":"Engines & APU","question":"What is the primary function of the recirculation fans?","options":["Recirculate the air from the passeger cabin the provide heating for the forward cargo compartment","Recirculate cabin air to allow it to be filtered to remove contaminants as it passes through the recirculation fan HEPA filters.","To provide standby air conditioning if the packs fail.","Reduce engine bleed air demand and load on the packs."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-17-5","source":"tech1","category":"Engines & APU","question":"What condition would cause an automatic shutdown of the APU?","options":["The APU has no automatic shutdown protection - shutting down the APU is always Flight Crew initiated.","APU fuel control unit failure, The APU overspeeds, An APU high oil temperature condition occurs.","APU fuel control unit failure, The APU overspeeds","APU fuel control unit failure, An APU high oil temperature condition occurs."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-6","source":"tech1","category":"Engines & APU","question":"The APU can operate and supply bleed air only, up to the aircraft operating ceiling of 41, 000 feet.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-7","source":"tech1","category":"Hydraulics","question":"Which of the following statements is true, when the landing gear Manual Extension Access Door is open?","options":["The landing gear cannot be retracted.","The landing gear can be manually lowered with the lnding gear lever in ANY position.","Normal landing gear extension is possible if Hydraulic system A operational.","All of the above are true."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-17-8","source":"tech1","category":"Landing Gear","question":"Which of the following statements are false for Antiskid Protection.","options":["Each wheel is provided with individual Antiskid protection in normal and alternate braking.","The Antiskid system provides skid, locked wheel, touchdown and hydroplane protection in both normal and alternate braking.","All of the above are false.","Antiskid protection is provided for both normal and alternate brake systems."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-9","source":"tech1","category":"Landing Gear","question":"If both normal and alternative brake system pressure is lost it is still possible to use the brakes to bring the aircraft to a complete stop after landing?","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-10","source":"tech1","category":"Engines & APU","question":"If both the ON and ALTN lights in the EEC switch are illuminated, what does this indicate?","options":["The EEC has been manually switched to the soft alternate mode","The EEC is inoperative for that engines.","The EEC has automatically switched to the soft alternate mode.","The soft alternate mode is armed."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-17-11","source":"tech1","category":"Engines & APU","question":"Raising an engine start lever to the IDLE position opens which fuel valve(s)?","options":["The related engine-mounted fuel shutoff valve and engine bypass valve.","The related spar fuel shutoff valve.","The related engine-mounted fuel shutoff valve.","The related spar fuel shutoff valve and engine-mounted fuel shutoff valve."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-17-12","source":"tech1","category":"Engines & APU","question":"When is the EGT Start Limit Redline displayed?","options":["Until starter cutout speed (approx 56%)","Until the engine achieves stabilised idle (approx 59%)","Until the engine achieves self sustaining idle (approx 50%)","The EGT start Limit Redline is only displayed if the EGT exceeds the Start Limit."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-13","source":"tech1","category":"Engines & APU","question":"As well as using the DISCH switch on the Fire Protection panel in the flight deck, an APU fire can be extinguished by discharging the APU fire extinguisher using the APU Ground Control Panel (shown below), which is located in a quick release access panel immediately forward and below the APU.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-14","source":"tech1","category":"Engines & APU","question":"The Engine Fire DISCH switches are mechanically locked in the Down position and can only be pulled Up when an Overheat or Fire is detected and the switch has illuminated.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-15","source":"tech1","category":"Fire Protection","question":"The fire detectors located in the forward and aft cargo holds detect a fire by what means?","options":["Detecting either smoke or heat above a pre-set value.","Detecting smoke only","Detecting heat above a pre-set value only.","Forward cargo compartment set to detect smoke only, due to hot air from cabin conditioning system being discharged into forward cargo hold, aft cargo compartment set to detect both smoke and heat."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-16","source":"tech1","category":"Fire Protection","question":"What do the 3 green illuminated lights at the bottom right of the diagram indicate?","options":["Fire extinguisher test continuity normal.","Fire Switch handles functional test satisfactory.","Fire extinguisher functional test completed satifactorily.","Fire warning system test 1 completed satisfactorily."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-17","source":"tech1","category":"Airplane General","question":"The IntuVue weather radar fitted in aircraft YF662-YF695 and YW001-YW164, gives clutter-free viewing of significant weather out to what range?","options":["320 nautical miles","120 nautical miles.","220 nautical miles","420 nautical miles."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-18","source":"tech1","category":"Warning Systems","question":"Below what altitude are windshear alerts available for aircraft fitted with IntuVue weather radar?","options":["2300 feet AGL and below.","1500 feet AGL and below.","1800 feet RA and below.","1200 feet RA and below."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-17-19","source":"tech1","category":"Airplane General","question":"What forward arc does the weather radar antenna sweep?","options":["185","180","160","165"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-20","source":"tech1","category":"Hydraulics","question":"The electric motor driven hydraulic pumps are cooled and lubricated by hydraulic oil passing through them - this oil is then cooled by passing through a fuel cooled oil cooler located in each main tank. What quantity of fuel must there be in each main tank to operate the electric driven pumps on the ground?","options":["760 kg","363 kg","453 kg","726 kg"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-21","source":"tech1","category":"Hydraulics","question":"The hydraulic system quantity is displayed on the lower DU by digital indication from 0 to 100%.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-22","source":"tech1","category":"Hydraulics","question":"While airborne and with flaps retracted, if hydraulic System A or System B loose pressure does the Standby hydraulic system automatically activate?","options":["Yes, but only if both System A and System B loose pressure.","No, automatic activation only occurs if either System A or System B loose pressure and flaps are extended.","No, automatic activation only occurs if both System A and System B loose pressure and flaps are extended.","Yes, failure of either System A or System B will cause automatic activation of the Standby hydraulic system."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-23","source":"tech1","category":"FMS & Navigation","question":"If the aircraft present position cannot be entered through the FMC CDU, it can be entered using the ISDU keyboard.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-24","source":"tech1","category":"FMS & Navigation","question":"The amber annunciation \"INSTR SWITCH\" below the altimeter indicates what?","options":["Captain's and First Officer's displays are using seperate sources of IRU data.","The IRS switch on the Aft Overhead panel is not selected to NORMAL.","Captain's and First Officer's displays are using the same source of IRU data with the IRS switch selected to OFF.","The IRS switch on the Forward Overhead panel is not selected to NORMAL"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-17-25","source":"tech1","category":"FMS & Navigation","question":"On the navigation display, how is the display presented in VOR, Approach and Plan modes?","options":["VOR = true north up, Approach = heading up, Plan = heading up.","VOR = heading up, Approach = heading up, Plan = true north up.","VOR = heading up, Approach = true north up, Plan = heading up.","VOR = true north up, Approach = true north up, Plan = heading up."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-26","source":"tech1","category":"FMS & Navigation","question":"On the DEP/ARR page on the FMC, can more than one Arrival be entered?","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-27","source":"tech1","category":"Flight Controls","question":"The flap slat electronic unit (FSEU) will close the trailing edge bypass valve if it detects trailing edge flap asymmetry, skew or uncommanded motion; thus stopping the movement of the flaps via the normal system. However, the flaps can still be moved by means of electric motors.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-28","source":"tech1","category":"Hydraulics","question":"What does a FLT CONTROL light illuminated amber indicate?","options":["Related hydraulic system pressure to ailerons, elevator and rudder is low.","This light is illuminated whenever the associated FLT CONTROL switch is in the OFF position.","The STBY RUD system pressure is low.","Both hydraulic systems pressure to ailerons, elevator and rudder are low."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-29","source":"tech1","category":"Flight Controls","question":"What should the maximum flap extension altitude be?","options":["41,000 feet","20,000 feet","2500 feet RA","Field elevation plus 1000 feet."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-30","source":"tech1","category":"Landing Gear","question":"On landing, when do the ground spoilers extend?","options":["Compression of the nose landing gear.","Compression of any landing gear strut.","Compression of the right main landing gear strut.","Compression of the left main landing gear strut."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-17-31","source":"tech1","category":"Engines & APU","question":"The APU engine air inlet door is located at the rear of the fuselage just below and forward of the left horizontal stabiliser.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-32","source":"tech1","category":"Automatic Flight","question":"What are the components of the Automatic Flight System (AFS)?","options":["Autopilot Flight Director System, Autothrottle and MCP Mode Selector System.","Autopilot, Autothrottle, and MCP Mode Selection System.","Flight Directors, Autothrottle, and MCP Mode Selection System","Autopilot Flight Director System and Autothrottle."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-17-33","source":"tech1","category":"Automatic Flight","question":"What components make up the Automatic Flight System (AFS)?","options":["AFDS, MCP mode selector system, autothrottles.","Autothrottles and autopilot flight director system.","Flight directors, MCP mode selector system, autothrottles.","Autopilot, MCP mode selector system, autothrottles."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-34","source":"tech1","category":"Airplane General","question":"A total of 99 numbered waypoints cannot be exceeded for any single route.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-35","source":"tech1","category":"Engines & APU","question":"Which ENGINE START switch position will provide ignition to both igniters regardless of igniter selector switch position when the engine start lever is in IDLE?","options":["CONT","FLT","CONT and FLT","GRD"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-36","source":"tech1","category":"Air Systems","question":"Bleed air is taken from stage 4 and stage 10 of the high pressure compressor.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-37","source":"tech1","category":"Airplane General","question":"What is t us is always connected and powered whenever the aircraft battery is fitted?","options":["Battery bus - power immediately available to important systems such as fire extinguishers.","DC Standby bus - power to important systems that require to be in standby mode.","Hot Battery Bus - power immediately available to important systems such as fire extinguishers.","AC standby bus- powered through Transformer Rectifier to ensure no power interuption to GPS system"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-17-44","source":"tech1","category":"Fire Protection","question":"How many fire extinguisher bottles are fitted for the Cargo compartments?","options":["2 fire extinguisher bottles, 1 rapid discharge bottle and one smaller slow discharge bottle.","1 fire extinguisher bottle, that can be selected to be discharged into either cargo hold.","1 fire extinguisher bottle that can only be discharged into forward cargo hold.","2 fire extinguisher bottles, one for forward cargo hold, and one for rear cargo hold."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-45","source":"tech1","category":"Flight Controls","question":"In the IAS/MACH Display, to the left of the displayed figure, what does a flashing \"A\" indicate?","options":["Underspeed limiting, Vmo or Mmo limit.","Underspeed limiting, FMC or selected speed can not be reached.","Overspeed limiting, Minimum speed for current flap setting cannot be achieved.","Overspeed limiting, current speed selection greater than current flap setting limit."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-17-46","source":"tech1","category":"Engines & APU","question":"How can the Fire Warning Bell be silenced on the flight deck?","options":["Push the master fire warn lights, push fire warning bell cutout switch.","Fire bell can only be silenced by pressing either master fire warn light.","Push the Master Fire Warn lights, press the Horn Cutout of the APU Ground Control Panel.","Push the master fire warn lights, press the horn cutout of the APU ground control panel, push fire warning bell cutout switch."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-47","source":"tech1","category":"Landing Gear","question":"With RTO selected, the system will automatically apply maximum brake pressure when the thrust levers have been retarded to idle with speed at or above 90 kts.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-48","source":"tech1","category":"Hydraulics","question":"What is the maximum hydraulic system pressure.","options":["3,500 psi","3,000 psi","4,000 psi","4,500 psi"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-49","source":"tech1","category":"Automatic Flight","question":"On later aircraft YW130 through YW164, the VHF NAV switch changes the source of the data that the DEUs use for the NDs. What data is transferred by this switch?","options":["DME, ILS/GLS, VOR, MCP course.","DME, GBAS, VOR, Autothrottle, MCP Course.","VOR, GBAS, MCP course","DME, ILS, VOR, MCP course."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-17-50","source":"tech1","category":"Engines & APU","question":"What normally provides the N1 limits and target N1 values to the Autothrottle?","options":["The Electronic Engine Controls (EECs).","The Flight Control Computers.","The Flight Management Computer.","The Autothrottle Computer."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-1-1","source":"tech2","category":"Automatic Flight","question":"What pitch mode is annunciated in the FMA after takeoff when the autopilot is first engaged in CMD?","options":["VNAV","CWS P","V/S","MCP SPD"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-1-2","source":"tech2","category":"Automatic Flight","question":"How can VNAV be terminated?","options":["LOC capture","Selecting HDG SEL","Selecting a different pitch mode","selecting LNAV"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-1-3","source":"tech2","category":"Flight Controls","question":"When does the underspeed limiting symbol (flashing \"A\") appear in the MCP IAS/Mach display?","options":["Minimum speed for current flap setting cannot be reached.","When the speed is equal to or less than 1.3 VS for current flap setting.","FMC speed or selected speed cannot be reached.","The highest of the other three answers."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-1-4","source":"tech2","category":"Automatic Flight","question":"During a single autopilot approach and landing, a single press of either TO/GA switch in response to a Go-around will result in which of the following situations?","options":["The A/P Go-around is only available after the second push of the TO/GA switch.","A manual F/D Go-around is available","An A/P Go-around will automatically engage.","Automatic A/P Go-around occurs after FLARE armed annunciates."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-5","source":"tech2","category":"Airplane General","question":"After lift-off the A/T remains in THR HLD until which altitude?","options":["400 feet Radio Altitude and 18 seconds after lift-off.","800 feet above Field Elevation.","400 feet Radio Altitude.","800 feet Radio Altitude and 18 seconds after lift-off."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-6","source":"tech2","category":"Automatic Flight","question":"What happens if a persistent localizer/glideslope anomaly or ground station failure is detected during a single channel or F/D only approach?","options":["The autopilot will only disengage below 2000ft","The autopilot will remain engaged","The heading and pitch modes will change to HDG SEL and V/S","The autopilot will disengage and/or the F/D bars will be removed"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-1-7","source":"tech2","category":"Engines & APU","question":"Which A/T modes permit manual thrust changes without A/T interference?","options":["N1 and ARM.","THR HLD and ARM.","GA and ARM.","THR HLD Only."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-8","source":"tech2","category":"Automatic Flight","question":"Which mode must be selected on the MCP before the second A/P can be selected to engage in CMD during a dual channel A/P approach?","options":["VOR/LOC","APP","LNAV","VNAV"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-9","source":"tech2","category":"Automatic Flight","question":"Which of the following actions would terminate VNAV?","options":["Selecting a different pitch mode.","Selecting LNAV.","LOC capture.","Selecting HDG SEL."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-1-10","source":"tech2","category":"Engines & APU","question":"The loss of one DEU results in activation of both the EEC's in alternate mode. In this situation, which of the following statements is correct?","options":["The EEC's automatically switch into hard mode and the engines might overboost.","The soft alternate mode is entered first, using last valid flight condition to define engine parameters.","You can only enter the hard mode by manually selecting it on the engine control panel.","If the thrust levers are reduced the hard mode is entered and last valid flight conditions will be used for the engine parameters."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-11","source":"tech2","category":"Engines & APU","question":"Which of the following actions would cause a displayed ENG FAIL Alert to extinguish?","options":["Engine fire bottle discharged.","Engine fire warning switch pulled.","EEC set to ALTERNATE.","Start lever moved to IDLE."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-12","source":"tech2","category":"Engines & APU","question":"Where is the Engine Fuel Flow is measured?","options":["Before the fuel reaches the HMU.","Before passing through the second stage engine fuel pump.","After passing through the engine fuel shutoff valve.","After passing through the fuel filter."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-1-13","source":"tech2","category":"Engines & APU","question":"Auto-relight is provided for flameout protection, with the EEC activating both igniters. Which of the following situations would cause Flameout Protection to operate?","options":["Rapid decrease in fuel flow.","Rapid decrease in EGT.","Rapid decrease in N2, or N2 below idle RPM.","Rapid decrease in N1, or N1 below idle RPM."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-1-14","source":"tech2","category":"Engines & APU","question":"If a wet start is detected, when will the EEC automatically turn off ignition and shut off fuel to the engine?","options":["10 seconds on the ground or 30 seconds in flight after the start lever is moved to IDLE.","15 seconds after the air start valve opens.","No automatic shutdown is provided for a wet start.","15 seconds after the start lever is moved to IDLE during ground starts."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-1-15","source":"tech2","category":"Engines & APU","question":"If the EGT exceeds the starting limit during an engine start, in what circumstances would the EEC automatically turn off ignition and shut off fuel to the engine?","options":["never","in flight only","on the ground and in flight","on the ground only"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-1-16","source":"tech2","category":"Electrical","question":"If you attempt to start the APU and it will not start, what may be the cause?","options":["OAT is above 40 degrees C","Less than 453Kg of fuel in the centre tank","No AC power available","APU fire switch on the overheat/fire panel is not in."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-17","source":"tech2","category":"Engines & APU","question":"In flight, when does the EEC automatically select Approach Idle?","options":["Flaps are in the landing configuration or engine anti-ice is ON for either engine.","Flaps are in the landing configuration and thrust lever angle is above 34 degrees for ches are selected to STBY RUD","Only when the Yaw Damper is selected on"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-23","source":"tech2","category":"Hydraulics","question":"Which of the following are powered by the Standby Hydraulic system?","options":["Leading edge devices, rudder, thrust reversers and standby yaw damper.","Inboard spoilers, rudder and thrust reversers.","Alternate brakes, thrust reversers and standby yaw damper.","Outboard spoilers, rudder and thrust reversers."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-1-24","source":"tech2","category":"Hydraulics","question":"When will hydraulic pressure from System B be used to retract the landing gear?","options":["After a failure of the number 1 engine hydraulic pump with the landing gear still down and the landing gear lever is positioned UP","When the ALTERNATE NOSE WHEEL Switch is positioned ON.","Number 1 engine RPM drops below limit value, with either main landing gear still down and the landing gear lever is positioned Up.","When System A pressure is zero and the landing lever is positioned UP."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-1-25","source":"tech2","category":"Hydraulics","question":"With the No 1 engine running, what is the effect of switching ENG 1 hydraulic pump OFF?","options":["Transfers system to ENG 2 pump output.","Pump continues to run and output is diverted to Electric hydraulic pump.","Pump continues to be driven by the engine, but it's output is isolated from the rest of the hydraulic system.","Pump drive is disconnected."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-1-26","source":"tech2","category":"Electrical","question":"Which statement is true when the STANDBY POWER Switch is selected to OFF (the center position)?","options":["The 'STANDBY PWR OFF' light will illuminate (amber).","The Static Inverter provides 28 volt DC power to Transfer Bus No 1.","Automatic switching is provided from normal power sources to alternate power sources.","The 'STANDBY PWR OFF' light will extinguish."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-1-27","source":"tech2","category":"Electrical","question":"On the ground, what would cause the TR UNIT light to illuminate (amber)?","options":["TR 3 has failed.","TR 1 has failed.","Any TR has failed","Only if TR 2 and TR 3 have failed."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-1-28","source":"tech2","category":"Electrical","question":"Which bus is always connected to the main battery?","options":["DC Standby Bus","Hot Battery Bus","Switched Hot Battery Bus","Battery Bus"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-29","source":"tech2","category":"Electrical","question":"What does illumination of the ELEC light indicate whilst on the ground?","options":["DC power system fault.","A fault in the AC power system","Standby power system fault.","A fault exists in the DC Power System or Standby Power System"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-1-30","source":"tech2","category":"Electrical","question":"When will the ELEC Light illuminate on the ground?","options":["When a fault exists in the AC or standby power system.","When a fault exists in the DC or standby system.","The ELEC light only operates in flight.","When a fault exists in the AC, DC or the standby system."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-31","source":"tech2","category":"Electrical","question":"When will the APU GEN OFF BUS illuminate?","options":["Whenever the APU is not running.","When the APU is at operational speed but is not supplying an AC transfer bus.","Whenever the APU is supplying power to generator bus No l.","Whenever the APU is supplying power to generator bus No 2."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-32","source":"tech2","category":"Electrical","question":"What does an illuminated GEN OFF BUS light indicate?","options":["The related generator bus is not powered.","The IDG is not supplying power to the related transfer bus.","The generator is not supplying power to the related generator bus","The related transfer bus is not powered."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-33","source":"tech2","category":"Electrical","question":"The related transfer bus is not powered.","options":["The standby power control unit supplies TR3","At glideslope capture DC Bus 1 and DC Bus 2 are isolated from each other","DC Bus 1 and DC Bus 2 are connected by the cross bus tie relay","The AC Busses are isolated from the DC busses"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-1-34","source":"tech2","category":"Landing Gear","question":"What happens if you reject a takeoff after reaching 90 knots with the AUTO BRAKES in RTO?","options":["Maximum braking is applied automatically when thrust levers are retarded to IDLE.","Automatic braking when reverse thrust is selected.","The AUTO BRAKE DISARM light will illuminate.","Maximum braking occurs when speed brake is deployed."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-1-35","source":"tech2","category":"Hydraulics","question":"Which statement is true when the landing gear Manual Extension Access Door is open?","options":["Manual landing gear extension is possible with landing gear lever in any position.","Landing gear retraction is enabled.","Normal gear extension is possible if hydraulic system B pressure is available.","Normal landing gear extension is possible with the loss of hydraulic system A."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-1-36","source":"tech2","category":"Landing Gear","question":"The red landing gear indication lights are illuminated under which of the following conditions?","options":["Landing gear is up and locked with gear lever in the OFF position.","Landing gear is not down and locked (with either or both thrust levers retarded to idle, and below 800 feet AGL).","Landing gear is in disagreement with LANDING GEAR lever position OR the landing gea
