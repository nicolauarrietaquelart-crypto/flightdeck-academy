alternate mode.","The soft alternate mode is armed."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-7-28","source":"tech1","category":"Engines & APU","question":"After starting the engine and it achieving Stabilised Idle (59% N2), a low oil pressure condition would be identified by the amber LOW OIL PRESSURE annunciation on the upper DU, and the Lower DU displaying OIL PRESS Pointer in the Amber band.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-29","source":"tech1","category":"Engines & APU","question":"Raising an engine start lever to the IDLE position opens which fuel valve(s)?","options":["The related spar fuel shutoff valve and engine-mounted fuel shutoff valve.","The related engine-mounted fuel shutoff valve.","The related spar fuel shutoff valve.","The related engine-mounted fuel shutoff valve and engine bypass valve."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-7-30","source":"tech1","category":"Engines & APU","question":"What is the indication of an impending oil filter bypass due to contamination?","options":["An amber OIL FILTER BYPASS alert illuminates on the upper display unit.","Illumination of the FILTER BYPASS warning light on the Fuel Panel.","An amber OIL FILTER BYPASS alert illuminates on the upper display unit and illumination of the Master Caution and ENG system annunciator lights.","Illumination of the Master Caution and ENG system annunciator lights."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-7-31","source":"tech1","category":"Engines & APU","question":"The REVERSER light located on the aft overhead panel illuminated during a normal reverse sequence indicates ?","options":["The isolation valve has failed to open and the thrust reverser control valve has not moved to the deploy position.","One or more faults in the system if the light illuminates at the start of the sequence.","A normal indication until the reverser sleeves are stowed at the completion of the reverse sequence.","A normal indication if the light extinguishes 10 seconds after the thrust reverser is commanded to stow."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-7-32","source":"tech1","category":"Engines & APU","question":"The B737-800 has no In-Flight Abnormal Start Protection.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-7-33","source":"tech1","category":"Engines & APU","question":"When does the OIL FILTER BYPASS alert illuminate on the upper display unit?","options":["Illuminates just prior to oil pump bypass opening as pressure gets near to pressure required to open the bypass.","Once the oil filter bypass has opened and oil is bypassing the filter.","Illuminates prior to oil bypassing the scavenge filter.","If the oil filter bypass has failed in the closed position and oil pressure is beginning to increase."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-7-34","source":"tech1","category":"Engines & APU","question":"As well as the indication on the Lower DU, engine oil quantity can be physically checked using the gauges located in the Main Undercarriage Wheel Well.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-35","source":"tech1","category":"Engines & APU","question":"During an In-flight start, if a wet start is detected, when will the EEC turn off ignition and fuel to the engine?","options":["As soon as the wet start is detected by the EEC.","No in-flight abnormal start protection.","15 seconds after start lever moved to Idle.","10 seconds after start lever moved to Idle."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-36","source":"tech1","category":"Engines & APU","question":"At what rotational speed is the Start Lever moved to the IDLE position?","options":["Max Motoring - 25% N2.","Starter cutout speed - 56% N2.","Starter cutout speed - 56% N1.","Max motoring - 56% N1."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-7-37","source":"tech1","category":"Engines & APU","question":"When is the EGT Start Limit Redline displayed?","options":["Until starter cutout speed (approx 56%)","The EGT start Limit Redline is only displayed if the EGT exceeds the Start Limit.","Until the engine achieves stabilised idle (approx 59%)","Until the engine achieves self sustaining idle (approx 50%)"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-7-38","source":"tech1","category":"Engines & APU","question":"What is the indication that the thrust reverser sleeves have moved from the stowed position and have reached the deployed position?","options":["The REV thrust reverser indication located on the upper display unit illuminates green.","The reverse thrust lever may be moved beyond the interlock position.","The amber REV thrust reverser indication located on the upper display unit illuminates.","The REVERSER light on the aft overhead panel illuminates."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-7-39","source":"tech1","category":"Engines & APU","question":"What does a Red Box around an N1 RPM Digital Readout mean - when the aircraft is on the ground and the engine has been shut down?","options":["An inflight exceedance has occurred.","The N1 Limit Bug has been set manually.","This situation cannot occur - the Red Box only occurs in flight to indicate an operating limit is currently being exceeded.","The N1 RPM display has suffered a malfunction in flight."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-7-40","source":"tech1","category":"Engines & APU","question":"If the forward thrust lever is reduced to idle while the EEC is in the soft alternate mode, what is the result?","options":["The EEC will remain in the soft alternate mode, the ALTN switch illuminates and the ON indication remains visible.","Approach idle is commanded by the EEC.","The EEC enters the hard alternate mode, the ALTN switch remains illuminated and the ON indication is blanked.","The EEC enters the hard alternate mode, the ALTN switch remains illuminated and the ON indication remains visible."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-7-41","source":"tech1","category":"Engines & APU","question":"When GRD is selected and the eng start switch is selected to either 1 or 2, how are the crew alerted to the start valve opening?","options":["An amber START VALVE OPEN alert is displayed on the lower DU.","The blue START VALVE light illuminates bright blue then goes dim blue once the start valve is fully open.","A START VALVE OPEN alert is displayed on the upper DU.","The only indication is the N2 gauge increasing to Max Motoring (25%)."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-8-1","source":"tech1","category":"Fire Protection","question":"As well as using the DISCH switch on the Fire Protection panel in the flight deck, an APU fire can be extinguished by discharging the APU fire extinguisher using the APU Ground Control Panel, which is located in a quick release access panel immediately forward and below the APU.","options":["False","True","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-8-2","source":"tech1","category":"Fire Protection","question":"How many fire extinguisher bottles are fitted for the Cargo compartments?","options":["1 fire extinguisher bottle, that can be selected to be discharged into either cargo hold.","2 fire extinguisher bottles, 1 rapid discharge bottle and one smaller slow discharge bottle.","1 fire extinguisher bottle that can only be discharged into forward cargo hold.","2 fire extinguisher bottles, one for forward cargo hold, and one for rear cargo hold."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-8-3","source":"tech1","category":"Fire Protection","question":"What do the 3 green illuminated lights at the bottom right of the engine fire panel indicate?","options":["Fire extinguisher test continuity normal.","Fire Switch handles functional test satisfactory.","Fire extinguisher functional test completed satifactorily.","Fire warning system test 1 completed satisfactorily."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-8-4","source":"tech1","category":"Fire Protection","question":"How can the Fire Warning Bell be silenced?","options":["Pushing the Master FIRE WARN light, or pushing the bell mute button located next to the speaker on the flight deck ceiling.","The fire warning bell is only silenced once the condition causing the Overheat or Fire warning has been removed.","Only by pushing the Master FIRE WARN light","Pushing Master FIRE WARN light or pushing the BELL CUTOUT switch located on the Overheat/Fire Protection panel."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-8-5","source":"tech1","category":"Fire Protection","question":"How might it be possible to determine if the toilet fire extinguisher has been discharged?","options":["Discharge indicator panel above lavatory door illuminated and Temperature indicator placard in lavatory changes colour from white to black.","Steady red light remains illuminated on Lavatory ceiling smoke detector panel after alarm tone has silenced and Lavatory Fire warning illuminated on flight deck.","Discharge nozzles changed colour from black to grey and Temperature indicator placard in lavatory changes colour from white to black.","Discharge nozzles changed colour from black to grey and Pressure gauge on fire bottle in the red zone."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-8-6","source":"tech1","category":"Fire Protection","question":"The engines and APU have fire extinguishing systems, but the cargo holds and wheel well have only suppression systems.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-8-7","source":"tech1","category":"Fire Protection","question":"After pressing the DISCH switch, how long does it take for the cargo fire DISCH light to illuminate to indicate that the Cargo Fire Suppression system has been fully activated?","options":["Immediately.","195 minutes.","Up to 60 seconds.","Up to 30 seconds"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-8-8","source":"tech1","category":"Fire Protection","question":"Boeing provide the option for 2 Cargo Fire extinguisher bottles to be fitted, one is a rapid discharge bottle which is fully discharged immediately upon pressing the DISCH switch on the Cargo Fire Panel, the second bottle is a slow discharge bottle that is released 1 minute after the discharge of the first bottle, and discharges slowly over several minutes to provide a total of 195 minutes of fire suppression in the cargo holds. This second slow discharge fire extinguisher bottle is NOT fitted in any Ryanair B737-800 aircraft.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-8-9","source":"tech1","category":"Fire Protection","question":"What is the effect of pulling up the No1 Fire DISCH switch?","options":["Closes engine and spar fuel shutoff valves, closes inlet valve to both Air Conditioning Packs, trips IDG control relay, arms both Squibs on both on both engine fire bottles, and allows the DISCH switch to be rotated left or right.","Closes engine fuel shutoff valve, closes engine bleed air valve, trips IDG control relay, closes hydraulic fluid shutoff valve and isolates EDP low pressure warning light, disables thrust reverser, arms Squib on No1 engine fire bottle, and allows the DISCH switch to be rotated to the left to discharge bottle into N01 engine.","Closes engine and spar fuel shutoff valves, closes engine bleed air valve, trips IDG control relay, closes hydraulic fluid shutoff valve and isolates EDP low pressure light, disables thrust reverser, arms one Squib on both engine fire bottles, and allows the DISCH switch to be rotated left or right.","Extinguishes Master Caution and Fire Warning lights, silences Fire Warning Bell, shuts down No1 engine, and discharges No1 Fire Bottle into No1 engine."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-8-10","source":"tech1","category":"Fire Protection","question":"The engines have both Overheat and Fire warnings, the APU, cargo holds and wheel well have ONLY Fire warnings.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-8-11","source":"tech1","category":"Fire Protection","question":"The picture below shows that there is a fault in the left engine Overheat/Fire Detection Loops. How would you determine which of the 2 loops had failed?","options":["This indication only occurs when BOTH loops have failed.","Move to FAULT/INOP - OVHT/FIRE switch to the central TEST position, then test one loop at a time using the OVHT DET switch selected first to A and then B.","Carry out the test again one loop at a time using the OVHT DET switch selected to A and then B.","Carry out the test again with the switch selected to FAULT/INOP testing each loop individually with the OVHT DET switch at A then B."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-8-12","source":"tech1","category":"Fire Protection","question":"The Engine Fire DISCH switches are mechanically locked in the Down position and can only be pulled Up when an Overheat or Fire is detected and the switch has illuminated.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-9-1","source":"tech1","category":"Flight Controls","question":"The flap slat electronic unit (FSEU) provides flap load relief for all aircraft from Flap 10 through to Flap 40.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-9-2","source":"tech1","category":"Flight Controls","question":"The yaw damper provides inputs to the rudder to provide which of the following, and what effect does it have on the rudder pedals?","options":["Provides Gust Dampening, Dutch roll prevention and Turn coordination. The rudder pedals are not displaced by yaw damper operation.","Provides Gust Dampening and Turn coordination. The rudder pedals are not displaced by yaw damper operation.","Provides Gust Dampening, Dutch roll prevention and Turn coordination. The rudder pedals are displaced by yaw damper operation to provide feedback to the pilot.","Provides Gust Dampening and Turn coordination. The rudder pedals move to match rudder movement for feedback to the pilot."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-9-3","source":"tech1","category":"Flight Controls","question":"How does the Stall Identification system help the pilot identify and prevent further movement into a stalled condition?","options":["Elevator Feel Shift Module increase, hydraulic system A pressure to the Elevator Feel and Centering Unit, significantly increasing the force required to move the control column rearwards to continue into a stalled condition.","The elevator feel shift module prevents the yaw damper from making any rudder movement, and the stick shaker activates.","The yaw damper provides 2 degrees of rudder movement, and the speed trim system automatically pushes the control column forward to warn the pilot that a stall condition was being approached.","Elevator Feel Shift Module increase, hydraulic system A pressure to the Elevator Feel and Centering Unit, moving the elevator to provide at least 15 degrees of nose down pitch."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-9-4","source":"tech1","category":"Flight Controls","question":"Selecting the Flap lever to the FLAP 1 Gate causes the LE Flaps to move to what position?","options":["Flap 1 position","Flap 15 position.","Takeoff setting","Fully Extended"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-9-5","source":"tech1","category":"Flight Controls","question":"What should the maximum flap extension altitude be?","options":["41,000 feet","Field elevation plus 1000 feet.","2500 feet RA","20,000 feet"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-9-6","source":"tech1","category":"Flight Controls","question":"What does a FLT CONTROL \"LOW PRESSURE\" light illuminated amber indicate?","options":["Related hydraulic system pressure to ailerons, elevator and rudder is low.","Both hydraulic systems pressure to ailerons, elevator and rudder are low.","The STBY RUD system pressure is low.","This light is illuminated whenever the associated FLT CONTROL switch is in the OFF position."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-9-7","source":"tech1","category":"Flight Controls","question":"On later aircraft YW098 to YW164 (short field performance aircraft) the leading edge slats do not move from the extended to the fully extended position until the Flap lever is moved beyond the Flap 25 position.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-9-8","source":"tech1","category":"Flight Controls","question":"The flap slat electronic unit (FSEU) will close the trailing edge bypass valve if it detects trailing edge flap asymmetry, skew or uncommanded motion; thus stopping the movement of the flaps via the normal system. However, the flaps can still be moved by means of electric motors.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-9-9","source":"tech1","category":"Flight Controls","question":"What happens to the speed brakes if the SPEED BRAKE lever is left in the DOWN position during landing.","options":["The ground spoilers will deploy on landing if all other conditions are met, but flight spoilers will not deploy.","The speed brake lever will automatically move to the up position and the spoilers will deploy as normal if all other required conditions are met.","The spoilers will not deploy regardless of all other required conditions being met.","The flight spoilers will deploy on landing if all other conditions are met, but ground spoilers will not deploy."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-9-10","source":"tech1","category":"Flight Controls","question":"What does the SPEED BRAKE DO NOT ARM light (located on the left forward panel) indicate when illuminated amber?","options":["The speed brakes must not be extended as airspeed currently too high for safe operation.","Indicates that the wheel speed has dropped below 60 kts on landing and the speedbrake lever has not been moved to the down position.","Illuminated whenever forward thrust levers are advanced beyond takeoff thrust whilst aircraft on the ground","Indicates an abnormal condition or test input in the speed brake system."],"answer":4,"explanation":"Indicates an abnormal condition or test input in the speed brake system and indicates that the wheel speed has dropped below 60 kts on landing and the speedbrake lever has not been moved to the down position.","type":"mcq"},{"id":"tech1-9-11","source":"tech1","category":"Flight Controls","question":"What is the purpose of the ALTERNATE FLAPS master switch, and why is the cover red?","options":["Fully extends the leading edge devices, and can extend and retract the trailing edge flaps. Red because the action cannot be reversed, leading and trailing edge devices cannot be retracted once extended.","Closes the trailing edge flap bypass valve, activates standby pump, and arms ALTERNATE FLAPS position switch. Red because the action of extending the leading edge devices cannot be reversed in flight.","Closes the trailing edge flap bypass valve, activates standby pump, and arms ALTERNATE FLAPS position switch. Red because the action of extending the trailing edge devices cannot be reversed in flight.","Fully extends the leading and trailing edge flaps. Red because the action cannot be reversed, leading and trailing edge devices cannot be retracted once extended."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-9-12","source":"tech1","category":"Flight Controls","question":"What will cause the STBY RUDDER ON light to illuminate?","options":["Only illuminated when the standby rudder system has been manually commanded on by selecting a FLT CONTROL switch to STBY RUD - not illuminated when standby rudder system automatically commanded on.","Only illuminated when the standby rudder system has been automatically commanded on - not illuminated when standby rudder system has been manually commanded on by selecting the FLT CONTROL switch to STBY RUD.","Standby rudder system is commanded on, either manually or automatically, to pressurise the standby rudder PCU.","Standby rudder system is commanded on, to pressurise the standby rudder PCU, by selecting YAW DAMPER switch to OFF."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-9-13","source":"tech1","category":"Flight Controls","question":"On landing, when do the ground spoilers extend?","options":["Compression of any landing gear strut.","Compression of the nose landing gear.","Compression of the right main landing gear strut.","Compression of the left main landing gear strut."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-10-1","source":"tech1","category":"Flight Instruments","question":"What condition causes an Amber IAS DISAGREE alert to appear at the bottom of the speed tape?","options":["Captain's and First Officer's airspeeds disagree by more than 5 kts for more than 5 seconds.","Difference of more than 10 kts for more than 10 seconds between Captain's and First Officer's airspeed indications.","Selected V Ref is not correct for current aircraft configuration.","V Ref has not been entered"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-10-2","source":"tech1","category":"Flight Instruments","question":"What does the top of the amber bar indicate at the lower end of the speed tape?","options":["Minimum manoeuvre speed (1.3g manoeuvre capability to stick shaker below approximately 20,000 feet) - (1.3g manoeuvre capability to low speed buffet above approximately 20,000 feet).","Minimum manoeuvre speed (1.3g manoeuvre capability to stick shaker below approximately 30,000 feet) - (1.3g manoeuvre capability to low speed buffet above approximately 30,000 feet).","Minimum manoeuvre speed (1.3g manoeuvre capability to stick shaker above approximately 20,000 feet) - (1.3g manoeuvre capability to low speed buffet below approximately 20,000 feet).","Minimum manoeuvre speed (1.3g manoeuvre capability to stick shaker above approximately 30,000 feet) - (1.3g manoeuvre capability to low speed buffet below approximately 30,000 feet)."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-10-3","source":"tech1","category":"Flight Instruments","question":"What does a white CDS MAINT message in the lower left corner of the PFD indicate?","options":["A dispatchable CDS fault has occurred prior to first engine start.","A non-dispatchable CDS fault has occurred prior to second engine start","A non-dispatchable CDS fault has occurred post second engine start.","A dispatchable CDS fault has occurred prior to second engine start."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-10-4","source":"tech1","category":"Flight Instruments","question":"What does the Magenta figure displayed above the Speed Tape signify?","options":["Current or next speed restriction in the FMC.","Maximum airspeed for current flap settings.","FMC computed airspeed if the IAS/MACH window is blank.","Airspeed manually selected in the IAS/MACH window."],"answer":4,"explanation":"Airspeed manually selected in the IAS/MACH window and FMC computed airspeed if the IAS/MACH window is blank.","type":"mcq"},{"id":"tech1-10-5","source":"tech1","category":"Flight Instruments","question":"On the PFD, what does the amber annunciation \"DISPLAYS CONTROL PANEL\" indicate?","options":["The EFIS control panel on the side the annunciation is displayed has failed","The Displays Source Control Panel on the side the annunciation is displayed has failed.","The PFD the annunciation is displayed on has an error and information displayed may be erroneous.","The Display Select Panel on the the side the annunciation is displayed has failed."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-10-6","source":"tech1","category":"Flight Instruments","question":"The amber annunciation \"INSTR SWITCH\" indicates what?","options":["Captain's and First Officer's displays are using separate sources of IRU data.","The IRS switch on the Aft Overhead panel is not selected to NORMAL.","The IRS switch on the Forward Overhead panel is not selected to NORMAL","Captain's and First Officer's displays are using the same source of IRU data with the IRS switch selected to OFF."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-10-7","source":"tech1","category":"Flight Instruments","question":"On the navigation display, how is the display presented in VOR, Approach and Plan modes?","options":["VOR = true north up, Approach = heading up, Plan = heading up.","VOR = true north up, Approach = true north up, Plan = heading up.","VOR = heading up, Approach = true north up, Plan = heading up.","VOR = heading up, Approach = heading up, Plan = true north up."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-10-8","source":"tech1","category":"Flight Instruments","question":"The bug below that indicates V2 + 15 is displayed at what stage of flight, and when is it removed?","options":["Displayed at Takeoff, removed at first flap retraction or when Vref entered in CDU.","Displayed at Approach, removed when flaps at Flap 1 or greater.","Displayed at takeoff, removed when Pitch Flight director moves to 15 degrees nose up.","Displayed on Approach, removed once right main landing gear is compressed, throttle levers at Idle, and engines have spooled down from Approach Idle to Ground Idle."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-11-1","source":"tech1","category":"FMS & Navigation","question":"If IRS alignment is lost in flight, the navigation mode becomes inoperative for the remainder of the flight.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-11-2","source":"tech1","category":"FMS & Navigation","question":"On later aircraft YW059 through YW164, what is the default Vertical Required Navigational Performance (VRNP) used by the FMC for oceanic, en route, and terminal phases of flight?","options":["400 feet.","250 feet below, 400 feet above the aircraft planned altitude.","400 feet below, 250 feet above the aircraft planned altitude.","250 feet."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-11-3","source":"tech1","category":"FMS & Navigation","question":"How many ILS receivers are installed in Ryanair B737-800 aircraft?","options":["1 receiver with 2 seperate channels.","2 main receivers and a standby single channel receiver.","2 receivers.","4 receivers."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-11-4","source":"tech1","category":"FMS & Navigation","question":"Where on the FMC CDU are the GPS latitude and longitude displayed?","options":["INIT REF","NAV DATA","POS REF page 2","POS INIT page 1"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-11-5","source":"tech1","category":"FMS & Navigation","question":"What colour is the route on the Nav display when you activate a route by pressing the R6 switch?","options":["Magenta.","Dashed Cyan","Dashed Magenta","White"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-11-6","source":"tech1","category":"FMS & Navigation","question":"The image below shows the IRS panel located on the AFT overhead panel, for later aircraft YW130 through YW164. Other than OFF, what are the switch positions in the clockwise order?","options":["NAV, ALIGN, ATT.","NAV, ALIGN, GLS","ALIGN, NAV, ATT.","ATT, ALIGN, NAV."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-11-7","source":"tech1","category":"FMS & Navigation","question":"A total of 99 numbered waypoints cannot be exceeded for any single route.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-11-8","source":"tech1","category":"FMS & Navigation","question":"What does the GPS light illuminating indicate when either annunciator panel is pushed to initiate a recall?","options":["Single GPS sensor unit failure.","GPS left and right system running in degraded mode.","IRS left or right selector switch selected to ATT.","Failure of both GPS sensor units"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-11-9","source":"tech1","category":"FMS & Navigation","question":"On later aircraft YW130 through YW164, the VHF NAV switch changes the source of the data that the DEUs use for the NDs. What data is transferred by this switch?","options":["DME, ILS/GLS, VOR, MCP course","DME, GBAS, VOR, Autothrottle, MCP Course.","DME, ILS, VOR, MCP course.","VOR, GBAS, MCP course"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-11-10","source":"tech1","category":"FMS & Navigation","question":"How long are the navigation databases valid for?","options":["48 Hours","Valid until next update","28 Days","21 Days"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-11-11","source":"tech1","category":"FMS & Navigation","question":"Which indications are correct for a single FMC failure (left FMC fails)?","options":["FMC P/RST amber light illuminates, A/P P/RST light illuminates, LNAV and VNAV disconnect if engaged, left ND not available.","FMC CDU FAIL light illuminates, left FMC CDU screen blanks, left ND screen blanks, LNAV diengages with VNAV remaining available.","FMC P/RST amber light illuminates, normal operation continues with remaining functioning FMC automatically driving both ND screens.","FMC P/RST amber light illuminates, FAIL light on FMC CDU illuminates, LNAV and VNAV disconnect if engaged, failure information displayed on left ND after delay of 25 to 30 seconds."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-11-12","source":"tech1","category":"FMS & Navigation","question":"When setting up the FMC, what Pre-flight information is required.","options":["Initial Position, Takeoff and Climb Thrust Limits, Route, Cruise Wind.","Performance Data, Navigation Database, Route, Takeoff Data.","Initial Position, Performance Data, Route, Takeoff Data.","Initial Position, SID, Route, Performance Data, Takeoff Data."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-11-13","source":"tech1","category":"FMS & Navigation","question":"What are the 2 databases the FMC uses for operation?","options":["Peformance and Terrain","Navigation and Performance","Navigation and Airports","Terrain and Airports"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-11-14","source":"tech1","category":"FMS & Navigation","question":"On the DEP/ARR page on the FMC, can more than one Arrival be entered?","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-11-15","source":"tech1","category":"FMS & Navigation","question":"On which page of the FMC is the IRS position initially set?","options":["INIT REF page.","DEP ARR page.","POS INIT page","RTE page."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-11-16","source":"tech1","category":"FMS & Navigation","question":"On aircraft with a mode selector selection of TEST, WX, WX/TURB and MAP, selecting WX/TURB displays what?","options":["Weather radar returns, and windshear out to 40 miles.","Weather radar returns and turbulence within 40 miles.","Weather radar returns, turbulence out to 40 miles, and windshear out to 20 miles.","Weather radar returns, and turbulence out to 10 miles whilst on the ground only."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-11-17","source":"tech1","category":"FMS & Navigation","question":"Regardless of what range you select on the Navigation Display, the range at which turbulence is detected is automatically limited to 40 nautical miles.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-11-18","source":"tech1","category":"FMS & Navigation","question":"In turbulence mode, at what velocity of horizontal flow of precipitation towards or away from the weather radar will the target display turn magenta?","options":["5 meters per second or greater.","10 meters per second or greater.","7.5 meters per second or greater","2.5 meters per second or greater"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-11-19","source":"tech1","category":"FMS & Navigation","question":"What forward arc does the weather radar antenna sweep?","options":["160","180","185","165"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-11-20","source":"tech1","category":"FMS & Navigation","question":"Some Ryanair B737-800 aircraft have a weather radar with the ability to be tilted a selected number of degrees above or below the horizon?","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-11-21","source":"tech1","category":"FMS & Navigation","question":"Below what altitude are windshear alerts available for aircraft fitted with IntuVue weather radar?","options":["1800 feet RA and below","1500 feet AGL and below.","1200 feet RA and below.","2300 feet AGL and below."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-11-22","source":"tech1","category":"FMS & Navigation","question":"The IntuVue weather radar fitted in aircraft YF662-YF695 and YW001-YW164, gives clutter-free viewing of significant weather out to what range?","options":["420 nautical miles.","120 nautical miles.","320 nautical miles","220 nautical miles"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-11-23","source":"tech1","category":"FMS & Navigation","question":"For the IntuVue Radar, Predictive Windshear mode is automatically turned on in which of the following specific aircraft conditions?","options":["In flight below 1500 feet AGL, on ground with both engines running.","In flight above 1200 feet RA, on ground with throttle levers at takeoff position setting.","In flight below 2300 feet AGL, on ground with throttle levers at takeoff position setting.","In flight below 1800 feet AGL, on ground with throttle levers set for takeoff."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-11-24","source":"tech1","category":"FMS & Navigation","question":"Some weather radar (WXR) panels have an manual altitude control switch (ALT) - when in MAN mode, this can be used to achieve which of the following:","options":["Controls weather analysis altitude from 0 - 60,000 MSL in 1000 feet increments","Controls weather analysis alitude from 500 - 60,000 feet MSL in 100 feet increments","Controls weather analysis alitude from 0 - 41,000 feet MSL in 100 feet increments","Manual altitude control is NOT available on any WXR control panels."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-11-25","source":"tech1","category":"FMS & Navigation","question":"If the aircraft present position cannot be entered through the FMC CDU, it can be entered using the ISDU keyboard.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-11-26","source":"tech1","category":"FMS & Navigation","question":"Setting the ADF mode selector switch to ANT has what effect?","options":["ADF bearing pointer slews to 135 degrees relative bearing.","ADF bearing data sent to Standby Radio Magnetic Indicator as well as the DUs","No ADF bearing data available and audio reception optimised.","ADF bearing data switched to keel antenna only, to minimise multipath interference."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-11-27","source":"tech1","category":"FMS & Navigation","question":"On the IRS panel, if the DC FAIL light illuminates in flight all alignment data is lost and the system cannot be re-set until the aircraft is parked on the ground.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-11-28","source":"tech1","category":"FMS & Navigation","question":"What colour is the Outer Marker Beacon (OM) displayed on the PFD?","options":["OM appears White in top right corner of AI","OM appears in Magenta in top right corner of the Attitude Indicator.","OM appears Cyan in top right corner of AI.","OM appears Magenta in lower right corner of Attitude Indicator."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-11-29","source":"tech1","category":"FMS & Navigation","question":"If alignment is lost in flight, what action can be taken?","options":["The navigation mode remains unavailable for the rest of the flight, but ALIGN mode can be selected to provide attitude reference.","The navigation mode remains unavailable for the rest of the flight, but ATT mode can be selected to provide attitude reference.","ATT mode can be selected to relevel the system and attain attitude reference, the system can then be returned to ALIGN for the 30 second Fast Align, then returned to NAV once the ALIGN light extinguishes.","IRS mode selector can be selected to ALIGN for 30 seconds then back to NAV to reset the system."],"answer":1,"explanation":"The IRS mode selectors must be moved to OFF to allow FMC to hold all GPS and navigation data for remainder of the flight.","type":"mcq"},{"id":"tech1-11-30","source":"tech1","category":"FMS & Navigation","question":"What components comprise the Flight Management System?","options":["FMCS, AFDS, A/T, IRS, GPS.","FMCS, AFDS, MCP, IRS, GPS.","FMCS, A/P, A/T, MCP, EFIS, IRS.","FMCS, AFDS, A/T, MCP, EFIS, ADIRS."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-12-1","source":"tech1","category":"Fuel","question":"With the Centre (CTR) tank FUEL PUMP switches ON, if an amber LOW PRESSURE light illuminates, it also immediately illuminates MASTER CAUTION and a FUEL system annunciator lights.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-12-2","source":"tech1","category":"Fuel","question":"Which fuel valves are Flight Crew made aware of their position by means of flight deck indications?","options":["Centre, No1 and No2 Tanks Fuel Pump Valves, Engine Fuel Shutoff Valve, Cross Feed valve.","Engine Fuel Shutoff valves, Spar Fuel Shutoff valves, Crossfeed valve, Centre, No1 and No2 tanks Fuel Pump valves.","Engine Fuel Shutoff valves, Spar Fuel Shutoff valves, Crossfeed valve.","Fuel valves are automatic with no flight deck indications."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-12-3","source":"tech1","category":"Fuel","question":"After the Centre Tank has emptied the auto shutoff logic stops the pumps, how do the pumps then function?","options":["There is no shutoff logic, the pumps continue to run with the amber LOW PRESSURE light illuminated until the Flight Crew switch the pumps to OFF.","Switching the pumps to OFF and then back to ON recycles the auto shutoff logic and the pumps will again activate.","The pumps can be activated if necessary by tripping the auto shutoff circuit breaker on Panel P6-1 behind the First Officer.","The pumps will not funtion again until the Centre tank has been refueled above 453 kg."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-12-4","source":"tech1","category":"Fuel","question":"What is the correct sequence regarding the SPAR VALVE CLOSED light during a normal engine start procedure after the START LEVER is positioned to IDLE detent?","options":["Transitions from extinguished to bright.","Transitions from extinguished, to bright and then dim.","Transitions from extinguished to dim.","Transitions from dim, to bright and then extinguishes."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-12-5","source":"tech1","category":"Fuel","question":"In flight a fuel imbalance between No1 and No2 tanks can be corrected by:","options":["A Fuel imablance cannot be rectified in flight, as fuel transfer between tanks can only be carried out on the ground using the Ground Refuelling Panel switches.","Open the Crossfeed cock, turn off the pumps on the low side until the Fuel Quantity Indicators are balanced.","Opening the crossfeed valve, turning OFF the fuel pumps for the tank with lower fuel and allowing the pumps from the tank with the higher amount of fuel to transfer fuel to the other tank until the IMBAL amber warning light extinguishes, then close the Crossfeed valve and turn back on the pumps.","Increase thrust setting on the side with higher amount of fuel and decrease thrust setting on side with lower amount of fuel."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-12-6","source":"tech1","category":"Fuel","question":"The fuel imbalance alert is only displayed when the aircraft is in the air.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-12-7","source":"tech1","category":"Fuel","question":"Where is the fuel temperature sensor located?","options":["In the No1 main tank.","In each engine Hydro-Mechanical fuel control unit.","1 in the inboard rear of each main tank","In each engine supply line adjacent to the Fuel Flow Meter"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-12-8","source":"tech1","category":"Fuel","question":"For landing, what is the maximum fuel imbalance between the No.1 and No.2 main tanks?","options":["653 Kgs.","453 Kgs.","726 Kgs.","553 Kgs."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-12-9","source":"tech1","category":"Fuel","question":"How many fuel pumps does each tank have, and where are they located?","options":["The centre tank has 1 AC fuel pump located on the front wall of the centre tank and 1 located on the rear wall of the centre tank. The No1 main tank has 1 pump located on the rear wall of the No1 tank and 1 pump located on the front wall of the No1 tank . The No2 tank has 1 pump located on the rear wall of the No2 tank and 1 pump located on the front wall of the No2 tank..","The centre tank has 2 AC fuel pumps mounted on the rear wall of the centre tank. The No1 tank has 2 AC pumps mounted in the centre tank - 1 on the front wall and one one the rear wall. The No2 tank has 2 AC pumps mounted in the centre tank - 1 on the front wall and 1 on the rear wall. There is also a Jet pump mounted in the centre tank discharging into No1 tank","The centre tank has 2 AC pumps located on the forward wall of the centre tank. The No1 main tank has 2 AC pumps located on the rear wall of the No1 tank. The No2 main tank has 2 AC pumps located on the rear wall of the No2 tank.","The centre tank has 2 AC pumps located on the forward wall of the centre tank. The No1 main tank has 1 AC pump located on the rear wall of the No1 tank. The No2 main tank has 1 AC pump located on the rear wall of the No2 tank."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-12-10","source":"tech1","category":"Fuel","question":"What are the USABLE FUEL capacities of the aircraft fuel tanks?","options":["Centre 13,066kg, No1 = 3,915kg, No2 = 3,915kg.","Centre = 3915kg, No1 = 13,066kg , No2 = 13,066kg","Centre = 12,726kg, No1 = 3,453kg, No2 = 3,453kg.","Centre = 20,025 ltr, No1 = 4,876 ltr, No2 = 4,876 ltr"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-12-11","source":"tech1","category":"Fuel","question":"What does a blue light mean on the Nitrogen Generation System (NGS).","options":["NGS system functioning in a degraded condition.","Bright blue means NGS valve closed or disagrees with commanded position","Bright blue means NGS valve closed.","Dim blue means NGS valve agrees with commanded position."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-12-12","source":"tech1","category":"Fuel","question":"What operates the spar fuel shutoff valve?","options":["AC motor from Standby Bus","Cables and pulleys","DC motor from Hot Battery Bus","Pushrods and cranks"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-12-13","source":"tech1","category":"Fuel","question":"With the engines running, the fuel CONFIG alert will be displayed by the No1 and No2 Fuel Quantity Indicators turning Amber, when the Centre tank quantity is greater than 726kg and the Centre tank pump switches are off","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-12-14","source":"tech1","category":"Fuel","question":"In the unlikely situation of total generator failure, at high altitude thrust deterioration may occur. Why?","options":["When on STBY power the HMU will be unreliable, therefore thrust deterioration might occur at high altitude","The fuel will be suction fed, which may cause dissolved air released from the fuel to restrict fuel flow in the suction feed line.","When on STBY power the fuel pumps run a little slower","Loss of AC power will affect the ignition system and therefore create a potential risk of flameout"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-12-15","source":"tech1","category":"Fuel","question":"With the engines running, the fuel CONFIG alert will be displayed by the No1 and No2 Fuel Quantity Indicators turning Amber, when the Centre tank quantity is greater than 726kg and the Centre tank pump switches are off","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-12-16","source":"tech1","category":"Fuel","question":"During cruise you note both center tank fuel pumps have failed as indicated by the illumination of both center tank fuel pump LOW PRESSURE lights. You still have 320 kg of fuel in the center tank and both main tanks are full. You will see:","options":["a CONFIG indication on the CDS","a pump LOW PRESSURE indication on the CDS","There will be no indication on CDS","a LOW indication on the CDS"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-12-17","source":"tech1","category":"Fuel","question":"During an engine start , when an engine start lever is positioned to IDLE detent, which of the following statements is correct?","options":["The related blue SPAR VALVE CLOSED light transitions from extinguished, to bright, and then dim.","The related SPAR VALVE CLOSED light is unaffected by the engine start lever position.","The related blue SPAR VALVE CLOSED light transitions from dim to extinguished.","The related blue SPAR VALVE CLOSED light transitions from dim, to bright, and then extinguished."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-12-18","source":"tech1","category":"Fuel","question":"The amber fuel IMBAL alert will remain displayed until the imbalance is reduced to:-","options":["363 kgs","91 kgs","453 kgs","726 kgs"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-12-19","source":"tech1","category":"Fuel","question":"What is the indication of the Crossfeed VALVE OPEN Light when the CROSSFEED selector is positioned OPEN and the crossfeed valve is closed?","options":["illuminated dim blue","extinguished","illuminated amber","illuminated bright blue"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-12-20","source":"tech1","category":"Fuel","question":"The center tank fuel scavenge jet pump operates when:","options":["either engine is operating","the center fuel tank is about 3/4 full","both Center Tank Fuel Pump Switches are turned OFF","the No. 1 main fuel tank is about 1/2 full"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-12-21","source":"tech1","category":"Fuel","question":"How many fuel measuring sticks are installed?","options":["20","16","6","12"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-12-22","source":"tech1","category":"Fuel","question":"During cruise both centre tank fuel pumps have failed. There is still 460 kg in the centre tank, and both main tanks are full. The upper Display Unit will show:","options":["A LOW Alert indication under centre tank.","There will be no indication on the CDS","A pump low pressure indication.","A CONFIG Alert indication."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-12-23","source":"tech1","category":"Fuel","question":"When the engine start lever is placed to CUTOFF:-","options":["The engine fuel shutoff valve only closes.","The spar fuel shutoff valve only closes.","The spar fuel shutoff valve and engine fuel shutoff valve both close.","The spar fuel shutoff valve, engine fuel shutoff valve and engine bypass valve all close."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-12-24","source":"tech1","category":"Fuel","question":"What is the source of electrical power for the engine fuel shutoff valves?","options":["the DC Standby Bus","the AC Standby Bus","the Battery Bus","the Hot Battery Bus"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-12-25","source":"tech1","category":"Fuel","question":"In-flight, the two fuel pump LOW PRESSURE Lights for main tank No.1 illuminate. What happens to the No.1 engine?","options":["it continues to operate due to the metering of fuel by the Fuel Control Unit","it receives fuel from main tank No.1 through a suction feed line that bypasses the pumps","it will shut down due to fuel starvation","it receives fuel from main tank No. 2 automatically"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-13-1","source":"tech1","category":"Hydraulics","question":"The engine hydraulic pump (ENG 1 and ENG 2) switches are switch ON:","options":["They energize the blocking valve to allow pump pressure to enter the system. The switches should remain ON at shutdown to prolong solenoid life.","They de-energize the blocking valve to allow pump pressure to enter the system. The switches should remain OFF at shutdown to prolong solenoid life.","They de-energize the blocking valve to allow pump pressure to enter the system. The switches should remain ON at shutdown to prolong solenoid life.","They energize the blocking valve to allow pump pressure to enter the system. The switches should remain OFF at shutdown to prolong solenoid life."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-13-2","source":"tech1","category":"Hydraulics","question":"Hydraulic System A powers which hydraulic system components?","options":["Landing gear, normal nose wheel steering and the power transfer unit (PTU)","Ground spoilers, trailing edge flaps and the power transfer unit (PTU)","Ground spoilers, normal nose wheel steering and the Landing Gear Transfer Unit","Alternate nose wheel steering, Alternate brakes and ground spoilers"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-13-3","source":"tech1","category":"Hydraulics","question":"Which statement is true regarding thrust reverser operation with a failure of hydraulic System A?","options":["The No.1 thrust reverser will operate normally from System B via the PTU.","The No.1 thrust reverser will be inoperative.","The No.1 thrust reverser will automatically operate using the Standby System.","The No.1 thrust reverser will operate using the Standby System if the Standby System has been manually or automatically activated."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-13-4","source":"tech1","category":"Hydraulics","question":"If a leak develops in the hydraulic System A reservoir, which associated pump(s) will have hydraulic fluid available from below the standpipe?","options":["Both the the engine driven pump (EDP) and the AC electric motor-driven pump","The engine driven pump","The AC electric motor-driven pump","Neither pump"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-13-5","source":"tech1","category":"Hydraulics","question":"Alternate nose wheel steering (NWS) is powered by system A, and normal NWS is powered by system B.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-13-6","source":"tech1","category":"Hydraulics","question":"Hydraulic System A powers which hydraulic system components?","options":["Alternate nose wheel steering, Alternate brakes and ground spoilers","Ground spoilers, trailing edge flaps and the power transfer unit (PTU)","None of the other answers are correct","Alternate nose wheel steering, Alternate brakes and ground spoilers"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-13-7","source":"tech1","category":"Hydraulics","question":"What is the maximum hydraulic system pressure.","options":["4,000 psi","3,000 psi","3,500 psi","4,500 psi"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-13-8","source":"tech1","category":"Hydraulics","question":"The purpose of the Power Transfer Unit (PTU) is to supply system A with the volume of hydraulic fluid from system B to raise the landing gear at the normal rate when system A Engine Driven Pump volume is lost.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-13-9","source":"tech1","category":"Hydraulics","question":"Which systems are powered by the hydraulic system?","options":["Flight controls, autothrottles, wheel brakes, leading and trailing edge flaps, leading edge slats, nose wheel steering, landing gear, thrust reversers.","Yaw damper, autopilot and autothrottle, flight controls, brakes, landing gear, trailing edge flaps and slats, nose wheel steering, tiller, power transfer unit, landing gear transfer unit.","Flight controls, Anti-skid, trailing edge flaps and slats, nose wheel steering, landing gear, thrust reversers, autopilots.","Flight controls, wheel brakes, leading and trailing edge flaps, leading edge slats, nose wheel steering, landing gear, thrust reversers, autopilots."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-13-10","source":"tech1","category":"Hydraulics","question":"If hydraulic system A develops a leak the engine driven pump (EDP) in system A is starved of oil before the electrical motor driven pump. If system B develops a leak, the electrical motor driven pump in system B is the first to be starved of oil?","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-13-11","source":"tech1","category":"Hydraulics","question":"The electric motor driven hydraulic pumps are cooled and lubricated by hydraulic oil passing through them - this oil is then cooled by passing through a fuel cooled oil cooler located in each main tank. What quantity of fuel must there be in each main tank to operate the electric driven pumps on the ground?","options":["726 kg","363 kg","760 kg","453 kg"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-13-12","source":"tech1","category":"Hydraulics","question":"How is hydraulic oil pressure stopped from entering the system when the Engine Driven Pumps (EDPs) are switched to OFF?","options":["A blocking valve in the pump is energised allowing it to close and stop pressure entering the system.","The EDPs are mechanically disengaged from the engine external gearbox by means of a electronic clutch.","A blocking valve in the pump is de-energised allowing it to close and stop pressure entering the system.","The EDPs are mechanically disengaged from the engine external gearbox by means of a Sprag clutch."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-13-13","source":"tech1","category":"Hydraulics","question":"Moving the STBY RUD switch to ON activates the standby pump and opens the standby rudder shutoff valve to pressurise the standby power control unit.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-13-14","source":"tech1","category":"Hydraulics","question":"What is the effect on the Standby Hydraulic System, if there is a leak in system B?","options":["No effect as the standby system has its own accumulator.","No effect as the standby system is supplied from system A.","The level in the standby system will also decrease as it is linked to system B.","The standby system will decrease but only a limited amount due to the standpipe in system B reservoir."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-13-15","source":"tech1","category":"Hydraulics","question":"While airborne and with flaps retracted, if hydraulic System A or System B loose pressure does the Standby hydraulic system automatically activate?","options":["No, automatic activation only occurs if both System A and System B loose pressure and flaps are extended.","Yes, but only if both System A and System B loose pressure.","No, automatic activation only occurs if either System A or System B loose pressure and flaps are extended.","Yes, failure of either System A or System B will cause automatic activation of the Standby hydraulic system."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-13-16","source":"tech1","category":"Hydraulics","question":"What effect will a leak in system B downstream of the EDP have on the Power Transfer Unit (PTU)?","options":["It will function as normal as it is part of the standby system and powered by system A oil pressure.","A leak in system B has no effect as the PTU only uses oil from system A to operate.","It will cease to function as it requires oil from system B to operate.","It will continue to function if required due to oil in the system B reservoir below the standpipe level."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-13-17","source":"tech1","category":"Hydraulics","question":"With a loss of system B pressure the standby system can be used to extend the leading and trailing edge devices, the leading edge devices cannot be retracted again once extended by the standby system, but the trailing edge flaps can be retracted by electric motors using the ALTERNATE FLAPS position switch, but no asymmetry or skew protection is then provided.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-13-18","source":"tech1","category":"Hydraulics","question":"Which conditions must exist when airborne for the landing gear transfer unit to operate?","options":["No. 1 engine driven pump (EDP) pressure below limits, landing gear lever is positioned up, any main landing gear is not up and locked","No. 1 engine driven pump (EDP) fails, landing gear lever is positioned up, either main landing gear is not up and locked","No. 1 engine RPM drops below a limit value, landing gear lever is positioned up, any landing gear is not up and locked","No. 1 engine RPM drops below a limit value, landing gear lever is positioned up, either main landing gear is not up and locked"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-13-19","source":"tech1","category":"Hydraulics","question":"The Power Transfer Unit (PTU) supplies pressure to which flight controls if the System B Engine Driven Pump (EDP) pressure drops below limits?","options":["Trailing Edge (TE) flaps and Leading Edge (LE) flaps","The Autoslat system and all leading edge devices","The landing gear","Trailing Edge (TE) flaps"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-13-20","source":"tech1","category":"Hydraulics","question":"Which statement is true regarding Hydraulic System A failure? The Standby hydraulic system, powered by a single electric-motor driven pump, has been manually activated.","options":["Ground spoiler are inoperative, increasing landing distance. Half of the flight spoilers on each wing are inoperative, reducing roll rate. Engine 1 thrust reverser will deploy and retract at a slower rate and some asymmetry can be anticipated during thrust reverser deployment.","Ground spoiler are inoperative, increasing landing distance. Half of the flight spoilers on each wing are inop, reducing roll rate. Both thrust reversers are powered by the Standby system to avoid asymmetry during thrust reverser deployment.","Ground spoiler are inoperative, increasing landing distance. Half of the flight spoilers on each wing are powered by the Standby hydraulic system. Engine 1 thrust reverser will deploy and retract at a slower rate and some asymmetry can be anticipated during thrust reverser deployment.","Ground spoilers are powered by the Standby system and are operative. Half of the flight spoilers on each wing are inoperative, reducing roll rate. Engine 1 thrust reverser will deploy and retract at a slower rate and some asymmetry can be anticipated during thrust reverser deployment."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-13-21","source":"tech1","category":"Hydraulics","question":"The hydraulic system quantity is displayed on the lower DU by digital indication from 0 to 100%.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-14-1","source":"tech1","category":"Landing Gear","question":"With RTO selected, the system will automatically apply maximum brake pressure when the thrust levers have been retarded to idle with speed at or above 90 kts.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-14-2","source":"tech1","category":"Landing Gear","question":"If both normal and alternative brake system pressure is lost it is still possible to use the brakes to bring the aircraft to a complete stop after landing?","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-14-3","source":"tech1","category":"Landing Gear","question":"Which hydraulic system operates the parking brake?","options":["Brake accumulator","Hydraulic system B","Hydraulic system A","All of the above."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-14-4","source":"tech1","category":"Landing Gear","question":"How far must you pull the emergency gear release handle before the related landing gear uplock is released?","options":["Approximately 16cm","Approximately 61cm","Released as soon as handle pulled.","Approximately 6cm."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-14-5","source":"tech1","category":"Landing Gear","question":"You select the AUTO BRAKE to RTO on the ground, and the AUTO BRAKE DISARM light illuminates for 2 seconds then extinguishes. What is the fault?","options":["The Auto Brake has failed the self test and should be re-cycled to off then back to RTO, if the light does not illuminate this time the system is serviceable.","You do not have the parking brake set.","Autobrake is unavailable.","The system has passed the self test and there is NO fault."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-14-6","source":"tech1","category":"Landing Gear","question":"Which of the following statements are false for Antiskid Protection.","options":["Antiskid protection is provided for both normal and alternate brake systems.","All of the above are false.","Each wheel is provided with individual Antiskid protection in normal and alternate braking","The Antiskid system provides skid, locked wheel, touchdown and hydroplane protection in both normal and alternate braking."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-14-7","source":"tech1","category":"Landing Gear","question":"The landing gear lights on the main centre panel all indicate green, but the lights on the aft overhead panel show the LEFT GEAR is not locked and down. You can ignore this situation as one green light, on either panel, for each landing gear, means the gear is down and locked.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-14-8","source":"tech1","category":"Landing Gear","question":"Other than moving the Autobrake selector to OFF, how else can Autobraking be cancelled?","options":["Applying manual brakes, Moving Speed Brake lever to DOWN detent or Advancing forward thrust levers immediately after touchdown.","Advancing forward thrust levers immediately after touchdown or Applying manual brakes","Applying manual brakes","Applying manual brakes or Moving Speed Brake lever to DOWN detent."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-14-9","source":"tech1","category":"Landing Gear","question":"Which of the following statements are true for the Nose Wheel Steering system","options":["Nose wheel steering is normally powered by hydraulic system A and as well as being in the down position, the nose landing gear must be compressed for nose wheel steering to be available.","Nose wheel steering is normally powered by hydraulic system A, If alternate nose wheel steering is activated then the standby hydraulic system operates the nose wheel steering and As well as being in the down position, the nose landing gear must be compressed for nose wheel steering to be available.","If alternate nose wheel steering is activated then the standby hydraulic system operates the nose wheel steering and as well as being in the down position, the nose landing gear must be compressed for nose wheel steering to be available.","If alternate nose wheel steering is activated then the standby hydraulic system operates the nose wheel steering."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-14-10","source":"tech1","category":"Landing Gear","question":"Which of the following statements is true, when the landing gear Manual Extension Access Door is open?","options":["Normal landing gear extension is possible if Hydraulic system A operational.","The landing gear cannot be retracted.","The landing gear can be manually lowered with the lnding gear lever in ANY position.","All of the above are true"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-1","source":"tech1","category":"Warning Systems","question":"Altitude alerting occurs when approaching or departing from the MCP selected altitude. When is the altitude alerting system inhibited?","options":["Landing gear is down and locked.","Glide slope is captured, or trailing edge flaps are extended to 25 or greater.","Leading edge flaps are extended to 25 or greater and the landing gear is extended.","Leading edge flaps are extended to 25 or greater"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-15-2","source":"tech1","category":"Warning Systems","question":"In Flight, the Intuvue radar will provide a windshear warning from 0.5nm to 3nm ahead of the aircraft.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-15-3","source":"tech1","category":"Warning Systems","question":"When carrying out the Stall Warning Test, which of the following statements is correct?","options":["The test cannot be completed until the AC Transfer Busses have been powered for up to 4 minutes.","The test can be completed on DC power","The test cannot be completed until the DC Busses have been powered for up to 4 minutes.","The test can be completed once AC power is available"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-15-4","source":"tech1","category":"Warning Systems","question":"How can the Fire Warning Bell be silenced on the flight deck?","options":["Fire bell can only be silenced by pressing either master fire warn light.","Push the Master Fire Warn lights, press the Horn Cutout of the APU Ground Control Panel.","Push the master fire warn lights, press the horn cutout of the APU ground control panel, push fire warning bell cutout switch.","Push the master fire warn lights, push fire warning bell cutout switch."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-5","source":"tech1","category":"Warning Systems","question":"The predictive windshear symbol radials, which extend from the predictive winsdshear symbol to help identify the location of a windshear event, are displayed in what colours?","options":["Red and Black banded.","Displayed amber when a predictive winshear caution is active, and displayed red when a predictive windshear warning is active.","Amber.","Red."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-15-6","source":"tech1","category":"Warning Systems","question":"The PSEU light will illuminate along with a Master Caution and an OVERHEAD annunciator light, under which of the following situations?","options":["Illuminates as soon as the ground/air system senses ground mode, if an emergency exit flight lock has failed locked or a fault is detected.","Illuminates whenever ground/air system senses air mode, and an emergency exit flight lock has failed locked.","Illuminates 30 seconds after the ground/air system senses air mode, if an emergency exit flight lock has failed locked or a fault is detected.","Illuminates 30 seconds after the ground/air system senses ground mode, if an emergency exit flight lock has failed locked or a fault is detected."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-7","source":"tech1","category":"Warning Systems","question":"As well as providing outputs for all stall warnings, the SMYD computers also provide outputs for GPWS Windshear Detection and Alert.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-15-8","source":"tech1","category":"Warning Systems","question":"When an Annunciator Panel is pressed, all lights on both panel initially illuminate.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-15-9","source":"tech1","category":"Warning Systems","question":"Which systems does the Proximity Switch Electronic Unit (PSEU) monitor","options":["Takeoff/Landing Configuration Warnings, Landing Gear and Anti-Skid","Air/Ground sensing, Landing Gear and Air/Ground sensing.","Air/Ground sensing, Landing Gear and Anti-Skid.","Takeoff/Landing Configuration Warnings, Landing Gear and Air/Ground sensing."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-10","source":"tech1","category":"Warning Systems","question":"What does the TCAS Symbol that is a solid amber circle indicate?","options":["Results in aural alert of \"TRAFFIC, TRAFFIC\" when within 6nm with 1200 feet or less of vertical seperation of other traffic.","Advises that the proximate traffic is descending at more than 500 fpm.","Advises of traffic with potential impact in 40 seconds.","Advises of traffic with potential impact on 25 seconds."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-15-11","source":"tech1","category":"Warning Systems","question":"The Stall Warning requirement is determined by what system component?","options":["The Captain's or F/O's Alpha Vane.","A single stall management configuration computer.","Two independent ADIRUs.","Two independent SMYD Computers."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-12","source":"tech1","category":"Warning Systems","question":"Which two displays cannot be selected and shown simultaneously on the Navigation DU?","options":["Terrain and TCAS.","Weather and Data.","Weather and Terrain.","TCAS and Airport."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-15-13","source":"tech1","category":"Warning Systems","question":"The stall warning test can only be carried out on the ground, the No1 and No2 systems must be carried out separately to ensure the clacker sounds when each system is tested.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-15-14","source":"tech1","category":"Warning Systems","question":"The GPWS will provide an aural alert of \"BANK ANGLE, BANK ANGLE\" under which of the following circumstances?","options":["Whenever trailing edge flaps are at 1 or greater and roll angle exceeds 35 degrees.","When roll angle exceeds the maximum of 45 degrees.","Whenever the bank angle exceeds the setting on the Bank Angle Selector.","When roll angle exceeding 35, 40 and 45 degrees."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-15","source":"tech1","category":"Warning Systems","question":"What is significant about the layout of the Annunciator Panel lights.","options":["The lights are arranged in order of priority to be dealt with in case of multiple system failures.","The lights on the Captain's side show the systems that the Captain is responsible for monitoring, and the lights of the F/Os side show the systems the F/O is responsible for monitoring.","The lights are arranged in no significant order.","The lights are arranged to reflect the position of the systems panels on the Overhead Panels."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-16","source":"tech1","category":"Warning Systems","question":"With both engines operating and one forward thrust lever set below approximately 20 degrees thrust lever angle, the landing gear warning horn can be silenced with the landing gear warning HORN CUTOUT switch:","options":["with flaps UP through 25 if below 800 feet RA and above 200 feet RA","with flaps UP through 10 if below 800 feet RA and above 200 feet RA","with flaps UP through 10 if below 800 feet RA and above 300 feet RA","it cannot be silenced if the thrust lever angle is less than 20 degrees."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-15-17","source":"tech1","category":"Warning Systems","question":"What is the first Radio Altitude Callout given during the approach?","options":["1000 feet - \"One Thousand\".","2450 feet - \"Twenty Five Hundred\".","50 feet - \"Fifty\".","2500 feet - \"Twenty Five Hundred\"."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-18","source":"tech1","category":"Warning Systems","question":"Altitude alerting, consisting of a tone and highlighted boxes, occurs at a set distance before reaching the selected attitude. How many feet before the selected altitude do the altitude alert highlighted boxes no longer show?","options":["3000 fpm with 3000 feet to go, 2000 fpm with 2000 feet to go, 1000 fpm with 1000 feet to go.","600 feet","300 feet","900 feet"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-15-19","source":"tech1","category":"Warning Systems","question":"Once an alert has occurred for deviating from the selected altitude, how is it cancelled?","options":["Press ALT INT to select next FMC target altitude.","Return to within 200 feet of selected altitude and press the HORN CUTOUT button on the Control Stand.","Return to within 200 feet of selected altitude.","return to within 300 feet of selected altitude or deviate by more than 900 feet from selected altitude, or select a new altitude."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-20","source":"tech1","category":"Warning Systems","question":"The EGPWS contains a terrain database, which it uses for look-ahead terrain alerting. Which of the following statements is correct for this terrain database?","options":["Man-made obstructions are not accounted for in all EGPWS terrain databases","All EGPWS terrain databases account for man-made obstructions over 100 feet high, in the more detailed areas of the database near major airports.","All EGPWS terrain databases account for man-made obstructions over 100 feet high, throughout the whole database area.","All man-made obstructions are accounted for in the detailed areas of the EGPWS terrain database in areas close to major airports."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-15-21","source":"tech1","category":"Warning Systems","question":"The predictive windshear aural alerts will be heard through flightdeck speakers and the headsets at a pre-set volume. They cannot be controlled or turned off by the crew.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-15-22","source":"tech1","category":"Warning Systems","question":"The PSEU light, located on the forward overhead panel, will illuminate on the ground if a fault is detected in the PSEU or if an overwing exit flight lock fails to disengage when commanded.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-15-23","source":"tech1","category":"Warning Systems","question":"When will the landing gear config warning horn give an intermittent warning sound?","options":["Flaps greater than 25, below 800 feet RA, regardless of forward thrust lever position.","Flaps up through 10, below 800 feet RA, either forward thrust lever at 20 degrees or less (or less than 34 degrees if only 1 engine running).","Never","Flaps 1 through 10, below 800 feet RA, either forward thrust lever at 20 degrees or less (or less than 34 degrees if only 1 engine running)."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-15-24","source":"tech1","category":"Warning Systems","question":"At what altitude (in feet) do the RA callouts begin?","options":["ONE THOUSAND.","FIFTEEN HUNDRED.","TWO THOUSAND","TWENTY FIVE HUNDRED."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-25","source":"tech1","category":"Warning Systems","question":"The EGPWS displays terrain within 2,500 feet of the aircraft barometric altitude on the Navigation display.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-15-26","source":"tech1","category":"Warning Systems","question":"How are crew alerted to a deviation from the selected altitude?","options":["A warning tone sounds once deviation is 300 feet from selected altitude, the current altitude box begins to flash.","A warning tone sounds once deviation is 300 feet from selected altitude, the current altitude box turns amber and begins to flash.","A warning tone sounds once deviation is 300 feet from selected altitude, the current altitude box turns red and begins to flash.","A warning tone sounds once deviation is 900 feet from selected altitude, the current altitude box turns red and begins to flash."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-15-27","source":"tech1","category":"Warning Systems","question":"The TCAS system generates a Traffic Advisory, whenever another aircraft is what distance from point of closest approach?","options":[">6 nm separation with >1200 feet vertical separation.","25 seconds.","40 seconds.","<6 nm separation with < 1200 feet vertical separation."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-15-28","source":"tech1","category":"Warning Systems","question":"At what altitude are the TCAS INCREASE DESCENT RAs inhibited?","options":["1,100 feet RA.","1500 feet AGL","1,100 feet AGL.","1500 feet RA."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-29","source":"tech1","category":"Warning Systems","question":"When configured for landing, the GPWS will NOT alert if attempting an off-airport landing.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-15-30","source":"tech1","category":"Warning Systems","question":"How far from projected impact will the \"TERRAIN, TERRAIN, PULL UP\" aural warning be given?","options":["Whenever descending below unsafe RA while too far from any airport in the terrain database.","1.2nm to 1.5nm or 20 to 30 seconds whichever limit occurs first.","1.2 nm to 1.5 nm","20 to 30 seconds."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-15-31","source":"tech1","category":"Warning Systems","question":"Crew are warned of exceeding the maximum allowed airspeed by which of the following?","options":["Aural Clacker, speedtape red and black band.","Aural Clacker, speedtape red and black band, stick shaker.","Aural Clacker, speedtape red and black band, speedtape amber band, stick shaker.","Aural Clacker."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-15-32","source":"tech1","category":"Warning Systems","question":"The Stall Warning System Stick Shaker can be tested by pressing the STALL WARNING TEST buttons on the AFT overhead panel. Pressing No1 switch will activate the Captain's Stick Shaker and the Captain's column will vibrate. Pressing N02 switch will activate the FO's Stick Shaker and the FO's column will vibrate.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-15-33","source":"tech1","category":"Warning Systems","question":"What is the direct result of low oil pressure in the No2 IDG?","options":["Power is lost on the First Officer's displays after a delay of 5 minutes.","The No2 Drive light illuminates amber.","Power automatically trips to the STANDBY system.","No immediate affect noticeable as the Bus Tie Brakers (BTB) automatically connect the No1 IDG to drive both AC Transfer Bus 1 and AC Transfer Bus 2."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-15-34","source":"tech1","category":"Warning Systems","question":"Which of the following statements is true for the CABIN ALTITUDE Warning?","options":["A steady warning horn sounds and the amber CABIN ALTITUDE lights illuminate when the cabin altitude exceeds 14000 feet.","An intermittent warning horn sounds and the amber CABIN ALTITUDE warning lights illuminate wh
