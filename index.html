toring","When the engines accelerates to a speed greater than 15% N2"],"answer":0,"explanation":"NOTE: During battery start the EEC is energised fully at 15% N2. During normal start the EEC is supplied with electrical power at GRD switch ON.","type":"mcq"},{"id":"sop5-4-5","source":"tech1","category":"Engines & APU","question":"What is the recommended value of engine RPM that the engine must accelerate to prior to moving the engine start lever to the IDLE position?","options":["25% N1 or maximum motoring speed","56% N2 or maximum motoring speed","25% N2 or maximum motoring speed","At the first indication of N1 rotation"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop5-4-6","source":"tech1","category":"Engines & APU","question":"In flight, a fault prevents the EEC from receiving flap or anti-ice signals. Below what altitude will the approach idle schedule begin?","options":["Below 2,500 feet RA.","Below 15,000 feet MSL","Approach idle must be selected by the crew in these circumstances.","Below 19,000 feet MSL"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop5-4-7","source":"tech1","category":"Engines & APU","question":"What condition would cause an automatic shutdown of the APU? (Select one or more)","options":["The APU has no automatic shutdown protection - shutting down the APU is always Flight Crew initiated. (NOPE!)","An APU high oil temperature condition occurs (correct)","The APU overspeeds (correct)","APU fuel control unit failure (correct)"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-4-8","source":"tech1","category":"Engines & APU","question":"Can an engine be started if the aircraft does not have AC power applied?","options":["No","Only if the APU is running","Yes, even if the battery switch is placed OFF","Yes, provided an air source is available for starting"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop5-4-9","source":"tech1","category":"Engines & APU","question":"Approach idle is selected in flight by the EECs under what normal conditions(s)?","options":["Flaps are in landing configuration, or engine anti-ice is ON for either engine.","Below 2,000 feet RA.","Below 19,000 feet MSL.","Landing gear extended."],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-5-1","source":"tech1","category":"Fire Protection","question":"The fire detectors located in the forward and aft cargo holds detect a fire by what means?","options":["Detecting either smoke or heat above a pre-set value.","Detecting heat above a pre-set value only.","Forward cargo compartment set to detect smoke only, due to hot air from cabin conditioning system being discharged into forward cargo hold, aft cargo compartment set to detect both smoke and heat.","Detecting smoke only"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop5-5-2","source":"tech1","category":"Fire Protection","question":"The engines each have an overheat light and an illuminated fire switch. The APU has an illuminated fire switch but no overheat light. The cargo compartments and the main wheel well have only fire warning light(s).","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-5-3","source":"tech1","category":"Fire Protection","question":"What do the 3 green illuminated lights at the bottom right of the diagram indicate?","options":["Fire extinguisher test continuity normal.","Fire extinguisher functional test completed satifactorily.","Fire warning system test 1 completed satisfactorily.","Fire Switch handles functional test satisfactory."],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-5-4","source":"tech1","category":"Fire Protection","question":"If after moving the FAULT/INOP - OVHT/FIRE TEST switch to the OVHT/FIRE TEST position, one engine fire switch fails to illuminate. How would you determine which detector loop had failed?","options":["Move to FAULT/INOP - OVHT/FIRE switch to the central TEST position, then test one loop at a time using the OVHT DET switch selected first to A and then B.","Carry out the test again with the switch selected to FAULT/INOP testing each loop individually with the OVHT DET switch at A then B.","This indication only occurs when BOTH loops have failed.","Carry out the test again one loop at a time using the OVHT DET switch selected to A and then B"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop5-6-1","source":"tech1","category":"Flight Controls","question":"What does the SPEED BRAKE DO NOT ARM light (located on the left forward panel) indicate when illuminated amber? (Select one or more)","options":["Indicates an abnormal condition or test input in the speed brake system. (Correct)","Indicates that the wheel speed has dropped below 60 kts on landing and the speedbrake lever has not been moved to the down position (Correct)","Illuminated whenever forward thrust levers are advanced beyond takeoff thrust whilst aircraft on the ground (Nope)","The speed brakes must not be extended as airspeed currently too high for safe operation. (Nope)"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-7-1","source":"tech1","category":"Flight Instruments","question":"What does the Magenta figure displayed above the Speed Tape signify? (Select one or more):","options":["Airspeed manually selected in the IAS/MACH window (correct)","FMC computed airspeed if the IAS/MACH window is blank (correct)","Current or next speed restriction in the FMC (nope)","Maximum airspeed for current flap settings (nope)"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-8-1","source":"tech1","category":"FMS & Navigation","question":"For the IntuVue Radar, Predictive Windshear mode is automatically turned on in which of the following specific aircraft conditions? (Select one or more - tick boxes to confuse you):","options":["In flight above 1200 feet RA, on ground with throttle levers at takeoff position setting","In flight below 1800 feet AGL, on ground with throttle levers set for takeoff.","In flight below 2300 feet AGL, on ground with throttle levers at takeoff position setting.","In flight below 1500 feet AGL, on ground with both engines running."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-8-2","source":"tech1","category":"FMS & Navigation","question":"Which of the numbered areas on the FMC shown below is the SCRATCHPAD?","options":["3","2","4","1"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-8-3","source":"tech1","category":"FMS & Navigation","question":"The image below shows the IRS panel located on the AFT overhead panel, for later aircraft YW130 through YW164. Other than OFF, what are the switch positions in the clockwise order?","options":["NAV, ALIGN, GLS","ALIGN, NAV, ATT.","NAV, ALIGN, ATT.","ATT, ALIGN, NAV."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-9-1","source":"tech1","category":"Fuel","question":"When will the fuel CONFIG alert extinguish?","options":["Centre fuel tank quantity less than 363 kgs.","Centre fuel tank quantity less than 91 kgs.","Total tank quantity less than 726 kgs.","Centre tank quantity less than 726 kgs."],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-9-2","source":"tech1","category":"Fuel","question":"Which statement is correct when the aircraft is in flight, with 2500 kgs of fuel in main tank No.1 and 3060 kgs of fuel in main tank No.2 ?","options":["This will cause an amber IMBAL indication below main tank No.1 accompanied by MASTER CAUTION lights and a System Annunciation Light for FUEL","The fuel quantity digits for main tank No.2 turn amber.","This will cause an amber IMBAL alert below main tank No.1. The fuel quantity digits for the tank also turn amber.","This will cause an amber LOW alert below main tank No.1 accompanied by MASTER CAUTION lights and a System Annunciation light for FUEL."],"answer":2,"explanation":"","type":"mcq"},{"id":"sop5-9-3","source":"tech1","category":"Fuel","question":"Which statement is correct when the CROSSFEED selector is positioned OPEN and the crossfeed valve is closed?","options":["Crossfeed VALVE OPEN light illuminated dim blue.","Crossfeed VALVE OPEN light extinguished.","Crossfeed VALVE OPEN light illuminated bright blue.","Crossfeed VALVE OPEN light illuminated amber."],"answer":2,"explanation":"","type":"mcq"},{"id":"sop5-9-4","source":"tech1","category":"Fuel","question":"When ALL of the AC fuel pumps are switched on and operating and there is fuel in each tank, which tank would fuel for the APU normally be supplied from?","options":["Main tank No.2","The Centre tank.","Main tank No.1","The right hand side of the fuel manifold."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-9-5","source":"tech1","category":"Fuel","question":"In-flight, if the two fuel pump LOW PRESSURE Lights for main tank No.1 illuminate. What happens to the No.1 engine?","options":["It receives fuel from main tank No.1 through a suction feed line that bypasses the pumps","It continues to operate due to the Cross Feed valve automatically opening.","It will shut down due to fuel starvation","It receives fuel from main tank No. 2 automatically."],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-9-6","source":"tech1","category":"Fuel","question":"When does the center tank fuel scavenge jet pump operate?","options":["Both Center Tank Fuel Pump Switches are turned OFF","When either engine is operating.","The center fuel tank is about 3/4 full and all AC fuel pump switches are selected to ON.","The No. 1 main fuel tank is about 1/2 full and the No. 1 tank FWD pump switch is selected to ON"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop5-10-1","source":"tech1","category":"Hydraulics","question":"What will cause the STBY RUDDER ON light to illuminate? Select one or more (to confuse you...):","options":["Standby rudder system is commanded on, to pressurise the standby rudder PCU, by selecting YAW DAMPER switch to OFF.","Standby rudder system is commanded on, either manually or automatically, to pressurise the standby rudder PCU.","Only illuminated when the standby rudder system has been automatically commanded on - not illuminated when standby rudder system has been manually commanded on by selecting the FLT CONTROL switch to STBY RUD.","Only illuminated when the standby rudder system has been manually commanded on by selecting a FLT CONTROL switch to STBY RUD - not illuminated when standby rudder system automatically commanded on."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-11-1","source":"tech1","category":"Landing Gear","question":"Other than moving the Autobrake selector to OFF, how else can Autobraking be cancelled? Select all that apply (Select one or more)","options":["Moving Speed Brake lever to DOWN detent (Correct)","Applying manual brakes (Correct)","Advancing forward thrust levers immediately after touchdown (Nope)","All of the above (Nope)"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-11-2","source":"tech1","category":"Landing Gear","question":"Which of the following statements are true for the Nose Wheel Steering system (Select one or more)","options":["Nose wheel steering is normally powered by hydraulic system A (Correct)","As well as being in the down position, the nose landing gear must be compressed for nose wheel steering to be available (Correct)","If alternate nose wheel steering is activated then the standby hydraulic system operates the nose wheel steering (Nope!)","All of the above are true (Nope!)"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-11-3","source":"tech1","category":"Landing Gear","question":"Which of the following statements are false for Antiskid Protection (Select one or more to confuse you):","options":["Each wheel is provided with individual Antiskid protection in normal and alternate braking","Antiskid protection is provided for both normal and alternate brake systems.","The Antiskid system provides skid, locked wheel, touchdown and hydroplane protection in both normal and alternate braking.","All of the above are false."],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-12-1","source":"tech1","category":"Warning Systems","question":"What does the TCAS symbol shown below indicate? (Yellow Circle)","options":["Advises of traffic with potential impact on 25 seconds.","Results in aural alert of \"TRAFFIC, TRAFFIC\" when within 6nm with 1200 feet or less of vertical seperation of other traffic.","Advises of traffic with potential impact in 40 seconds","Advises that the proximate traffic is decending at more than 500 fpm."],"answer":2,"explanation":"","type":"mcq"},{"id":"sop5-12-2","source":"tech1","category":"Warning Systems","question":"Which systems does the Proximity Switch Electronic Unit (PSEU) monitor (select one or more)","options":["Takeoff/Landing Configuration Warnings (correct)","Air/Ground sensing (correct)","Landing Gear (correct)","Anti-Skid (NOPE!)"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-1","source":"tech1","category":"Engines & APU","question":"The right WING-BODY OVERHEAD light is illuminated. Which of the following areas is affected?","options":["Left hand air conditioning bay","The keel beam","Right engine strut","APU bleed duct"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop5-13-2","source":"tech1","category":"Airplane General","question":"Above what windspeed should Entry or Cargo Doors not be opened?","options":["20 knots steady, gusting to 30 knots","40 knots","60 knots",""],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-13-3","source":"tech1","category":"Engines & APU","question":"What is the purpose of the isolation valve?","options":["To isolate the engine bleed air from the other bleed air sources","To isolate the left and the right sides of the bleed air duct","To isolate all four bleed air sources","To isolate the APU"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-13-4","source":"tech1","category":"Airplane General","question":"What is the range of the individual temperature selectors?","options":["Approximately 18°C to 30°C","Approximately 24°C to 30°C","Approximately 18°C to 24°C",""],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-5","source":"tech1","category":"Hydraulics","question":"How much is the output pressure of the engine pump compared to the electric pump on hydraulic system A?","options":["Approximately the same","Less","A great amount larger",""],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-6","source":"tech1","category":"Airplane General","question":"How many fans are there in the equipment cooling system?","options":["4 fans - 2 in the supply duct and 2 in the exhaust duct","1 fan in the exhaust duct only","2 fans - 1 in the supply duct and 1 in the exhaust duct","2 fans in the supply duct only"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-7","source":"tech1","category":"Communications","question":"What is indicated by the Radio Tuning Panel (RTP) Offside Tuning Light illuminating white?","options":["The RTP is being used to tune a radio not normally associated with that RTP","The RTP is being used to tune an HF radio","The light has been pushed for 2 seconds, and the RTP is switched off","No standby frequency has been set"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-8","source":"tech1","category":"Electrical","question":"Under what conditions can the APU generator supply both transfer busses?","options":["On the ground only","It cannot supply both transfer busses simultaneously","Both on the ground or in flight","In flight only"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop5-13-9","source":"tech1","category":"Electrical","question":"Illumination of the amber generator DRIVE light indicates low oil pressure caused by which of the following?","options":["IDG automatic disconnect due to high oil pressure","Failure of the associated AC transfer bus","IDG failure","Loss of the associated engine-driver hydraulic pump"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop5-13-10","source":"tech1","category":"Electrical","question":"During a battery start, when does the EEC become energised?","options":["At 15% N2","When the ENGINE START Switch is positioned to GRD","At 15% N1","When the Engine Start Lever is positioned to IDLE"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-11","source":"tech1","category":"Engines & APU","question":"Which of the following actions would cause a displayed ENG FAIL Alert to extinguish","options":["EEC set to ALTERNATE","Engine fire bottle discharged","Engine fire warning switch pulled","Start lever moved to IDLE"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-13-12","source":"tech1","category":"Engines & APU","question":"During a normal engine start, which of the following statements is true?","options":["Only N1, N2, oil quantity and engine vibration are available prior to placing the engine start switch to GRD","Only round dials are visible for engine indications prior to placing the engine start switch to GRD","Only N1, N2, oil quantity indications are available until the engine accelerates to a speed greater than 15% N2","Only oil pressure and engine vibration are available prior to placing the engine start switch to GRD"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-13","source":"tech1","category":"Engines & APU","question":"Is automatic shutdown protection provided for the APU in the event of an APU failure of the APU fire detection system is inoperative?","options":["No","Yes, on the ground only","Yes, in flight only","Yes"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-14","source":"tech1","category":"Engines & APU","question":"What additional engine fire indication is shown or heard on the flight deck of later aircraft (YF685 through YF695, YW001 through YW164) in the event of engine fire or during an engine fire test?","options":["The associated engine start lever will illuminate red","The engine fire is displayed as a temperature exceedance on the lower DU","The fire warning is a siren and not a bell","The engine fire is displayed as a temperature exceedance on the upper DU"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-15","source":"tech1","category":"Fire Protection","question":"To silence the fire bell you can press either of the two Master Fire Warning (FIRE WARN) lights on the glareshield. There is another switch which will also silence the fire bell. Where is it located?","options":["On the Cargo Fire Panel","On the aft overhead panel","On the Overheat/Fire Protection Panel",""],"answer":2,"explanation":"","type":"mcq"},{"id":"sop5-13-16","source":"tech1","category":"Fire Protection","question":"Which statement is correct when both loops in the cargo compartment fire detection system are operating normally?","options":["One loop must detect the presence of heat to cause an alert","Both loops must detect the presence of smoke to cause an altert","One loop must detect the presence of smoke to cause an alert","Both loops must detect the presence of heat or smoke to cause an alert"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-13-17","source":"tech1","category":"Engines & APU","question":"What is the result of operating the EXT TEST switch?","options":["Selecting position 1 tests engine No 1 fire bottle discharge circuitry, selecting position 2 tests engine No 2 fire bottle discharge circuitry","Selecting position 1 tests engine fire bottle discharge circuitry, selecting position 2 tests APU fire bottle discharge circuitry","Selecting position 1 or 2 tests fire bottle discharge circuitry for all three extinguisher bottles","Selecting position 1 tests APU fire bottle discharge circuitry, selecting position 2 tests the engine fire bottles discharge circuitry"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop5-13-18","source":"tech1","category":"Hydraulics","question":"What will cause the FEEL DIFF PRESS light to illuminate?","options":["Flaps are not up and an excessive hydraulic pressure imbalance between hydraulic systems B and the Standby hydraulic system is sensed","Captain's pitot system fails","Flaps are either up or down and either hydraulic system fails, or either elevator pitot system fails, and an excessive hydraulic pressure imbalance is sensed","Flaps are up and an excessive hydraulic pressure imbalance between hydraulic System A and the Standby hydraulic system is sensed"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop5-13-19","source":"tech1","category":"Hydraulics","question":"Which statement is correct for a loss of hydraulic system B (system A operating normally) and no switches have been repositioned yet?","options":["Main and Standby Yaw Dampers are not available","Standby Yaw Damper functions with \"A\" FLT CONTROL switch in STBY RUD and Yaw Damper switch ON","Standby Yaw Damper is available","Main Yaw Damper function is available"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-20","source":"tech1","category":"Landing Gear","question":"With the speed brake lever at ARMED, if a wheel spin-up signal is not detected on landing ,will the flight spoilers deploy automatically?","options":["The will deploy when the Air/Ground system senses ground mode (any gear strut compresses)","They will deploy when the right main landing gear strut is compressed","The flight spoilers will not deploy unless wheel spin up of 60kts or greater is detected","They will deploy only after the Ground Spoilers have been deployed"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-21","source":"tech1","category":"Airplane General","question":"On a non-short field performance aircraft (YF501 - YW097), with the TE flaps set to position 15, what is the correct indication that should be seen on the Aft Overhead panel for the leading edge devices?","options":["All LE devices FULL EXT lights illuminated green","All LE devices EXT (intermediate) lights illuminated green","All LE devices TRANSIT lights illuminated amber","LE slats EXT (intermediate) lights and LE flaps FULL EXT lights illuminated green"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-22","source":"tech1","category":"Hydraulics","question":"In addition to the Hydraulic System A and B, how else can the rudder be powered?","options":["Standby hydraulic system through the Main Rudder PCU","Standby hydraulic system through the Standby Rudder PCU","System B Standby Rudder PCU","System A Standby Rudder PCU"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-13-23","source":"tech1","category":"Airplane General","question":"The vertical speed in white shown at the bottom (when descending) of the vertical speed indication will show when the vertical speed exceeds what figure?","options":["250 feet per minute","1000 feet per minute","500 feet per minute","400 feet per minute"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop5-13-24","source":"tech1","category":"Flight Instruments","question":"Which statement is correct when the airplane has descended below the radio altitude minimums?","options":["On the Rad Alt display on the PFD, the dial display and pointer turn amber and flash for 3 seconds","The Rad Alt dial perimeter, numeric readout and pointer turn green and flash for 3 seconds","The Rad Alt display dial perimeter, numeric readout and pointer flash for 5 seconds","The Rad Alt numeric readout and pointer turn amber and flash for 5 seconds"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-25","source":"tech1","category":"Engines & APU","question":"Under what circumstances will the V Speeds be removed from the FMC, the No V Speeds Flag reappear on the PDF, and the scratchpad message TAKEOFF SPEEDS DELETED appear?","options":["If the FMC generated QRH V Speeds differ by more than 1kt from the entered OPT calculated V Speeds","After first engine start, if the senses OAT differs by more than 6 degrees C from the OAT entered on the TAKEOFF REF page","OAT has been changed on the TAKEOFF RED page after the V Speed have been entered","If the MFRA is adjusted before TO/GO is pressed"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-13-26","source":"tech1","category":"Communications","question":"The HF Sensitivity Control is used for which purpose?","options":["To set HF sensitivity on the on-side receiver","To remove interference from the VHF signal to make reception clearer","To set HF sensitivity on the offside HF receiver","To tune the Data signal when using VHF3 for Data transmissions"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-27","source":"tech1","category":"FMS & Navigation","question":"What information is available with the IRS mode selector in ATT?","options":["Heading information only","Attitude information only","Attitude, heading and position","Attitude and heading information"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop5-13-28","source":"tech1","category":"FMS & Navigation","question":"When will you see the FMC Alerting Message VERIFY POSITION?","options":["If longitude information only is sensed as incorrect by the IRS","On the ground only","The aircraft is excessively off the flight planned course",""],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-13-29","source":"tech1","category":"FMS & Navigation","question":"On the FMC FIX INFO page what does the RAD/DIS FR indicate?","options":["The radial and distance of your next abeam point","The radial and distance of the destination field","The radial and distance from the airplane to the fix, this is not updated as the airplane changes position","The radial and distance from the fix to the airplane, this information will update as the aircraft changes position"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop5-13-30","source":"tech1","category":"Automatic Flight","question":"Which statement is correct when an active navigation database expires in flight?","options":["Both LNAV and VNAV will disengage","The expired database continues to be used until the active date is changed after landing","All LNAV information is lost and waypoints have to be created manually in the temporary navigation database","The alerting message UNABLE REQD NAV PERF - RNP will appear in the CDU scratchpad"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-13-31","source":"tech1","category":"FMS & Navigation","question":"Which statement is correct when selecting an arrival for either the origin or destination airport on the FMC DEP/ARR page?","options":["Only the origin airport is available until passing 60NM from the origin airport","Only the origin airport is available until passing 120NM from origin airport","Only the destination airport is available","Both the origin and destination airport are available"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop5-13-32","source":"tech1","category":"Hydraulics","question":"What is the result of a fluid leak in the System A electric motor-driven pump?","options":["System A reservoir fluid decreases to zero and all System A pressure is lost","System A reservoir fluid quantity decreases to approximately 20% full and System A pressure is maintained","System A reservoir fluid quantity decreases to approximately 20% full and alternate brakes nd steering must be used","System A reservoir fluid quantity decreases to zero but system pressure is maintained by the Landing Gear Transfer Unit"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-13-33","source":"tech1","category":"Hydraulics","question":"When is the standby hydraulic system automatically activated?","options":["System B failed and wheel speed > 50 kts","System B fails and flaps are up","The main rudder PCU Force Flight Monitor (FFM) trips","Positioning either FLT CONTROL switch to STBY RUD"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop5-13-34","source":"tech1","category":"Landing Gear","question":"When disarming the Autobrake System, which of the following does NOT cause the AUTO BRAKE DISARM light to illuminate?","options":["Applying manual brakes","Moving the SPEED BRAKE lever to the DOWN detent","Positioning the AUTO BRAKE  located behind the FO, and 1 Water Glycol extinguisher located under the second observer's jump seat.","2 Halon fire extinguishers, 1 located behind the Captain's seat and 1 located behind the FO's seat.","1 Halon extinguisher located behind the FO, and 1 CO2 extinguisher located under the second observer's jump seat."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-2-1","source":"tech1","category":"Air Systems","question":"When operating on the Standby Pack Controls, what temperatures will the packs be producing?","options":["The trim air modulating valves close so no pack air is provided to the two cabin zones, only re-circulated air is provided.","The flight deck required temperature will also be provided to the passenger cabin.","An average temperature for the two cabin zones.","Left pack produces 18 degrees C, right pack produces 22 degrees C."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-2-2","source":"tech1","category":"Air Systems","question":"Which systems use engine bleed air during operation?","options":["Engine starting, air conditioning, cabin pressurisation, engine and wing anti-icing, hydraulic, water.","Engine and wing anti-icing, air conditioning, cabin pressurisation, hydraulic reservoir pressurisation.","Engine and wing anti-icing, engine starting, air conditioning, cabin pressurisation, hydraulic reservoir pressurisation.","Engine and wing anti-icing, engine starting, cabin pressurisation, hydraulic reservoir pressurisation."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-2-3","source":"tech1","category":"Air Systems","question":"The TRIP RESET switch is pushed to reset a PACK, WING-BODY OVERHEAT and BLEED TRIP OFF, it isolates the associated valve and extinguishes the alert.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-2-4","source":"tech1","category":"Air Systems","question":"If all zone and primary pack controls fail, how is cabin temperatures controlled?","options":["The cabin temperatures cannot be controlled in this situation.","The standby pack controls command the packs to produce the average temperature demand of the 2 passenger cabin zones.","A fixed cabin temperature will be produced in this situation - 24 degrees C from the left pack, and 18 degrees C from the right pack.","The last settings before the failure will be maintained until the packs are selected OFF."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-2-5","source":"tech1","category":"Air Systems","question":"The APU is capable of supplying bleed air for two packs on the ground, or one pack in flight.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-2-6","source":"tech1","category":"Air Systems","question":"If all Temperature Selectors are positioned OFF, the pack controls will cause the packs to produce which fixed temperatures?","options":["Left Pack, 22 degrees Centigrade. Right Pack, 20 degrees Centigrade.","Left Pack, 18 degrees Centigrade. Right Pack, 24 degrees Centigrade.","Left Pack, 24 degrees Centigrade. Right Pack, 18 degrees Centigrade.","Left Pack, 20 degrees Centigrade. Right Pack, 22 degrees Centigrade."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-2-7","source":"tech1","category":"Air Systems","question":"Engine bleed air pressure is controlled by means of the bleed air valve which acts as both a shutoff and pressure regulating valve.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-2-8","source":"tech1","category":"Air Systems","question":"What is the primary function of the recirculation fans?","options":["Recirculate cabin air to allow it to be filtered to remove contaminants as it passes through the recirculation fan HEPA filters.","Recirculate the air from the passenger cabin the provide heating for the forward cargo compartment","To provide standby air conditioning if the packs fail.","Reduce engine bleed air demand and load on the packs."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-2-9","source":"tech1","category":"Air Systems","question":"Conditioned air from the left hand pack flows directly to the Flight Deck from the Mix Manifold.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-2-10","source":"tech1","category":"Air Systems","question":"The packs produce the coolest temperature selected in any of the zones, with the other zones temperature controlled by adding hot trim air to produce the required temperature.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-2-11","source":"tech1","category":"Air Systems","question":"How many Trim Air Pressure Regulators are there in the Air Conditioning system?","options":["3","There are no Trim Air Pressure Regulators, only Trim Air Modulating valves.","2","1"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-2-12","source":"tech1","category":"Air Systems","question":"The differential pressure of the cabin is limited by a pressure relief system - which of the following statements is correct?","options":["There is an outflow valve which opens when cabin pressure reaches 9.1 psi above ambient.","There is a negative pressure relief valve, which limits the cabin pressure to 9.1 psi above ambient.","There are two pressure relief valves which limit differential pressure to 9.1 psi.","There are two negative pressure relief valves, which limit the cabin pressure to 9.1 psi above ambient."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-2-13","source":"tech1","category":"Air Systems","question":"What is the result if all temperature zone selectors are positioned to OFF?","options":["The right pack will produce a fixed temperature of 75 degrees Fahrenheit, and the left pack will produce a fixed temperature of 65 degrees Fahrenheit.","The packs will attempt to maintain an average temperature across all zones.","Left pack will produce 24 degrees centigrade and right pack will produce 18 degrees centigrade.",""],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-2-14","source":"tech1","category":"Air Systems","question":"Where are the wing-body overheat sensors located?","options":["Engine cowling lips, wing leading edge slats, air conditioning bays, APU compartment, keel beam.","Engine struts, wing leading edge slats, air conditioning bays, APU duct, keel beam.","Engine struts, wing inboard leading edges, air conditioning bays, APU bleed duct, keel beam.","Engine cowl lips, wing leading edge slats, air conditioning bays, electronic equipment bay, APU bleed duct."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-2-15","source":"tech1","category":"Air Systems","question":"Bleed air is taken from stage 4 and stage 10 of the high pressure compressor.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-2-16","source":"tech1","category":"Air Systems","question":"What is the result if one pack fails in-flight?","options":["The remaining pack when selected to AUTO will be capable of maintaining pressurisation up to aircraft ceiling, only if all Zone Temperature Controllers are selected to OFF.","The remaining pack is capable of maintaining pressurisation and acceptable cabin temperatures up to 41,000 feet.","The remaining pack will be capable of maintaining pressurisation up to the aircraft maximum certified ceiling, and will attempt to produce an average temperature across all cabin zones.","The remaining pack will not operate in HIGH flow."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-2-17","source":"tech1","category":"Air Systems","question":"What is the function of the duel Bleed Light?","options":["Illuminates whenever pressure in APU rises above a pre-set value.","Illuminates whenever both APU and engines is running to warn of risk of backpressure to APU.","Illuminates to warn of possible backpressure whenever both engines are providing bleed air, and engines are at different thrust settings.","Illuminates when engine running and APU bleed air valve, engine bleed air valve, and isolation valve are in a position to permit possible backpressure of the APU."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-2-18","source":"tech1","category":"Air Systems","question":"Which statement is correct:","options":["Bleed air is only supplied from the 5th stage when the valve modulates open if bleed air requirement is greater than the 9th stage alone can supply.","Bleed air is only supplied from the 9th stage when the valve modulates open if bleed air requirement is greater than the 5th stage alone can supply.","Bleed air is constantly provided from stage 5 and stage 9 of the compressor.",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-2-19","source":"tech1","category":"Air Systems","question":"Cabin pressurisation is controlled by the position of the Outflow Valve, but some air is also exhausted through the toilet and galley vents.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-3-1","source":"tech1","category":"Anti-Ice & Rain","question":"The engine Cowl Anti-Ice valve is located UPSTREAM of the Engine Bleed Air Valve.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-3-2","source":"tech1","category":"Anti-Ice & Rain","question":"If the cowl anti-ice valve fails to move to the position indicated by the ENG ANTI-ICE switch, the COWL VALVE OPEN light remains illuminated bright blue and an amber TAI indication immediately illuminates on the CDS.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-3-3","source":"tech1","category":"Anti-Ice & Rain","question":"Positioning ENG ANTI-ICE switch to on has what effect?","options":["Adjusted stall warning logic for stick shaker, minimum maneuver speed bars on airspeed indicator, and automatically adjusted FMC displayed VREF; return to normal when engine anti-ice is positioned to OFF.","Stall warning logic adjusts stick shaker and minimum maneuver speed bars on airspeed indicator.","FMC displayed VREF is adjusted automatically.","Adjusted stall warning logic for stick shaker, minimum maneuver speed bars on airspeed indicator, and automatically adjusted FMC displayed VREF; remain for rest of flight."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-3-4","source":"tech1","category":"Anti-Ice & Rain","question":"When operating on standby power only the Captain's pitot probe is still heated - if the Captain's pitot probe heating fails in this condition, there is no CAPT PITOT alert given.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-3-5","source":"tech1","category":"Anti-Ice & Rain","question":"On the ground and in flight, the wing anti-ice valves close if the forward thrust levers are advanced above the takeoff warning setting.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-3-6","source":"tech1","category":"Anti-Ice & Rain","question":"The rain removal system for the forward windows comprises of the following:","options":["Heated windows, Windshield wipers,","Windshield wipers, heated windows, hydroscopic rain repellent coating.","Windshield wipers, hydroscopic rain repellent coating.","Windshield wipers."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-3-7","source":"tech1","category":"Anti-Ice & Rain","question":"What do the green ON lights indicate above the Window heat switches?","options":["Illuminated means window heat needs to be switched on for that window, extinguished means heat now being applied to that window.","Illuminated means heat being applied to windows, extinguished means windows at correct temperature","Illuminated means the window Overheat system has activated.","Extinguished means heat still being applied to window but not yet at correct operating temperature, illuminated means window at correct temperature."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-4-1","source":"tech1","category":"Automatic Flight","question":"In flight below 2000 feet RA, on an ILS Autopilot approach with flare armed, what happens if you push a TO/GA switch once?","options":["Autothrottle advances thrust levers to reduced Go-Around N1.","Autothrottle advances thrust levers to full Go-Around N1.","Autothrottle will disengage, and ARM is dispalyed in FMA.","Autopilot will disengage, and CWS P will annunciate."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-4-2","source":"tech1","category":"Automatic Flight","question":"After takeoff the autothrottle will remain in Throttle Hold (THR HLD) until 800 feet RA.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-4-3","source":"tech1","category":"Automatic Flight","question":"The autopilot disengages automatically 2 seconds after touchdown.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-4-4","source":"tech1","category":"Automatic Flight","question":"What components make up the Automatic Flight System (AFS)?","options":["Autothrottles and autopilot flight director system.","Flight directors, MCP mode selector system, autothrottles.","Autopilot, MCP mode selector system, autothrottles.","AFDS, MCP mode selector system, autothrottles."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-4-5","source":"tech1","category":"Automatic Flight","question":"What normally provides the N1 limits and target N1 values to the Autothrottle?","options":["The Flight Control Computers.","The Flight Management Computer.","The Autothrottle Computer.","The Electronic Engine Controls (EECs)."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-4-6","source":"tech1","category":"Automatic Flight","question":"What does an illuminated green light mean in the MCP buttons?","options":["That switch can be de-selected.","That mode is currently engaged and active.","The switch is available to be selected.","That mode is currently de-selected and inactive."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-4-7","source":"tech1","category":"Automatic Flight","question":"If you engage Level Change by pressing the LVL CHG switch on the MCP and the green light illuminates, what other indications will occur as this mode engages?","options":["Speed window opens to show target speed, MCP SPD annunciated for thrust mode, N1 annunciated for pitch mode.","Speed window opens to show target speed, MCP SPD annunciated for pitch mode, N1 or RETARD/ARM annunciated for thrust mode.","Speed window blanks, MCP SPD annunciated for pitch mode, N1 annunciated for thrust mode.","Speed window blanks, MCP SPD annunciated for pitch mode, N1 or RETARD/ARM annunciated for thrust mode."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-4-8","source":"tech1","category":"Automatic Flight","question":"In flight, with Autopilot engaged in CMD B, which FCC controls the logic for the flight directors on the Captain's PFD.","options":["FMS A","FCC B","FCC A","FMS B"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-4-9","source":"tech1","category":"Automatic Flight","question":"The VOR/LOC mode must be armed before the second Autopilot can be selected during a duel channel autopilot approach.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-4-10","source":"tech1","category":"Automatic Flight","question":"What does a flashing \"A\" displayed to the left of the selected MCP speed indicate?","options":["Overspeeed limiting at Mmo limit","Underspeed limiting, FMC speed or MCP selected speed cannot be reached.","Overspeed limititing at Vmo Limit","limiting for maximum speed for current flap setting."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-4-11","source":"tech1","category":"Automatic Flight","question":"An altitude restriction is entered at the top of descent, the aircraft will not now follow the Idle Descent path but will descend to meet the altitude restriction. After achieving the altitude restriction which of the indicated flight paths will the aircraft follow for the rest of the decent?","options":["Descends to achieve restriction then maintains level flight until intercepts the original idle descent path. (A)","Descends to achieve restriction then descends at 1000 fpm until intercepting original idle descent path. (B)","Descends to achieve restriction, then continues steady descent to End of Descent. (C)","None of the options"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-4-12","source":"tech1","category":"Automatic Flight","question":"In the IAS/MACH Display, to the left of the displayed figure, what does a flashing \"A\" indicate?","options":["Overspeed limiting, Minimum speed for current flap setting cannot be achieved.","Overspeed limiting, current speed selection greater than current flap setting limit.","Underspeed limiting, FMC or selected speed can not be reached.","Underspeed limiting, Vmo or Mmo limit."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-4-13","source":"tech1","category":"Automatic Flight","question":"For approach, what altitude must the second Autopilot be selected for duel Autopilot operation?","options":["1500 feet RA","350 feet RA","500 feet RA","800 feet RA"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-4-14","source":"tech1","category":"Automatic Flight","question":"The autopilot automatically disengages 2 seconds after touchdown.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-4-15","source":"tech1","category":"Automatic Flight","question":"Below which RA should FLARE mode be armed during AUTOLAND?","options":["1500 RA","50 feet RA.","350 feet AGL.","350 feet RA."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-4-16","source":"tech1","category":"Automatic Flight","question":"If an altitude restriction is entered before TOD, the aircraft will commence the descent early to follow a new idle descent path to achieve the descent restriction. If ALT INTV is then selected after the descent restriction, which of the paths will the aircraft follow?","options":["Path C. Descends to achieve restriction, then continues steady descent to End of Descent.","Path A. Descends to achieve restriction then maintains level flight until intercepts the original idle descent path.","Path B. Descends to achieve restriction then descends at 1000 fpm until intercepting original idle descent path.","Path D. Descends to achieve restriction, then continues on that new idle descent path until new commands are entered."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-4-17","source":"tech1","category":"Automatic Flight","question":"With VNAV engaged, pushing the SPD INTV switch has what effect?","options":["Current or next speed restriction deleted from FMC, IAS/MACH window opens up showing previous FMC target speed, and IAS/MACH selector can be used to set new desired speed.","IAS/MACH window blanks and next FMC speed restriction becomes active, magenta target speed displayed above speed tape on PFD.","IAS/MACH window opens up showing current FMC target speed, and IAS/MACH selector can be used to set new desired speed.","No effect, VNAV remains enagaged with the FMC controlling target speed."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-4-18","source":"tech1","category":"Automatic Flight","question":"The N1 limits and target N1 values are normally provided to the Autothrottle from where?","options":["Flight Management Computer.","Electronic Engine Control Computers.","Autothrottle Computer.","Flight Control Computers."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-4-19","source":"tech1","category":"Automatic Flight","question":"At what altitude will the FLARE manoeuvre start during AUTOLAND?","options":["350 feet RA.","50 feet AGL.","500 feet AGL.","50 RA."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-4-20","source":"tech1","category":"Automatic Flight","question":"Why do we check that FLARE mode is armed at 500 feet RA?","options":["To allow the second A/P to be engaged at this point.","To be aware that A/P will disengage at 350 feet RA if not armed.","To allow APP mode to be selected at this point if FLARE not armed.","To allow start of the flare manoeuvre at 350 feet RA."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-4-21","source":"tech1","category":"Automatic Flight","question":"Other than by selecting N1 mode by pressing the N1 switch on the MCP, when else will N1 mode automatically engage.","options":["LVL CHG and VNAV engaged within first 2.5 minutes after takeoff.","Never, N1 mode is only ever manually selected and engaged.","LVL CHG engaged in climb more than 2.5 minutes after takeoff.","VNAV engaged in climb and LVL CHG engaged in climb more than 2.5 minutes after takeoff."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-4-22","source":"tech1","category":"Automatic Flight","question":"What happens when TO/GA is pressed once on an ILS Autopilot approach with FLARE armed?","options":["Autopilot disengages and the Flight Directors re-cycle to give a FD Go-Around.","Autothrottle advanced the thrust levers to full Go-Around thrust.","The autothrottle disengages and THR HLD annunciates in the FMA.","Autothrottle advanced the thrust levers to reduced Go-Around N1."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-4-23","source":"tech1","category":"Automatic Flight","question":"After takeoff, the Autothrottle remains in Throttle Hold (THR HLD) until 800 feet RA.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-4-24","source":"tech1","category":"Automatic Flight","question":"The VOR/LOC mode must be armed before the second Autopilot can be selected during a duel channel Autopilot approach.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-4-25","source":"tech1","category":"Automatic Flight","question":"What are the components of the Automatic Flight System (AFS)?","options":["Autopilot, Autothrottle, and MCP Mode Selection System.","Autopilot Flight Director System and Autothrottle.","Flight Directors, Autothrottle, and MCP Mode Selection System","Autopilot Flight Director System, Autothrottle and MCP Mode Selector System."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-4-26","source":"tech1","category":"Automatic Flight","question":"What will cause the A/T to disengage?","options":["Move A/T ARM switch to OFF, Push Either A/T Disengage switch and An A/T system fault is detected","Push Either A/T Disengage switch and An A/T system fault is detected","Immediately the left main landing gear is compressed, Push Either A/T Disengage switch and Move A/T ARM switch to OFF.","Push Either A/T Disengage switch and Move A/T ARM switch to OFF"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-4-27","source":"tech1","category":"Automatic Flight","question":"What are the indications for A/T disconnected.","options":["Tone sounds and A/T P/RST disengage light flashes","Tone sounds and A/T P/RST disengage light illuminates steady","A/T P/RST disengage light flashes.","A/T P/RST disenage light illuminates steady."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-4-28","source":"tech1","category":"Automatic Flight","question":"The A/T is controlled by FCC A only.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-4-29","source":"tech1","category":"Automatic Flight","question":"During THR HLD (Throttle Hold), if you manually move the throttle levers, the A/T will try to return them to their original position.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-4-30","source":"tech1","category":"Automatic Flight","question":"The Autothrottle (A/T) system, provides automatic thrust control from the start of takeoff, through all stages of flight to up to and including landing.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-4-31","source":"tech1","category":"Automatic Flight","question":"With A/T engaged, what condition could cause the throttles to be separated (not aligned).","options":["One EEC in ON, one EEC in ALTN.","One engine A/T suffering a system fault.","Both EECs in ALTN.","Throttle stagger cannot occur with A/T engaged as both throttle servo motors work identically to position the throttles symetrically."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-5-1","source":"tech1","category":"Communications","question":"What microphone options are available to the flight crew?","options":["Headset boom microphone and hand microphone.","Hand microphone, headset boom microphone, oxygen mask microphone, overhead speaker microphone.","Headset boom microphone, oxygen mask microphone, ceiling speakers microphone.","Hand microphone, headset boom microphone, oxygen mask microphone."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-5-2","source":"tech1","category":"Communications","question":"When the ALT-NORM switch on the Audio Control Panel (ACP) is selected to ALT, what is the result?","options":["ACP operates in a degraded mode, VHF-1 for Captain, HF-1 for Observer and VHF-2 for First Officer.","ACP operates in a degraded mode, VHF-1 for Captain and Observer, VHF-2 for First Officer.","All communications are routed through the ACP on the AFT Overhead Panel.","ACP operates in a degraded mode, VHF-2 for Captain, HF-2 for Observer, and VHF-1 for First Officer."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-5-3","source":"tech1","category":"Communications","question":"Selecting the Cockpit Voice Recorder to ON has what effect?","options":["Powers the cockpit voice recorder until first engine is started, then trips to AUTO.","Powers the cockpit voice recorder until the switch is moved to OFF","Powers the cockpit voice recorder until 5 after the last engine shutdown.","Powers the cockpit voice recorder after the first engine is started until 5 minutes after last engine shutdown."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-5-4","source":"tech1","category":"Communications","question":"VHF antennae located on the upper fuselage are susceptible to multipath interference from other air traffic, antennae located on the lower fuselage are not as susceptible to this interference.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-5-5","source":"tech1","category":"Communications","question":"Communication between the flight deck and flight attendants is still possible with the SERVICE INTERPHONE switch selected OFF.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-5-6","source":"tech1","category":"Communications","question":"What is the effect of pushing the Pilot Call switch?","options":["Single-tone chime in flight deck.","Two-tone chime in passenger cabin, with both pink master call lights illuminated.","Single-tone chime in passenger cabin with both pink call lights illuminated.","Two-tone chime in flight deck."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-5-7","source":"tech1","category":"Communications","question":"The volume of received communications can be controlled by rotating the selected RECEIVER SWITCHES on the Radio Tuning Panel.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-5-8","source":"tech1","category":"Communications","question":"The Flight Interphone and Service Interphone are on separate networks.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-5-9","source":"tech1","category":"Communications","question":"What are the 3 positions For the Audio Control Panel Filter switch?","options":["R, G, B, Radio, Ground, Both.","Pushed to select filtering ON, Pushed again for filtering OFF, rotated to increase or decrease amount of filtering.","V, B, R, Voice, Both, Range.","V, B, R, Voice, Both, Radio."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-6-1","source":"tech1","category":"Electrical","question":"Which of the following is NOT powered by the standby Power system?","options":["Battery Bus.","AC Standby Bus","Transformer Rectifier 1.","Static Inverter"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-6-2","source":"tech1","category":"Electrical","question":"What is the normal source of power for the Battery Bus?","options":["The battery","the switched hot battery bus","The hot battery bus","TR3"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-3","source":"tech1","category":"Electrical","question":"The DC standby Bus is powered from the batteries through the static Inverter. Select one:","options":["False","True","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-6-4","source":"tech1","category":"Electrical","question":"What is the voltage of the DC Busses under normal circumstances?","options":["28v","24v","22-30v","115v"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-6-5","source":"tech1","category":"Electrical","question":"If all AC generated power fails, how long can the batteries (if fully charged) supply standby power?","options":["Up to 30 minutes.","A minimum of 30 minutes.","Up to 60 minutes.","A minimum of 60 minutes."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-6","source":"tech1","category":"Electrical","question":"If an IDG fails and the APU is not available to power the related Transfer Bus, what occur first if an electrical overload is sensed?","options":["Automatic load shedding of the galleys and main bus on Transfer Bus 2","Automatic load shedding of the galley and main busses on on both Transfer Busses.","Automatic load shedding of the galleys and main bus on Transfer Bus 1.","Automatic load shedding of the IFE Busses."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-6-7","source":"tech1","category":"Electrical","question":"With the BUS TRANSFER switch in the AUTO position; how do the BTBs operate?","options":["BTBs isolate Transfer Bus 1 from Transfer Bus 2, if only 1 IDG is supplying power, DC Cross Tie Relay closes to connect DC Bus 1 to DC Bus 2.","BTBs isolate Transfer Bus 1 from Transfer Bus 2, if only 1 IDG is supplying power, DC Cross Tie Relay opens to isolate DC Bus 1 from DC Bus 2.","BTBs automatically maintain power to DC Bus 1 and DC Bus 2 through the DC Cross Tie Relay.","BTBs automatically maintain power to AC Transfer busses from any operating generator or external power."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-8","source":"tech1","category":"Electrical","question":"Which bus(ses) will be automatically shed if the APU is the only source of electrical power in flight?","options":["Transfer bus 2","The main busses","The galley busses","All galley and main busses"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-9","source":"tech1","category":"Electrical","question":"The amber TR UNIT light illuminated while in-flight indicates if?","options":["TR1 and TR2 have failed, or TR3 has failed.","All three TRs have failed.","One TR has failed.","TR1 has failed, or TR2 and TR3 have failed."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-10","source":"tech1","category":"Electrical","question":"The Static Inverter, converts the Battery's 22-30V DC voltage range to a constant 24V.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-6-11","source":"tech1","category":"Electrical","question":"Under what conditions are DC bus 1 and DC bus 2 isolated.","options":["When the cross bus tie relay opens.","At glide slope capture during a a flight director or autopilot ILS apporach.","Switching the Bus Transfer switch to OFF.","All the other answers are true."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-12","source":"tech1","category":"Electrical","question":"When external ground power is connected to the aircraft through the External AC Receptacle, the GRD POWER AVAILABLE light does not illuminate unless the power supplied meets the quality requirements of 115v AC, 200 Hz, 3 phase.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-6-13","source":"tech1","category":"Electrical","question":"An illuminated amber ELEC light on the AC and DC Metering Panel indicates?","options":["A fault exists in the AC power system and the DC power system","A fault exists in the DC power system or the Standby power system","A fault exists in the AC power system or the DC power system","A fault exists in the DC power system and the Standby power system"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-6-14","source":"tech1","category":"Electrical","question":"With the STANDBY POWER switch (located on the Generator Drive and Standby Power Panel) in the AUTO position, will the loss of a single DC Bus result in automatic switching from normal to alternate power?","options":["No, for automatic switching to occur power must be lost from both DC Busses","Only if power from from DC Bus 1 is lost and power from AC Transfer Bus 1 is also lost","Only if power from DC Bus 2 is lost","Only if power from DC Bus 1 is lost"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-15","source":"tech1","category":"Electrical","question":"Which electrical bus is always connected and powered whenever the aircraft battery is fitted?","options":["DC Standby bus - power to important systems that require to be in standby mode.","Hot Battery Bus - power immediately available to important systems such as fire extinguishers.","Battery bus - power immediately available to important systems such as fire extinguishers.","AC standby bus- powered through Transformer Rectifier to ensure no power interuption to GPS system."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-6-16","source":"tech1","category":"Electrical","question":"Why are the covers on the Drive DISCONNECT switches red?","options":["To identify an emergency operation control switch.","To identify switch action is irreversible in flight.","To identify a NNP memory item.","For easy identification of an emergency operation in low light conditions."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-6-17","source":"tech1","category":"Electrical","question":"If the APU is powering Transfer Bus 1 and GEN 2 is powering Transfer Bus 2, what will occur when the Ground Power (GRD PWR) Switch is turned to ON?","options":["Ground Power will power both Transfer Busses. The SOURCE OFF lights will remain extinguished.","The APU will power Transfer Bus 1 and Ground Power will power Transfer Bus 2.","Ground Power will power Transfer Bus 1 and GEN 2 will power Transfer Bus 2.","Ground Power will power both Transfer Busses and the SOURCE OFF lights will illuminate."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-6-18","source":"tech1","category":"Electrical","question":"What is the normal source of power for the DC Standby bus?","options":["TR2 and TR3","TR1, TR2 and TR3","DC bus 1 and DC bus 2","The battery"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-6-19","source":"tech1","category":"Electrical","question":"What is the purpose of the Ground Service switch on the forward attendant's panel?","options":["Provides ground power directly to the AC ground services bus for utility outlets, cabin lighting, and battery charger without powering all aircraft electrical busses.","Energises the No1 and No2 115V GND SERVICE BUS, to allow the galleys water heaters to be powered whilst the aircraft is connected to ground power.","Powers and sounds external horn through the AC ground services bus to attract attention of ground servicing personnel.","Provides power to external services used by ground servicing personnel."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-6-20","source":"tech1","category":"Electrical","question":"What is the normal AC power source for TR3?","options":["Transfer Bus 1","Main Bus 1","Main Bus 2","Transfer Bus 2"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-21","source":"tech1","category":"Electrical","question":"What is the effect of selecting the Drive Disconnect switch to DISCONNECT?","options":["AC Standby Bus is immediately powered by Inverter from batteries.","No effects take place until STANBY POWER switch is also moved to BAT.","DRIVE light illuminates, AC electrical power is lost on associated Transfer Bus, AC Standby Bus powered from opposite Transfer Bus.","IDG is disconnected if running, and DRIVE light illuminates."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-22","source":"tech1","category":"Electrical","question":"What is the source of power for the AC Standby bus if all AC power is lost.","options":["The DC Standby Bus","The TRs","The Battery Charger","The Static Inverter"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-23","source":"tech1","category":"Electrical","question":"The main battery charger is powered by?","options":["AC Ground Service Bus 2","Transfer Bus 2","Transfer Bus 1","AC Ground Service Bus 1"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-6-24","source":"tech1","category":"Electrical","question":"The 2 basic rules of the B737-800 electrical system are: Only one AC power source can be connected at one time. A second source connecting to a transfer bus will automatically disconnect the existing source.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-6-25","source":"tech1","category":"Electrical","question":"What indications will you see on the electrical panel when selecting GRD PWR ON?","options":["GRD POWER AVAILABLE light illuminated, SOURCE OFF lights extinguished, GEN OFF BUS lights illuminated, TRANSFER BUS OFF lights extinguished, APU GEN OFF BUS light illuminated.","GRD POWER light extinguished, SOURCE OFF lights illuminated, GEN OFF BUS lights illuminated, TRANSFER BUS OFF lights extinguished, APU GEN OFF BUS light illuminated.","GRD POWER AVAILABLE light extinguished, SOURCE OFF lights extinguished, GEN OFF BUS lights illuminated, TRANSFER BUS OFF lights extinguished, APU GEN OFF BUS light illuminated.","GRD POWER AVAILABLE light illuminated, SOURCE OFF lights extinguished, GEN OFF BUS lights illuminated, TRANSFER BUS OFF lights extinguished, APU GEN OFF BUS light extinguished."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-26","source":"tech1","category":"Electrical","question":"If operating on a single IDG and an overload is sensed, the electrical system will shed the galleys and main bus from Transfer Bus 1 and then Transfer Bus 2 before then shedding the IFE busses if an overload is still sensed.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-6-27","source":"tech1","category":"Electrical","question":"The TR UNIT light illuminated when on the ground indicates: ?","options":["any TR has failed","any two TRs have failed","TR1 has failed or TR2 and TR3 have failed","All three TRs have failed"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-6-28","source":"tech1","category":"Electrical","question":"Under normal conditions, what powers DC Bus 1?","options":["TR2","TR1 and TR2","TR1","TR2 and TR3"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-6-29","source":"tech1","category":"Electrical","question":"Which air conditioning system will not operate unless the CAB/UTIL switch is ON?","options":["All 115V AC galley busses","Left & right Recirculation fans","Temperature controls","Air conditioning packs"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-6-30","source":"tech1","category":"Electrical","question":"How is the auxiliary battery charger powered?","options":["Through Ground Service Bus 2","Through the AC Ground Service Bus","Through DC Bus 1","Through the AC Standby Bus"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-6-31","source":"tech1","category":"Electrical","question":"With the STANDBY POWER switch (located on the Generator Drive and Standby Power Panel) in the AUTO position, will the loss of a single AC Transfer Bus result in automatic switching from normal to alternate power?","options":["No, for automatic switching to occur power must be lost from both AC Transfer Busses","Only if power from AC Transfer Bus 2 is lost","Only if power from AC Transfer Bus 1 is lost and power from DC Bus 1 is also lost","Only if power from AC Transfer Bus 1 is lost"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-32","source":"tech1","category":"Electrical","question":"In the event of the loss of all engine and APU IDGs, the Standby Power system will provide what electrical power?","options":["115V AC and 22 to 30V DC.","22-30V DC","24V DC .","115V AC and 24V DC"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-6-33","source":"tech1","category":"Electrical","question":"If Ground power is powering both Transfer Busses, the APU is available, and is selected to power Transfer Bus 1, which statement is correct?","options":["Ground power will be automatically disconnected and the APU will power both Transfer Busses.","Ground power will be automatically disconnected and the APU will power Transfer Bus 1. Transfer Bus 2 is unpowered.","Ground power will continue to power the Transfer Busses until the APU is selected to power both Transfer Busses.","The APU will power Transfer Bus 1 and Ground power will power Transfer Bus 2"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-6-34","source":"tech1","category":"Electrical","question":"What is the normal source of power for the AC Standby Bus?","options":["The Static Inverter","AC Transfer Bus 1","Ground Service Bus 1","AC Transfer Bus 2"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-6-35","source":"tech1","category":"Electrical","question":"The SOURCE OFF light illuminates whenever an IDG has tripped offline due to overheating.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-6-36","source":"tech1","category":"Electrical","question":"Maintaining uninterrupted power on both AC Transfer Busses is primarily the function of:","options":["The Ground Service Busses","The Transfer Busses","The IDGs","The Bus Tie Breakers (BTBs)"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-7-1","source":"tech1","category":"Engines & APU","question":"The APU engine air inlet door is located at the rear of the fuselage just below and forward of the left horizontal stabiliser.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-2","source":"tech1","category":"Engines & APU","question":"The APU can operate and supply bleed air only, up to the aircraft operating ceiling of 41, 000 feet.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-3","source":"tech1","category":"Engines & APU","question":"APU cooling air enters along with APU engine air through the APU intake located on the right rear fuselage.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-4","source":"tech1","category":"Engines & APU","question":"In flight, with the APU as the only source of electrical power; if the electrical load exceeds the APU Generator design limit, the galley busses and the IFE busses are the first to be automatically shed.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-5","source":"tech1","category":"Engines & APU","question":"The APU requires an AC power supply for starting.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-6","source":"tech1","category":"Engines & APU","question":"With the APU running, how can it be stopped immediately?","options":["Move the APU START switch to OFF.","Rotate APU FIRE switch","All of the above.","Switch the battery off."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-7-7","source":"tech1","category":"Engines & APU","question":"What condition would cause an automatic shutdown of the APU?","options":["An APU high oil temperature condition occurs or The APU overspeeds or APU fuel control unit failure.","The APU has no automatic shutdown protection - shutting down the APU is always Flight Crew initiated.","The APU overspeeds or APU fuel control unit failure","An APU high oil temperature condition occurs or The APU overspeeds."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-7-8","source":"tech1","category":"Engines & APU","question":"With the fuel pumps off, where does the APU fuel supply come from?","options":["No 1 Main Tank.","Left side of the Fuel Manifold.","Suction fed from Centre Tank.","From tapping in left engine supply line."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-7-9","source":"tech1","category":"Engines & APU","question":"Approach idle is selected in flight by the EECs under what normal conditions(s)?","options":["Landing gear extended","Below 2,000 feet","Below 15,000 feet","Flaps are in landing configuration or engine anti-ice is ON"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-7-10","source":"tech1","category":"Engines & APU","question":"On a ground start, if a Wet start is detected, when will the EEC turn off ignition and shut off fuel to the engine.","options":["10 seconds after start lever moved to idle","15 seconds after throttle lever moved to Idle","15 seconds after the start lever moved to Idle","The EEC does not turn off ignition and fuel - this is a crew responsibility."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-7-11","source":"tech1","category":"Engines & APU","question":"What effect does moving the N1 SET Outer Knob to BOTH have on A/T operation?","options":["Causes the A/T system to set an increased Max Thrust bug for both engines.","Causes the A/T system to set a reduce Max Thrust bug for both engines.","Causes the A/T system to disengage.","Has no effect on the A/T system operation."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-7-12","source":"tech1","category":"Engines & APU","question":"How is fuel heated prior to reaching the engine?","options":["The IDG oil cooler","An electrical fuel heater","The main engine oil cooler.","The main engine oil cooler and the IDG oil cooler"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-7-13","source":"tech1","category":"Engines & APU","question":"The Master Caution lights and ENG system annunciator lights will illuminate if the EEC automatically enters the soft alternate mode.","options":["True","False","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-7-14","source":"tech1","category":"Engines & APU","question":"Which indication is NOT supplied to the Secondary Engine Indications on the lower DI via the EEC?","options":["Oil temperature","Oil pressure","Oil quantity","Fuel flow"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-7-15","source":"tech1","category":"Engines & APU","question":"In flight, if a fault prevents the EEC receiving flap or anti-ice signals; at what altitude would the Approach Idle schedule begin?","options":["Below 20,000 feet.","Approach idle must be selected by the crew in these circumstances.","Below 15,000 MSL.","Below 15,000 feet RA"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-7-16","source":"tech1","category":"Engines & APU","question":"The engine start valve closes and the START VALVE OPEN alert on the upper DU extinguishes at approximately ?","options":["50% N2","56% N2","25% N2","20% N1"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-17","source":"tech1","category":"Engines & APU","question":"Where in the engine oil system is the oil filter located?","options":["In the engine oil supply after leaving the oil tank","In the engine bearings supply line","In the oil tank","In the engine oil return line before reaching the oil tank"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech1-7-18","source":"tech1","category":"Engines & APU","question":"How is the engine fuel heated prior to entering the engine?","options":["Heated by passing through engine oil heat exhanger only.","Heated by passing through IDG oil heat exchanger and engine oil heat exchanger.","Heated only by Kinetic energy imparted due to pressure increase passing through the 1st and 2nd stage engine fuel pumps.","Engine fuel is not heated until it is burnt in the engine combustion chamber."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-19","source":"tech1","category":"Engines & APU","question":"Which bus powers the left igniter plug?","options":["AC Transfer Bus 2","AC Transfer Bus 1","The AC Standby Bus","DC Bus 1"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-20","source":"tech1","category":"Engines & APU","question":"Can reverse thrust be deployed if the aircraft has not touched down?","options":["No, the air/ground safety sensor must be in the ground mode and either radio altimeter senses zero ft RA","Yes, if the forward thrust levers are in the idle position and either radio altimeter senses less than 10 feet RA.","No, the air/ground safety sensor must be in the ground mode","Yes, if the forward thrust levers are in the idle position and both radio altimeters sense less than 10 feet RA."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-21","source":"tech1","category":"Engines & APU","question":"Which ENGINE START switch position will provide ignition to both igniters regardless of igniter selector switch position when the engine start lever is in IDLE?","options":["GRD","FLT","CONT","CONT and FLT"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-22","source":"tech1","category":"Engines & APU","question":"During an in-flight start the EGT Start Limit Redline is never displayed.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-23","source":"tech1","category":"Engines & APU","question":"What condition causes the A/T LIM indication to illuminate WHITE on the upper centre display panel?","options":["The FMC is not providing the A/T system with N1 limit values","The Forward Thrust Levers have been advanced to the fully forward position by the A/T system.","The Forward Thrust Levers have been manually advanced to the fully forward position.","The A/T system is no longer sending an EGT limit values to the FMC."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-7-24","source":"tech1","category":"Engines & APU","question":"Which bus powers the right igniter plug?","options":["AC Transfer Bus 2","AC Transfer Bus 1","The AC Standby Bus","DC Bus 1"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech1-7-25","source":"tech1","category":"Engines & APU","question":"How is the EEC affected the failure of one DEU (Display Electronic Unit) ?","options":["Both EECs revert to soft alternate mode and the ALTN switch illuminates.","Both EECs are rendered inoperative and the EEC ON indication extinguishes.","Failure of a single DUE has no effect on the EECs.","The EEC for the related side reverts to soft alternate mode and the ALTN switch illuminates."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech1-7-26","source":"tech1","category":"Engines & APU","question":"At what point during a normal start is the EEC supplied with electrical power?","options":["When the engines accelerates to a speed greater than 15% N2","When the engine start switch is positioned to GRD","When the battery switch is placed ON","When the engines accelerates to a speed greater than 25% N2 or max motoring"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech1-7-27","source":"tech1","category":"Engines & APU","question":"If both the ON and ALTN lights in the EEC switch are illuminated, what does this indicate?","options":["The EEC is inoperative for that engines.","The EEC has been manually switched to the soft alternate mode","The EEC has automatically switched to the soft
