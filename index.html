<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlightDeck | B737 Question Bank</title><link rel="icon" type="image/svg+xml" href="/assets/logo.svg"><style>
:root{--bg:#f6f7f9;--white:#fff;--text:#18212e;--muted:#79818c;--line:#e7e9ee;--orange:#f47a29;--pale:#fff2e9;--green:#15946a;--red:#d44749;--shadow:0 8px 30px #2330470b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 Inter,'Segoe UI',Arial,sans-serif;color:var(--text)}button,select,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.layout{display:flex;min-height:100vh}.sidebar{width:245px;background:white;border-right:1px solid var(--line);padding:26px 15px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 30px;font-size:18px;font-weight:850;letter-spacing:-.5px}.logo{background:var(--orange);color:white;border-radius:12px;padding:9px;font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}.nav{width:100%;text-align:left;background:none;border:0;border-radius:11px;padding:13px 14px;color:#68717d;margin:3px 0;font-weight:650}.nav.active{background:var(--pale);color:#d65e13}.main{flex:1;min-width:0;padding:35px clamp(18px,5vw,68px);max-width:1500px;margin:auto}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--orange);font-weight:850}.heading{font-size:clamp(25px,3vw,36px);letter-spacing:-1.1px;margin:6px 0 5px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:23px;box-shadow:var(--shadow)}.stat{font-size:34px;font-weight:850;letter-spacing:-1.3px}.small{font-size:12px;color:var(--muted)}.orange{color:var(--orange)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:23px 0}.btn{border:0;border-radius:11px;background:var(--orange);color:white;padding:12px 18px;font-weight:750}.btn.secondary{background:#fff;color:#343d4b;border:1px solid var(--line)}.btn.ghost{background:var(--pale);color:#d55c13}.section{margin:30px 0 14px;font-weight:800;font-size:18px}.source{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;background:white;border:1px solid var(--line);border-radius:13px;padding:17px;margin:9px 0}.source:hover,.answer:hover:not(:disabled){border-color:#f8b17c}.source strong{display:block}.source small{color:var(--muted)}.tag{border-radius:9px;background:var(--pale);color:#d05d18;padding:5px 9px;font-size:12px;font-weight:750}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:18px 0}.field{display:flex;flex-direction:column;gap:8px;font-weight:750;font-size:13px}.field select,.field input{width:100%;background:white;border:1px solid #dfe3e9;border-radius:10px;padding:12px;color:var(--text)}.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.topic{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;display:flex;gap:9px;align-items:center;font-size:13px}.topic input{accent-color:var(--orange)}.question{font-size:clamp(19px,2.4vw,25px);font-weight:760;line-height:1.4;margin:25px 0}.answer{display:flex;gap:15px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:16px;margin:10px 0;color:var(--text)}.letter{width:32px;height:32px;border-radius:8px;background:#f2f3f5;display:grid;place-items:center;flex-shrink:0;font-weight:800}.answer.correct{border-color:#57b996;background:#f0fbf6}.answer.wrong{border-color:#ed9b9d;background:#fff2f2}.answer.correct .letter{background:var(--green);color:white}.answer.wrong .letter{background:var(--red);color:white}.feedback{padding:18px;border-radius:12px;background:#f3f5f7;margin:19px 0}.feedback.good{background:#effbf5}.feedback.bad{background:#fff0f0}.progress{height:7px;background:#e9edf0;border-radius:20px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:var(--orange);transition:width .2s}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.timer{font-size:18px;font-weight:850;font-variant-numeric:tabular-nums}.timer.danger{color:var(--red)}.history{width:100%;border-collapse:collapse}.history th,.history td{text-align:left;border-bottom:1px solid var(--line);padding:13px 8px;font-size:13px}.history th{color:var(--muted)}.pass{color:var(--green);font-weight:850}.fail{color:var(--red);font-weight:850}.pill{border-radius:20px;padding:5px 10px;background:#f3f4f6;font-size:12px}.hero{background:linear-gradient(110deg,#fff,#fff5ec);border:1px solid #f7e3d4;border-radius:20px;padding:28px;margin:22px 0}.empty{padding:30px;text-align:center;color:var(--muted)}.review{border-top:1px solid var(--line);padding:16px 0}.review p{margin:5px 0}.footer{margin:35px 0;color:var(--muted);font-size:12px}.mobilebar{display:none}@media(max-width:850px){.sidebar{display:none}.main{padding:22px 15px 95px}.grid{grid-template-columns:1fr 1fr}.formrow,.topics{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:8px 3px;z-index:10}.mobilebar button{background:none;border:0;font-size:12px;padding:10px 5px;color:#5b6470}.mobilebar .active{color:var(--orange);font-weight:850}}@media(max-width:500px){.grid{grid-template-columns:1fr}.card{padding:18px}.heading{font-size:27px}.history{display:block;overflow:auto}}

.nav{display:flex;align-items:center;gap:12px}.nav svg,.mobilebar svg{width:19px;height:19px;flex-shrink:0}.brand{gap:12px}.brand span:last-child{line-height:1.12}.brand small{line-height:1.6;margin-top:6px}.logo{width:53px;height:53px;display:grid;place-items:center;border-radius:16px;font-size:19px;letter-spacing:-1px}.sidebar{width:260px}.nav{padding:14px 13px}.nav svg{stroke-width:1.9}.statsgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.metric{display:flex;justify-content:space-between;gap:12px}.metric svg{width:25px;height:25px;color:var(--orange)}.metric .stat{margin:14px 0 3px}.metric .small{line-height:1.4}.answer.selected{border-color:var(--orange);background:var(--pale)}.answer.selected .letter{background:var(--orange);color:white}.textanswer{display:block;width:100%;min-height:135px;border:1.5px solid #dfe3e9;border-radius:12px;padding:16px;resize:vertical;font:inherit}.textanswer:focus{outline:2px solid #f6b17e}.feedback p{margin:8px 0}.subtle{color:var(--muted);font-size:13px}.dangerbtn{border:1px solid #eeb1b1;color:#c13d42;background:#fff6f6}.filterline{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:white;padding:7px 12px;border-radius:30px;font-weight:650;font-size:12px}.chip.active{background:var(--pale);border-color:#f9bb8b;color:#c45a18}.statsgrid .card{min-height:155px}.mobilebar button{display:flex;flex-direction:column;align-items:center;gap:3px}.mobilebar svg{width:21px;height:21px}@media(max-width:1000px){.statsgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.statsgrid{grid-template-columns:1fr 1fr}.statsgrid .card{padding:15px;min-height:130px}.metric .stat{font-size:27px}.sidebar{display:none}}@media(max-width:360px){.statsgrid{grid-template-columns:1fr}}.quiz-progress-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 8px;font-weight:750}.quiz-progress-header strong{font-size:16px}.quiz-progress-header .count{font-variant-numeric:tabular-nums;color:var(--orange)}.quiz-progress-header .pct{color:var(--muted);font-size:13px}.question{overflow-wrap:anywhere}</style><style>.auth-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#fff7f0,#f6f7f9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:22px}.auth-card{width:min(100%,420px);background:white;border:1px solid #eee;border-radius:24px;box-shadow:0 25px 80px #17203416;padding:32px}.auth-card h1{font-size:31px;margin:12px 0 0}.auth-card p{color:#79818c;margin:4px 0 18px}.auth-card form,.auth-form{display:grid;gap:13px}.auth-card label,.auth-form label{display:grid;gap:5px;font-weight:650;font-size:13px}.auth-card input,.auth-form input{width:100%;padding:12px;border:1px solid #dce0e5;border-radius:10px}.auth-tabs{display:flex;background:#f4f5f6;border-radius:12px;padding:4px;margin:20px 0}.auth-tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:700}.auth-tabs button.selected{background:#fff;color:#e76c1e;box-shadow:0 2px 8px #00000010}.auth-card .btn{width:100%}.auth-card .auth-note{font-size:12px;margin-top:20px}.auth-card #authMsg{color:#bd4040;font-size:13px;margin:0}.auth-form{max-width:430px;margin:15px 0}</style><style>.hero{background:linear-gradient(90deg,rgba(8,16,27,.95),rgba(8,16,27,.55)),url('/assets/cockpit-cover.png') center 44%/cover;min-height:295px;color:#fff;display:flex;flex-direction:column;justify-content:center;border:0;overflow:hidden}.hero h2{font-size:clamp(28px,3.6vw,48px);max-width:630px;letter-spacing:-1.5px;line-height:1.1;margin:12px 0}.hero .muted{color:#d4dbe5;max-width:550px}.hero .eyebrow{color:#ff9a54}.hero .btn.secondary{background:#ffffff18;color:#fff;border-color:#ffffff60}.hero .btn.secondary:hover{background:#ffffff30}.auth-overlay{background:linear-gradient(90deg,#08101be8,#08101b99),url('/assets/cockpit-cover.png') center/cover}.auth-card{box-shadow:0 30px 95px #0006}.auth-card{max-height:95vh;overflow:auto}@media(max-width:600px){.hero{min-height:330px;padding:23px}.hero h2{font-size:31px}}</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><img src="/assets/logo.svg" alt="FlightDeck logo" width="53" height="53" style="border-radius:14px"><span>FLIGHTDECK<small>B737 QUESTION BANK</small></span></div><div id="nav"></div><div class="footer">FLIGHTDECK · v7<br>Progress saved per account on this device.</div></aside><main class="main" id="app"></main></div><div class="mobilebar" id="mobile"></div><script>const BANK=[{"id":"sop123-1-1","source":"sop123","category":"SOP 1","question":"The Flight Crew shall give the following to the CSS (Cabin Services Supervisor)prior to departure","options":["One copy of the SEP manual plus the CCI’s (Cabin Crew Instructions)","The SEP manual (only) but no need to give the CCI’s","The CCI’s (only) but not the SEP manual","No need to give the SEP manual or the CCI’s anymore"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-2","source":"sop123","category":"SOP 1","question":"During your walk around you see a missing security seal?","options":["a) Contact Maintrol or get an on duty engineer to replace the seal","b) Replace the seal on the commander’s authority","c) There is no requirement to have a security seal on the aircraft","d) You must obtain a new security seal from the crew room"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-3","source":"sop123","category":"SOP 1","question":"What HDG should be selected on the MCP for take-offs?","options":["a) The expected HDG allowing for drift","b) The first heading expected on the SID","c) Runway HDG","d) It doesn’t matter which HDG is selected if LNAV will be used"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-4","source":"sop123","category":"SOP 1","question":"Which of the following is true regarding the ‘Emergency Escape Rope’?","options":["a) The ‘Emergency Escape Rope’ should be checked for your station only.","b) The ‘Emergency Escape Rope is present. There is no need to check it is actually attached to the flight deck","c) The ‘Emergency Escape Ropes’ (both) are attached to the flight deck","d) There is no requirement to check the ‘Emergency Escape Rope’"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-5","source":"sop123","category":"SOP 1","question":"When starting the engines, the first step is:","options":["a) Announce engine start sequence. Plan to start engines to result in minimum fuel consumption","b) There is no requirement to announce engine start sequence","c) Plan to start engines as quickly as possible to minimum push back time","d) Only start engines after the pushback is completed"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-6","source":"sop123","category":"SOP 1","question":"The Cabin Crew must be advised of refuelling when passengers are?","options":["a) Embarking only","b) Embarking, disembarking or on board","c) Embarking or disembarking only","d) There is no requirement to advice the Cabin Crew"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-1-7","source":"sop123","category":"SOP 1","question":"You are operating an aircraft with halogen bulbs fitted. Entering the runway, the Fixed Landing lights are placed ON. When are the Retractable lights turned ON?","options":["a) When cleared for takeoff","b) These are only used for bird avoidance","c) Also when entering the runway","d) When cabin is secure for takeoff"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-8","source":"sop123","category":"SOP 1","question":"If conducting a NADP 1 departure and a SID requires a 2500ft QNH level off, is it acceptable to accelerate at?","options":["a) ‘ALT ACQ’","b) ‘ALT HOLD’ only","c) 1000ft prior to level off","d) Only accelerate once cleared to climb above 3000ft agl"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-1-9","source":"sop123","category":"SOP 1","question":"The ‘Landing Gate’ for an IMC approach (Precision or Non Precision) is?","options":["a) 500ft","b) 1000ft","c) FAF","d) 5nm’s"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-1-10","source":"sop123","category":"SOP 1","question":"During a GA, the correct roll mode at 400ft, providing routing is available is?","options":["a) VNAV","b) HDG","c) LNAV","d) No selection is required if you have pressed TOGA"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-11","source":"sop123","category":"SOP 1","question":"Ryanair and CFM recommend the following cool down period for the engine hot section thermo stabilisation?","options":["a) One minute","b) Three minutes","c) Two minutes","d) 30 seconds"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-1-12","source":"sop123","category":"SOP 1","question":"If APU operation is required on the ground and the aircraft buses are powered by AC electrical power, then:","options":["a) No fuel pump is required as it will suction feed fuel from the main tank","b) An AC powered fuel pump from left side of fuel manifold should be ON","c) All 6 fuel pumps are required to be position on","d) An AC powered fuel pump from right side of fuel manifold should be ON"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-1-13","source":"sop123","category":"SOP 1","question":"Where can one find the Ryanair Non-Normal Flight Patterns and Manoeuvres?","options":["a) Manoeuvres Section in the QRH","b) Unannunciated Checklist Section 0 in the QRH","c) Operations Manual Part A","d) FCOM VOL 2"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-14","source":"sop123","category":"SOP 1","question":"The following is the correct manoeuvre for a TCAS RA (Resolution Advisory).","options":["a) If manoeuvring is required disengage autopilot and auto-throttle and follow the correct manoeuvre as depicted on the PFD","b) If manoeuvring is required disengage the autopilot only and follow the correct manoeuvre as depicted on the PFD","c) Use the MCP panel, as necessary, with autopilot and auto-throttle engaged to establish the correct path","d) If manoeuvring is required disengage autopilot and auto-throttle and fly inside the red area on the PFD"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-15","source":"sop123","category":"SOP 1","question":"The check of the intermittent warning horn (TO Configuration) is","options":["a) Done during the pre-flight for the first flight only by the Captain","b) Done during the pre-flight checks for all flights as part of the ‘Speedbrake’ check. It is done by the PF","c) Done during the pre-flight checks for all flights as part of the ‘Speedbrake’ check. It is only done by the Captain",""],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-1-16","source":"sop123","category":"SOP 1","question":"Turbulence is encountered in flight. The Captain will decide whether to switch ON the seatbelt signs. Which pilot is responsible for actually moving the sign from AUTO to ON?","options":["a) The Captain","b) The PF as this is defined as his area of responsibility in flight","c) The PM as this is defined as his area of responsibility in flight","d) The First Officer"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-17","source":"sop123","category":"SOP 1","question":"Who first checks the maintenance status prior to the first flight?","options":["a) The PM","b) The Captain","c) The PF","d) The First Officer"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-18","source":"sop123","category":"SOP 1","question":"Preflight, prior to first flight. Who checks the Ships Library?","options":["a) The PF","b) The PM","c) The Engineer","d) The Captain"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-19","source":"sop123","category":"SOP 1","question":"When should the EMERGENCY EXIT LIGHTS be armed?","options":["a) During the rainbow scan","b) As part of the Cockpit Procedure – Captain","c) As part of the Preliminary Flight Deck Procedure – PF","d) As part of the Preliminary Flight Deck Procedure – PM"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-20","source":"sop123","category":"SOP 1","question":"Who checks the “Takeoff CONFIG” warning and when?","options":["a) The PF during Preliminary Flight Deck Procedure","b) The PM during Preliminary Flight Deck Procedure","c) The Captain ONLY","d) The First Officer ONLY"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-21","source":"sop123","category":"SOP 1","question":"The circuit breaker panel located behind the Capt. seat is referred to as:","options":["a) The P-18 Panel","b) The P-12 Panel","c) The P-6 Panel","d) The P-3 Panel"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-22","source":"sop123","category":"SOP 1","question":"On the ground, prior to switching on the A system pump switches, ensure:","options":["a) Personnel are clear of the tow bar or the bypass pin has been installed","b) Personnel are clear of the tow bar and the bypass pin has been installed","c) The ‘A’ system should never be pressurised if a pushback is required","d) There is no requirement to check anything before switching A pumps ON"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-23","source":"sop123","category":"SOP 1","question":"Who completes the Light Test pre-flight?","options":["a) PF","b) PM","c) Engineer","d) The Captain"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-24","source":"sop123","category":"SOP 1","question":"The IFE Switch on the overhead panel is normally left","options":["a) OFF, as it is not connected to any system","b) OFF, as long as Galley Power is not required","c) ON, the IFE Switch is always turned ON as part of the pre-flight procedure","d) ON inflight and OFF on the ground"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-25","source":"sop123","category":"SOP 1","question":"When should the LOGO lights be ON?","options":["a) At night below FL100","b) At night","c) During ground operations only","d) Never"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-26","source":"sop123","category":"SOP 1","question":"Which ‘ENGINE START IGN’ selection should be made for engine start?","options":["a) Position right for the first start at a Ryanair base and alternate subsequently","b) Position ‘both’ only for all flights","c) Position right for operating through a manned maintenance base","d) Position left for operating through a manned maintenance base"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-27","source":"sop123","category":"SOP 1","question":"28) What altitude should be set on the MCP prior to ATC clearance being received?","options":["a) Expected SID minus 100ft","b) Expected SID plus 100ft","c) Expected SID clearance limit","d) Expected SID plus 1100ft"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-1-28","source":"sop123","category":"SOP 1","question":"29) The minimum OIL QTY for dispatch is?","options":["a) 14 LTS","b) 13 LTS","c) 12 LTS","d) 15 LTS"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-29","source":"sop123","category":"SOP 1","question":"30) A full test of the GPWS is carried out by the?","options":["a) Engineers daily","b) PF, first flight or crew change only","c) F/O, first flight or crew change only","d) CPT, first flight or crew change only"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-30","source":"sop123","category":"SOP 1","question":"31) The standard FMC fuel cost index is?","options":["a) 30","b) 6","c) As per flight plan","d) 35"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-31","source":"sop123","category":"SOP 1","question":"32) The Ryanair policy is to use ‘Maximum Assumed Temperature Reduction’ Take-off thrust?","options":["a) Except when there is an Emergency Turn for the runway","b) Wherever permitted by OPT or SOP’s","c) Only when necessary for noise abatement profiles","d) Always"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-1-32","source":"sop123","category":"SOP 1","question":"33) The PRE-FLIGHT instrument scan is which of the following?","options":["a) Time, Speed, Alt, QNH, HDG, VSI and FLAGS","b) Time, QNH, ALT, MFRA, FD’s & SBY instruments","c) Time, FMA, V2, MFRA, VSI, HDG, FLAGS & SBY instruments","d) Time, Alt, QNH, HDG and FLAGS"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-1-33","source":"sop123","category":"SOP 1","question":"34) Engine Start: The PF calls, ‘Monitor Number__’","options":["a) As the Start Switch moves to the OFF position","b) As the engine cuts back","c) After the Start Valve Open light extinguishes and the PM calls, ‘Starter cut-out’","d) Once N2 is observed to pass 46% N1"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-34","source":"sop123","category":"SOP 1","question":"35) Which position should the ISOLATION valve be in for engine start?","options":["a) OPEN","b) AUTO","c) CLOSE","d) ISOLATE"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-35","source":"sop123","category":"SOP 1","question":"36) Prior to taxi the F/O should call?","options":["a) ‘Ground equipment clear right’","b) ‘Clear right’","c) ‘Clear’","d) Nothing"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-1-36","source":"sop123","category":"SOP 1","question":"37) Which items will the Captain review as part of the Before Takeoff checklist under ‘Takeoff Briefing’?","options":["a) Bleeds, Speeds and SID","b) Packs, Bleeds, Speeds, SID - including initial turn required, STOP altitude, ET if required and adverse weather","c) Flaps, Trim, Speeds, SID initial altitude, STOP altitude, Emergency Turn and adverse weather","d) The departure SID only"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-1-37","source":"sop123","category":"SOP 1","question":"38) What is the earliest height that Standard (1013hPa) may be set on climb out?","options":["a) As soon as you are cleared to a FL by ATC","b) Passing the Transition Altitude","c) When the aircraft is above 3000ft AAL and when cleared to a FL","d) When passing 3000ft on t :"sop123-1-87","source":"sop123","category":"SOP 1","question":"88) The ‘Landing Gate’ requires one to be fully stabilised","options":["a) With all checklists complete at 1,000 feet (all approaches)","b) With all checklists complete at 500 feet (all approaches)","c) With all checklists complete at 1,000 feet, except landing lights (VMC)","d) With all checklists complete at 1,000 feet, except landing lights (IMC)"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-1-88","source":"sop123","category":"SOP 1","question":"89) The ‘External Inspection’ (walk around) should be done by the:","options":["a) Captain","b) First Officer","c) Pilot Flying for the next sector","d) Pilot Monitoring for the next sector"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-1-89","source":"sop123","category":"SOP 1","question":"90) The taxi briefing on departure must always include:","options":["a) A review of the expected taxi routing to the runway of departure","b) A review of the expected taxi routing at the destination","c) A review of the ‘Passenger Evacuation’ drill","d) A review of the aircraft ‘Go around’ procedure"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-90","source":"sop123","category":"SOP 1","question":"91) During taxi in and taxi out:","options":["a) The Captain must write the instructions in the FMC scratch pad and then progressively monitor the progress of the taxi against the chart","b) The Captain (LHS) must write down all taxi instructions & cross check against the aerodrome chart. The F/O (RHS) must progressively monitor the progress of the taxi against the chart during taxi","c) The F/O (RHS) must write down all taxi instructions. The Captain (LHS) must crosscheck this. The Captain then progressively monitors the progress of the taxi against the aerodrome chart","d) The F/O (RHS) must acknowledge the taxi instructions, write them in the FMC scratchpad and ensure both pilots understand them"],"answer":3,"explanation":"","type":"mcq"},{" ch (CDA)"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-96","source":"sop123","category":"SOP 1","question":"97) The standard call in the event of a ‘Passenger Evacuation’ is","options":["a) ‘‘This is your Captain speaking, evacuate the aircraft using all available exits’’.This call is to be repeated once","b) ‘‘This is your Captain speaking, evacuate the aircraft using right /left emergency exits only’’. This call is to be repeated once","c) ‘‘This is an Emergency. Evacuate the aircraft using right/left emergency exits only’’. This call is to be repeated once","d) “This is an Emergency. Evacuate the aircraft using all available exits’’. This call is to be repeated once"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-1-97","source":"sop123","category":"SOP 1","question":"98) The V1 aural call on take-off must","options":["a) Be complete by V1","b) Be commenced at V1","c) Responded to by the Pilot Flying (PF) with a ‘Check’ call","d) Be made by the Pilot Flying (PF)"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-98","source":"sop123","category":"SOP 1","question":"99) A runway covered with more than 3mm of ‘Slush’ is considered for performance reasons to be a","options":["a) ‘Contaminated Runway’","b) ‘Slippery Runway’","c) ‘Wet Runway’","d) ‘Damp Runway’"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-1-99","source":"sop123","category":"SOP 1","question":"100) In the event of a ‘Engine Failure’ on Take-off one should","options":["a) Follow the SID","b) Always climb straight ahead","c) Climb straight ahead unless there is an ‘Emergency Turn’ and inform ATC","d) Follow the SID unless there is an ‘Emergency Turn’"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-1-100","source":"sop123","category":"SOP 1","question":"101) An ‘Emergency Turn’ (engine failure on takeoff) must be flown","options":["a) At V2 (magenta bug) and 15°bank. The turn must always be complete before level acceleration and Flap retraction","b) At V2 + 15 kts (white bug) and 30° bank. The turn must be complete before level acceleration and Flap retraction","c) At V2 (magenta bug) and 15° bank. The turn does not need to be completed before level acceleration unless specified in the ETP","d) At V2 (magenta bug) and 30°bank. The turn must be complete before level acceleration and Flap retraction"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-2-1","source":"sop123","category":"SOP 2","question":"102) If published, an Emergency Turn Procedure:","options":["a) Is not required to be completed if on a SID","b) Is a means for ATC to route you away from high terrain in the event of an engine failure after takeoff","c) Would be completed, instead of flying straight ahead following an engine failure on Take off","d) Is a means to return quickly return for a landing at the airfield of departure"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-2-2","source":"sop123","category":"SOP 2","question":"103) When do the pilots need to do a Takeoff Emergency brief?","options":["a) Only at unfamiliar Airports","b) Each pilot on their first flight of the day as PF","c) Only needed when there is an ET","d) Not required at a pilot’s base"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-2-3","source":"sop123","category":"SOP 2","question":"104) Preflight: How is the instrument crosscheck performed","options":["a) The PF calls Time (UTC), QNH, Altimeter, MFRA, FD and standby instruments.PM follows silently","b) The PM calls Time (UTC), QNH, Altimeter, MFRA, FD and standby instruments. PF follows silently","c) The PF reads Time (UTC), QNH, Altimeter, MFRA, FD, Nav Aid-Idents and standby instruments","d) PF reads and PM responds check to Time (UTC), QNH, Altimeter, MFRA, FD and standby instruments"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-2-4","source":"sop123","category":"SOP 2","question":"105) The After T/O checks are:","options":["a) A normal challenge and response checklist","b) A totally silent checklist called for by the PF after “Flaps up no light”","c) Done silently, except for “Air Conditioning & Press” which is called aloud & the “Altimeters” check, which is challenge & response","d) Performed immediately after N1 annunciation on FMA"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-2-5","source":"sop123","category":"SOP 2","question":"106) Who enters the Zero-fuel weight into the FMC during the Final CDU Preflight?","options":["a) The PF","b) The PM","c) The Captain","d) The First Officer"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-2-6","source":"sop123","category":"SOP 2","question":"107) What is normal during pushback and engine-start?","options":["a) The CPT handles ground communications and the FO starts the engines all the time","b) The CPT handles ground communications and Starts the engines all the time","c) The CPT handles ground communications and the PF starts the engines all the time","d) The CPT handles ground communications and the PM starts the engines all the time"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-2-7","source":"sop123","category":"SOP 2","question":"108) The First Officer will commence the “Before Takeoff” checks when:","options":["a) The CPT turns taxi and turnoff lights to ON","b) The CPT asks for the “Before Takeoff checklist”","c) As soon as the FO finds it appropriate regarding obstacles and ground traffic","d) When the aircraft starts moving"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-2-8","source":"sop123","category":"SOP 2","question":"109) When hearing the EGPWS ‘minimums’ call on a NPA using V/S with no visual contact having been confirmed:","options":["a) The F/O will set the MAA and commence the G/A immediately","b) The PF will push TO/GA and call \"Go-around, flap 15\" etc.","c) The CPT will always take control.","d) The PM set the MAA and then take control to perform the GA"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-2-9","source":"sop123","category":"SOP 2","question":"110) What is the latest point to select flap one (1) on all approach?","options":["a) 10 nm from RW xx point","b) 10 nm from start of descend","c) 10 nm from FAF","d) 2 nm from start of descend"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-2-10","source":"sop123","category":"SOP 2","question":"111) During the climb the ‘Ten Checks’ are?","options":["a) Performed silently ‘Lights, APU, seatbelts, Air Con & Pressurisation, Recall’","b) Performed aloud ‘Fuel, Lights, APU, Pressurisation & Air Con, Seatbelts, Recall","c) Performed aloud ‘Lights, Fasten Belts, Air Con & Pressurisation, Recall’","d) Performed aloud ‘Air Con & Pressurisation, Recall’"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-2-11","source":"sop123","category":"SOP 2","question":"112) As part of the evacuation checklist, the F/O will:","options":["a) Pull and rotate all engine and APU fire switches","b) Pull all engine and APU fire switches and only rotate a fire switch that is illuminated","c) Not pull any fire switches unless a fire light is illuminated","d) Pull and rotate engine fire switches only, unless the APU fire switch is illuminated"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-2-12","source":"sop123","category":"SOP 2","question":"113) In case of an APU fire:","options":["a) The CPT only calls for memory items","b) The PF calls for the memory items","c) The CPT calls for the APU fire NNC","d) The PM calls for the memory items"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-2-13","source":"sop123","category":"SOP 2","question":"114) Regarding IRS alignment:","options":["a) A full alignment is only required for the first flight of each duty period","b) A full alignment is required on each turnaround","c) Fast realignments are not permitted except in extreme wind conditions","d) A full realignment is only required after a flight time of 2 hours or greater"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-2-14","source":"sop123","category":"SOP 2","question":"115) To achieve the target touchdown speed of Vref:","options":["a) The PM will call “speed” whenever the speed is more than Vref +10kts or less than Vref","b) The PM will call “speed” whenever the speed is more than Vref +15kts or less than Vapp","c) The PM will call “speed” whenever the speed is more than Vapp +15kts or less than Vref","d) The PM will call “speed” whenever the speed is more than Vapp +10kts or less than Vref"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-2-15","source":"sop123","category":"SOP 2","question":"116) Which statement is true regarding Monitored NPA?","options":["a) The approach can be flown by either pilot","b) At EGPWS call “minimums” with no visual contact a go-around is mandatory","c) The First Officer can call land as soon as he/she has the required visual references","d) The Captain can call land and continue the approach after ALT ACQ, as long as he/she has the required visual references"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-2-16","source":"sop123","category":"SOP 2","question":"117) Altimeter Cold temperature corrections shall be made to all MSA’s, approach altitudes, landing minima and MFRA’s whenever","options":["a) The temperature is below ISA","b) Icing conditions exist","c) Landing in IMC conditions only","d) The surface temperature is below 0 degrees Celsius"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-2-17","source":"sop123","category":"SOP 2","question":"118) The maximum approach speed additive is:","options":["a) Vref +5 or landing flaps placard speed – 5kts","b) Vref +7 or landing flaps placard speed – 5kts","c) Vref +15 or landing flaps placard speed – 5kts","d) Vref +25 or landing flaps placard speed – 5kts"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-2-18","source":"sop123","category":"SOP 2","question":"119) What is the latest point at which the autopilot has to be disengaged on a NPA using VNAV?","options":["a) At 1000ft","b) At 400ft","c) At MDA","d) At 158ft or E/D"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-2-19","source":"sop123","category":"SOP 2","question":"120) The maximum crosswind component on a CATII/IIIA Approach is?","options":["a) 5kts","b) 10kts","c) 20kts","d) 25kts"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-2-20","source":"sop123","category":"SOP 2","question":"121) The maximum tailwind component on a CAT II/IIIA Autoland is?","options":["a) 10 kts","b) 5 kts","c) Zero","d) 15 knots"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-2-21","source":"sop123","category":"SOP 2","question":"122) Where does the Captain record the stab trim setting once calculated?","options":["a) The first officer only records the stab trim setting","b) It’s not required to be recorded at all","c) Loadsheet only","d) Loadsheet and FMC scratchpad"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-2-22","source":"sop123","category":"SOP 2","question":"123) When does a Ryanair flight declare a fuel “Mayday”?","options":["a) When the calculated fuel on the arrival will be less than final reserve","b) Only on a diversion to an alternate field","c) When the calculated fuel on arrival will be less than final reserve & alternate","d) Ryanair never declares a “Mayday” for fuel emergencies"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-2-23","source":"sop123","category":"SOP 2","question":"124) During the flight deck safety inspection and preliminary flight deck procedure, the APU is normally started:","options":["a) Immediately when you arrive in the aircraft","b) Just prior to closing the L1 door","c) Just prior to closing the R1 door","d) When fuelling is finished"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-2-24","source":"sop123","category":"SOP 2","question":"125) The rear hold is checked, as part of the Exterior Inspection, by:","options":["a) The PF","b) The Captain","c) The dispatcher","d) The PM"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-2-25","source":"sop123","category":"SOP 2","question":"126) Whilst flying in RVSM airspace if you have a difference between the Captain’s and F/O’s altimeters of 180ft","options":["a) You follow the indications of the altimeter showing the lowest FL","b) You split the difference and use the ALT HLD mode to control the airplane’s flight path","c) You follow the indications of the altimeter showing the highest FL","d) You are not allowed to continue your flight and have to divert"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-2-26","source":"sop123","category":"SOP 2","question":"127) An ASR must be filed if:","options":["a) A takeoff with MTOW 66,990 has been carried out","b) A Go-Around has been executed below 1000ft AGL","c) A takeoff with MTOW 74,990 has been carried out","d) All of the above"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-2-27","source":"sop123","category":"SOP 2","question":"128) To determine the actual tailwind component is within limits for landing:","options":["a) Use FMC tailwind component as shown on PROGRESS Page 3","b) Use FMC tailwind component as shown on APPROACH REF Page","c) Use the wind shown on the ND","d) Use the tower reported wind"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-2-28","source":"sop123","category":"SOP 2","question":"129) During low visibility operations, the crew should:","options":["a) Delay extending the flaps until reaching the holding point","b) Request a “Follow Me” car to the runway","c) Have the ILS tuned to the departure runway for take off","d) Use flaps 10 for departure"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-2-29","source":"sop123","category":"SOP 2","question":"130) When will the First Officer commence the after landing items/flow?","options":["a) When decelerating through 60 kts","b) When the Captain has moved the speedbrake lever down","c) When clear of the active runway & taxi instructions have been receive ,"explanation":"","type":"mcq"},{"id":"sop123-2-34","source":"sop123","category":"SOP 2","question":"135) According to the ‘Before Taxi – No Engine Bleed’ Checklist, which of the following is true?","options":["a) If wing anti-ice is required for taxi you will configure for a no engine bleed take off just prior to takeoff","b) The CPT reads the checklist","c) The FO reads the checklist and completes the actions","d) Is located on the back side of the winter operations handy dandy"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-2-35","source":"sop123","category":"SOP 2","question":"136) A double briefing has to contain the following:","options":["a) Where Flaps 1, 5, Landing Gear, Flaps 15, (25), 30/40 are to be selected","b) The Autopilot modes and selections to be used during the approach & The ‘Landing Gate’","c) Both crew’s intentions on becoming visual & both crew’s intentions on reaching MDA if not visual (i.e. the Go-Around procedure for the aircraft to Flaps up)","d) All of above"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-2-36","source":"sop123","category":"SOP 2","question":"137) Prior to crossing or entering a runway, either active or not active, crews must make a ‘Two Phase Call’ (inter cockpit). This ‘Two Phase Call’ requires the Captain to establish with the RHS pilot that:","options":["a) The runway is clear & Cabin Secure","b) The runway may be entered or crossed & the approach is checked clear both directions (as much as is possible)","c) The runway may be entered or crossed & the RHS to confirm this","d) Takeoff clearance is received & the RHS to confirm this"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-2-37","source":"sop123","category":"SOP 2","question":"139) What is meant by 'fail passive' automatic landing system?","options":["a) In the event of a failure, autopilot disengagement causes no significant deviation of trim, flight path or attitude","b) In the event of autopilot failure, the operation may be continued utilizing the remainder of the system","c) If the ILS fails, you can use GPS to remain on the profile","d) If a pilot becomes incapacitated the approach can be continued"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-2-38","source":"sop123","category":"SOP 2","question":"141) When is a go around below 500ft mandatory during a low visibility approach?","options":["a) There is no need to Go Around since the aircraft flies and lands automatically","b) When the rate of descent is greater than 800 FPM.","c) When Pilot incapacitation is suspected","d) When the RVR’s drop below minimum required"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop123-2-39","source":"sop123","category":"SOP 2","question":"142) The frequency 121.50 MHz must be monitored","options":["a) On VHF 1 when cleared to cruise level","b) On VHF 2 when cleared to cruise level","c) Approaching an FIR boundary","d) Only during an emergency situation"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop123-2-40","source":"sop123","category":"SOP 2","question":"143) When will the 'MINIMUMS' aural call not sound?","options":["a) When the Captain has not set his minimums (BARO MINS)","b) When the FO has not set his minimums (BARO MINS)","c) When minimums on both sides differ","d) There is no minimums call from the EGPWS"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop123-2-41","source":"sop123","category":"SOP 2","question":"144) When you are planning to travel on the jumpseat you must:","options":["a) Make yourself known to the handling agent, flight crew and get the Captains approval","b) Be travelling in uniform since you are travelling as passive crew","c) Be in possession of a valid Ryanair ID, have a valid licence and passport","d) All of the above are correct"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop123-2-42","source":"sop123","category":"SOP 2","question":"147) Wing anti-ice shall be used:","options":["a) Always when icing conditions exists","b) Always on the gro rse thrust","c. Selecting the speedbrake lever to the up position","d. Select autobrake selector to OFF"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop4-1-27","source":"sop4","category":"SOP 4","question":"During a 2 engine go around, the PF calls for gear up. What should the PM crosscheck before positioning the gear up?","options":["a. Check that the VSI indicates a positive rate of climb and call \"Positive Rate\"","b. Go around thrust is set to 93%","c. Both VSI and altimeter indicate a postitive rate of climb",""],"answer":2,"explanation":"","type":"mcq"},{"id":"sop4-1-28","source":"sop4","category":"SOP 4","question":"If OAT is changed after the V speeds have been entered on the TAKEOFF REF page, the FMC removes the previously entered V speeds and a NO VSPD flag shows on the airspeed indication.","options":["FALSE","TRUE","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"sop4-1-29","source":"sop4","category":"SOP 4","question":"What action shall be taken after positioning the engine start lever to IDLE detent during engine start procedure?","options":["Verify GEN1/GEN2 AC volts on the electrical metering panel.","Verify SPAR VALVE CLOSED light transitions from dim, to bright and then extinguishes.","Verify the RAM DOOR FULL OPEN light is illuminated bright.","Verify Hydraulic Accumulator Pressure Indicator."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop4-1-30","source":"sop4","category":"SOP 4","question":"Which of the following statements is TRUE regarding the TAKEOFF BRIEFING during the Before Takeoff Procedure?","options":["The CPT reviews the briefing and verifies PACKS and BLEEDS as required.","The PF reviews the briefing and selects PACKS AUTO and BLEEDS ON.","The CPT reviews the briefing and selects PACKS AUTO and BLEEDS ON.","The PM reviews the briefing and selects PACKS AUTO and BLEEDS ON."],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-31","source":"sop4","category":"SOP 4","question":"What is the correct order of the items reviewed by the CPT during the TAKEOFF BRIEFING?","options":["Packs, bleeds, speeds, SID, stop altitude, emergency turn (if applicable) and adverse weather.","Time, QNH, indicated altitude, MFRA, Courses, V2, HDG, and MCP altitude.","Packs, bleeds, speeds, Squawk, Time, QNH, indicated altitude and MFRA.","Courses, V2, HDG, MCP altitude, Time, QNH, indicated altitude and MFRA."],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-32","source":"sop4","category":"SOP 4","question":"Prior to pushback, the \"Passengers Seated\" signal:","options":["Is received by the F/O pressing the cabin ATTEND button once the take-off briefing has been reviewed by the Captain","Is received by pressing the cabin ATTEND button once the L1 door is closed","Is obtained by the F/O via the service interphone","Is given by the No 1 prior to pushback"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop4-1-33","source":"sop4","category":"SOP 4","question":"Under which conditions do we select GEN 1 and 2 ON and the APU OFF during the engine start procedure?","options":["When both engines are stable and the parking brake has been set.","When both engines are stable provided there are no additional defects and there is no requirement to perform a NO ENGINE BLEED takeoff.","When one engine is stable and the pushback has been complete.","When both engines are stable."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop4-1-34","source":"sop4","category":"SOP 4","question":"What action shall be taken after positioning the engine start lever to IDLE detent during engine start procedure?","options":["Verify Hydraulic Accumulator Pressure Indicator.","Verify GEN1/GEN2 AC volts on the electrical metering panel.","Verify the RAM DOOR FULL OPEN light is illuminated bright.","Verify SPAR VALVE CLOSED light transitions from dim, to bright and then extinguishes."],"answer":3,"explanation":"","type":"mcq"},{"id":"sop4-1-35","source":"sop4","category":"SOP 4","question":"When do you select the transponder to ALT OFF during engine start / push?","options":["The CPT selects the transponder to ALT OFF to indicate aircraft position to ATC prior to requesting the push and start clearance.","The F/O selects the transponder to ALT OFF to indicate aircraft position to ATC prior to requesting the push and start clearance.","The F/O selects the transponder to TA RA to indicate aircraft position to ATC prior to requesting the push and start clearance.","The F/O selects the transponder to ALT OFF to as part of the below the line flow."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop4-1-36","source":"sop4","category":"SOP 4","question":"Regarding to the NO ENGINE BLEED TAKEOFF, what action shall be taken after completing the engine start procedure with both engines stable, parking brake set, tug and towbar disconnected, bypass pin removed and hand signals received from the ground crew?","options":["Do not perform any action from memory and complete the NO ENGINE BLEED TAKEOFF checklist as instructed.","Select APU OFF and ISOLATION VALVE to CLOSED","Select GEN 1 and 2 ON and select APU OFF","Select GEN 1 and 2 ON and select ISOLATION VALVE to AUTO"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-37","source":"sop4","category":"SOP 4","question":"During the preflight Flight Deck Access System Test the correct action after the Emergency Access Code is entered and the AUTO UNLK light illuminates is:","options":["Flight deck door lock selector to UNLKD","Flight Deck Access System switch to NORM","Flight Deck Access System switch to OFF","Flight deck door lock selector to DENY"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop4-1-38","source":"sop4","category":"SOP 4","question":"During the Preflight Procedure, as PF, when do you check that the Brake Accumulator and Hydraulic System A and B pressure are within limits?","options":["At Top of Climb.","When blanking the lower DU, during the Before Taxi Procedure.","After selecting the System A and B Hydraulic Pumps ON.","There is no need to check the Hydraulic Pressures, it's an engineering function."],"answer":2,"explanation":"","type":"mcq"},{"id":"sop4-1-39","source":"sop4","category":"SOP 4","question":"Is the Landing Dispatch Performance required to be calculated before the Final CDU Preflight Procedure?","options":["Yes","No","",""],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-40","source":"sop4","category":"SOP 4","question":"What is the correct status of the SPAR VALVE CLOSED lights during the pre-flight procedure?","options":["Illuminated bright (blue)","Illuminated (amber)","Extinguished","Illuminated dim (blue)"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop4-1-41","source":"sop4","category":"SOP 4","question":"What is the correct method to calculate OPT performance for take-off in gusty headwind conditions?","options":["Enter wind direction and steady wind value plus half of the gust value and complete the performance calculation.","Enter wind direction and full gust value to check that crosswind is within limits. Then enter the steady wind direction (without gust value) to complete the performance calculation.","Enter wind direction and steady wind value. Complete the performance calculation.","Enter wind direction and full gust value only. Check that crosswind is within limits and continue with the calculation."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop4-1-42","source":"sop4","category":"SOP 4","question":"Which is the correct order during the final CDU preflight procedure after selecting the OPT C/G in the CDU?","options":["STAB TRIM, V SPEEDS, MFRA, send output","V SPEEDS, send output, MFRA, STAB TRIM, before start checklist to the line","V SPEEDS, MFRA, STAB TRIM, send output","STAB TRIM, MFRA, V SPEEDS, send output"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-43","source":"sop4","category":"SOP 4","question":"When can both GEN1 and GEN2 be selected ON and the APU off during the engine start procedure?","options":["Once both engines are confirmed stable by the PM and the GEN OFF BUS lights are illuminated.","Once the parking brake is set and during the before takeoff checklist.","GEN2 after engine 2 is stabilized and GEN1 after engine 1 is stable.","Only when engines are confirmed stable by the PM and the GEN OFF BUS lights are illuminated and the tug and tow bar has been disconnected and the by-pass pin has been removed."],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-44","source":"sop4","category":"SOP 4","question":"During Flight Deck Safety Inspection, what is the FIRST item to be checked in the Techlog?","options":["Verify the door code.","There is no need to verify the techlog because the engineers always do it.","Verify Techlog registration agrees with aircraft registration.","It is the Captain's responsibility to check the techlog."],"answer":2,"explanation":"","type":"mcq"},{"id":"sop4-1-45","source":"sop4","category":"SOP 4","question":"Under which conditions is a takeoff with CSFF on upper wing surfaces allowable?","options":["Both of the other two conditions must be met.","The CSFF on the wing tank upper surfaces is only within the lines defining the permissible CSFF area with no snow, ice or frost on the leading edges or control surfaces.","There is no precipitation or visible moisture (rain, snow, drizzle, or fog with less than 1 mile visibility).",""],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-46","source":"sop4","category":"SOP 4","question":"If the RUNWAY INOP light is illuminated with the RUNWAY INHIBIT switch in the normal position, this indicates:","options":["The RAAS system has been deactivated","Any alerts generated are invalid","Some RAAS alerts may continue to function","All RAAS alerts are inhibited"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop4-1-47","source":"sop4","category":"SOP 4","question":"When is the transponder mode selector set '2000, then STBY', during the taxi in procedure?","options":["When requested by the captain.","After the airplane has come to a complete stop.","After vacating the runway.","When the marshaller is in sight."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop4-1-48","source":"sop4","category":"SOP 4","question":"When will the First Officer press the cabin attend button during the before takeoff checks?","options":["When ATC requests to expedite departure.","While the Captain is completing the takeoff briefing.","After the take-off briefing has been reviewed by the CP.",""],"answer":2,"explanation":"","type":"mcq"},{"id":"sop4-1-49","source":"sop4","category":"SOP 4","question":"What is the recommended taxi speed when engaging a RET (Rapid Exit Taxiway) after landing?","options":["60 KIAS","30 KIAS","10 KIAS","45 KIAS"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop4-1-50","source":"sop4","category":"SOP 4","question":"After landing if the turnoff is 90 degrees, what is the maximum allowed speed?","options":["10 knots","5 knots","20 knots","15 knots"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-51","source":"sop4","category":"SOP 4","question":"When should the wing and engine anti-ice switches be turned off after landing in freezing/icing conditions?","options":["When vacating the runway.","Before entering the parking area.","5 minutes after landing.","After the airplane has come to a complete stop on the stand with the engines shut down."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop4-1-52","source":"sop4","category":"SOP 4","question":"Once cleared for taxi, the Captain will switch on the taxi and runway turnoff light:","options":["The taxi light must be switched off when the aircraft is stationary","Runway turnoff and taxi lights are not required during day VMC operations","The runway turnoff and taxi lights should be switched off when the aircraft is stationary","There is no requirement to switch off any or all of these lights if the aircraft must stop during taxi"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop4-1-53","source":"sop4","category":"SOP 4","question":"PF response to RAAS \"On Runway __\" (cleared for take-off) is:","options":["\"Timing\"","\"___/___ Timing\"","\"Start time\"","\"Checked\""],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-54","source":"sop4","category":"SOP 4","question":"What course of action should be taken if during engine start the fuel is shutoff inadvertently (by closing engine start lever)?","options":["Reopen the engine start lever immediately to restart the engine.","Wait 10 seconds before reopening the start lever.","Leave the engine start lever closed","Set the Engine Start switch to GND position."],"answer":2,"explanation":"","type":"mcq"},{"id":"sop4-1-55","source":"sop4","category":"SOP 4","question":"Which Statement is correct in regard to performing the Engine Crossbleed Start (RYR) Supplementary Procedure?","options":["When advancing the thrust lever to increase the duct pressure, you may need to provide additional thrust if you have decided to keep the PACK switches on.","The pushback must be complete with the parking brake set, the tug disconnected, and ATC clearance is obtained.","The ground crew must be aware and clear you for a crossbleed start before or during the pushback, there is no need to notify ATC.","There is no need to check the area behind the aircraft is clear as the anti-collision light is on."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop4-1-56","source":"sop4","category":"SOP 4","question":"What is the purpose of the isolated pack operation during engine start procedure?","options":["To improve cabin air quality between starting the first and second engine.","To speed up the engine start procedure for engine number 1.","To configure the air conditioning panel for single pack operation.","To ensure the no engine bleed takeoff procedure is completed correctly."],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-57","source":"sop4","category":"SOP 4","question":"If the ambient temperature is below -35°C how many minutes must the engine be idled before changing thrust position?","options":["1 minute","4 minutes","3 minutes","2 minutes"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop4-1-58","source":"sop4","category":"SOP 4","question":"Which statement is correct with regard to extending the airstair from the inside of the aircraft?","options":["Leave the entry door closed as the airstair will not operate with the door open.","Fully open the entry door to allow clear visibility of the area outside the aeroplane.","The airstair must only be operated from the exterior of the aeroplane to allow clear visibility of obstacles and ground personnel.","Open the entry door to the cocked position to allow clear visibility of the area outside the aeroplane to avoid injury to personnel."],"answer":3,"explanation":"","type":"mcq"},{"id":"sop4-1-59","source":"sop4","category":"SOP 4","question":"Which statement regarding RTE 2 feature of the FMC is correct?","options":["RTE 2 page may be activated and crosschecked inflight between PF and PM for the next sector.","Using RTE 2 is not approved for Ryanair operations.","Do not enter callsign into RTE 2 (RTE X) inflight, as it changes MODE S output.","Select RTE 2 during Preflight setup for the crew's first flight of the day."],"answer":2,"explanation":"","type":"mcq"},{"id":"sop4-1-60","source":"sop4","category":"SOP 4","question":"When setting airspeed bugs with no operative FMC, what is the default weight?","options":["50,000 kgs","65,317 kgs","32,000 kgs","45,000 kgs"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop4-1-61","source":"sop4","category":"SOP 4","question":"Which statement regarding RTE 2 feature of the FMC is correct?","options":["Using RTE 2 is not approved for Ryanair operations.","It is recommended to copy the active flight plan into RTE 2 as backup in case of a loss of FMC L.","RTE 2 shall never be loaded on the ground.","RTE 2 page may be crosschecked inflight between PF and PM for the next sector. After activation crew may NOT execute RTE2."],"answer":2,"explanation":"","type":"mcq"},{"id":"sop4-1-62","source":"sop4","category":"SOP 4","question":"Before Takeoff during Cold Weather Operations, which of the following statements is the correct?","options":["When engine anti-ice is required and the OAT is 10°C or below, do an engine run up, as needed, to minimize ice build-up.","Wing Anti-ice must always be selected ON.","When engine anti-ice is required and the OAT is 3°C or below, the takeoff must be preceded by a static engine run-up.","Extend the flaps to the takeoff setting once lined up on the runway if they have been held in the UP position due slush, standing water or freezing conditions."],"answer":2,"explanation":"","type":"mcq"},{"id":"sop4-1-63","source":"sop4","category":"SOP 4","question":"Which of the following statements is TRUE regarding the Isolated Pack Operation during Engine start?","options":["It can be performed by memory at the discretion of the Captain.","It is only allowed by reading and performing the Supplementary Procedure 'Isolated Pack Operation during Engine Start'.","It is only allowed when OAT at or above 25°C.","It is only allowed by reading and performing the Supplementary Procedure 'Isolated Pack Operation during Engine Start'."],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-64","source":"sop4","category":"SOP 4","question":"Which of the following statements is TRUE regarding the Isolated Pack Operation during Engine start?","options":["It can be performed by memory at the discretion of the Captain.","It is only allowed when OAT at or above 25°C.","It is only allowed by reading and performing the Supplementary Procedure 'External Air Cart Use'.","It is only allowed by reading and performing the Supplementary Procedure 'Isolated Pack Operation during Engine Start'."],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-65","source":"sop4","category":"SOP 4","question":"What should the packs switch position be before connecting the ground conditioned air cart?","options":["Left pack OFF, isolation valve switch CLOSE and right pack ON. Packs can not be damaged if they are operated while ground condition air is connected.","Both OFF. Packs can be damaged if they are operated while ground condition air is connected.","Both Auto. Packs can not be damaged if they are operated while ground condition air is connected.","Both High. Packs can not be damaged if they are operated while ground condition air is connected."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop4-1-66","source":"sop4","category":"SOP 4","question":"What is the last step of Isolated pack operation during engine start procedure?","options":["PACK switches .AUTO","ISOLATION VALVE Switch .AUTO","ISOLATION VALVE Switch .CLOSE","PACK switches .OFF"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop4-1-67","source":"sop4","category":"SOP 4","question":"MCP altitude changes during climb following an ATC instruction require the following actions and call-outs?","options":["a. PF selects/confirms VNAV or LVL CHG or V/S on the MCP/PFD, verifies FMA and calls the mode.","b. PM selects/confirms VNAV or LVL CHG or V/S on the MCP/PFD, verifies FMA and calls the mode.","c. The PF selects/confirms VNAV mode on the MCP/PFD, verifies FMA and calls 'VNAV' for all MCP ALT selections.","d. PF selects/confirms VNAV or LVL CHG or V/S on the MCP/PFD. The PM verifies the FMA and calls the mode."],"answer":2,"explanation":"","type":"mcq"},{"id":"sop4-1-68","source":"sop4","category":"SOP 4","question":"What is the mandatory pitch mode to be used during climb?","options":["VNAV, unless approaching the cleared Altitude/Flight Level, the sustained climb rate is in excess of 3000ft, 2000ft or 1000ft per minute, where by V/S may be selected.","LVL CHG unless FMC Target Speed will provide better climb performance.","VNAV below FL100, LVL CHG above FL100","LVL CHG below FL100, VNAV above FL100."],"answer":0,"explanation":"","type":"mcq"},{"id":"sop4-1-69","source":"sop4","category":"SOP 4","question":"If you encounter Severe Turbulence during high altitude cruise flight:","options":["Set M0.76 and engage ALT HLD","Set CON from the N1 limit page and allow A/T to set the appropriate thrust","Disconnect Autothrottle and set turbulence penetration N1 as highlighted by TURB N1 on the Cruise page.","Set 280kts and engage ALT HLD"],"answer":2,"explanation":"","type":"mcq"},{"id":"sop4-1-70","source":"sop4","category":"SOP 4","question":"What is the diversion distance (maximum distance from an adequate aerodrome for two-engined aeroplanes without an ETOPS approval) for the RYR B737-800?","options":["none of the above","427 nm","416 nm","396 nm"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop4-1-71","source":"sop4","category":"SOP 4","question":"Below FL100 in Class C airspace, ATC ask you to maintain speed 280kts for separation:","options":["You call 'unable' as the maximum speed below FL100 is 250kts with no exceptions","You comply as this is a specific speed instruction from ATC","Crews may increase speed above 250kts below FL100 at their own discretion","This is not possible because no separation is provided in class C airspace"],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-1-1","source":"tech1","category":"Airplane General","question":"When operating the forward airstairs, with the external control, what position must the forward entry door be in?","options":["Must be partially open","Must be fully closed","Must be fully open","Can be in any position"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop5-1-2","source":"tech1","category":"Airplane General","question":"How can the Emergency Exit Lights be illuminated? Select one or more (to trick you!):","options":["If the three position switch located on the FWD Overhead panel is selected to AUTO.","Automatically if the three position switch located on the FWD Overhead panel switch is in the ARMED position and electrical power to DC bus No.1 fails or if AC power turned off.","Automatically if any overwing exit door is opened.","By lifting the guard and pushing the ON switch located on the FWD Attendant Panel."],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-2-1","source":"tech1","category":"Automatic Flight","question":"The VOR/LOC mode must be engaged before the second Autopilot can be selected during a duel channel Autopilot approach.","options":["True","False","",""],"answer":1,"explanation":"","type":"mcq"},{"id":"sop5-2-2","source":"tech1","category":"Automatic Flight","question":"In flight below 2000 feet RA, on an ILS Autopilot approach with flare armed, what happens if you push a TO/GA switch once?","options":["Autothrottle will disengage, and ARM is dispalyed in FMA.","Autopilot will disengage, and CWS P will annunciate.","Autothrottle advances thrust levers to full Go-Around N1.","Autothrottle advances thrust levers to reduced Go-Around N1"],"answer":3,"explanation":"","type":"mcq"},{"id":"sop5-2-3","source":"tech1","category":"Automatic Flight","question":"Other than by selecting N1 mode by pressing the N1 switch on the MCP, when else will N1 mode automatically engage. (Select one or more)","options":["LVL CHG engaged in climb more than 2.5 minutes after takeoff (correct)","VNAV engaged in climb (correct)","LVL CHG and VNAV engaged within first 2.5 minutes after takeoff (nope)","Never, N1 mode is only ever manually selected and engaged (nope)"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-2-4","source":"tech1","category":"Automatic Flight","question":"What will cause the A/T to disengage? (Select one or more):","options":["Push Either A/T Disengage switch (correct)","An A/T system fault is detected. (correct)","Move A/T ARM switch to OFF. (correct)","Immediately the left main landing gear is compressed (nope)"],"answer":0,"explanation":"","type":"mcq"},{"id":"sop5-2-5","source":"tech1","category":"Automatic Flight","question":"The autothrottle will disengage
