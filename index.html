 the pack temperature sensor."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-4","source":"tech2","category":"Electrical","question":"In MANUAL pressurization mode the outflow valve is driven by?","options":["A motor supplied from DC standby bus.","A motor supplied from DC bus 2.","A motor supplied from DC bus 1.","Requires AC power from transfer bus 1."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-5","source":"tech2","category":"Automatic Flight","question":"When will the descent mode be activated in the pressurization system?","options":["When T/D is reached.","When within 15000 feet of the landing altitude.","When descending 0.25psi below the selected altitude.","When retard is announced in the FMA."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-6","source":"tech2","category":"Airplane General","question":"When does the outflow valve position indicator indicate the position of the outflow valve?","options":["In AUTO mode only.","In MAN mode only.","In ALTN and MAN modes only.","In all modes."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-7","source":"tech2","category":"Airplane General","question":"Which statement is correct when the AUTO FAIL light is illuminated with the ALTN light is extinguished on the cabin pressurisation panel?","options":["This indicates a dual controller failure.","Select MAN and close manual valve.","This indicates a single controller failure.","AUTO controller has failed - reselect mode selector to AUTO."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-8","source":"tech2","category":"Engines & APU","question":"The isolation valve switch is in AUTO, both engine bleed air switches ON and both air conditioning pack switches AUTO. What position will the isolation valve be in?","options":["Open.","Will only open when the APU bleed air switch is selected ON.","Modulates between open and closed.","Closed."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-9","source":"tech2","category":"Engines & APU","question":"What does illumination of the DUAL BLEED light indicate?","options":["Bleed air pressure too low, engine thrust setting should be increased above idle.","Isolation valve fully open.","Bleed air for cabin pressurisation too high.","Possible backpressure of the APU if thrust lever advanced above idle"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-10","source":"tech2","category":"Air Systems","question":"Which statement is true when on the ground, with both Air Conditioning PACK Switches positioned to HIGH (and both packs operating) and both Recirculation RECIRC FAN Switches positioned to AUTO?","options":["Both recirculation fans will operate.","Neither recirculation fan will operate.","Only the Left recirculation fan will operate.","Only the Right recirculation fan will operate."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-11","source":"tech2","category":"Engines & APU","question":"Which statement is correct for the recirculation fan system?","options":["It reduces the air conditioning pack load and the engine bleed air demand.","It is is driven by a DC motor.","It increases airflow at greater cabin differential pressures.","It provides overheat detection downstream of the packs."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-12","source":"tech2","category":"Engines & APU","question":"After normal engine start, what should be done if the DUAL BLEED light is illuminated?","options":["ISOLATION VALVE to close, Engine BLEED Air switch(es) affected side off.","Engine start lever affected side to cut off.","PACK switch, affected side, OFF.","Position the APU BLEED switch to OFF."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-13","source":"tech2","category":"Engines & APU","question":"With the engines operating, which of the following situations would cause the DUAL BLEED light to illuminated amber?","options":["Eng No 2 BLEED Air Switch ON and Isolation Valve open.","Eng No 1 and Eng No 2 BLEED Air Switches ON and Isolation Valve open.","Eng No 1 and Eng No 2 BLEED Air Switches ON.","Eng No 1 BLEED Air Switch ON and APU bleed air valve open."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-14","source":"tech2","category":"Airplane General","question":"How has the Pressurization system been affected if the AUTO FAIL light illuminates?","options":["Automatic pressurization has failed - the pressurization must be controlled manually.","Pressurization has suffered a total system failure, the ALTN light will illuminated to show the alternate controller has also failed.","Pressurization has suffered a total system failure, an emergency descent must be initiated as the cabin pressure cannot be controlled.","Automatic pressurization is operational - automatic switching has occurred and the alternate controller is maintaining pressurization."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-15","source":"tech2","category":"Air Systems","question":"Which of the following conditions will cause the AUTO FAIL light to illuminate?","options":["Excessive rate of descent of cabin altitude","Cabin altitude rises above 10,000ft.","Excessive differential pressure (> 8.75 psi).","Excessive negative differential pressure."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-16","source":"tech2","category":"Airplane General","question":"How has the Pressurization system been affected if the AUTO FAIL light illuminates, with the ALTN light extinguished?","options":["Pressurization has suffered a total system failure, the ALTN light will be illuminated to show the alternate controller has also failed.","Automatic pressurization has failed - the pressurization must be controlled manually.","Pressurization has suffered a total system failure, an emergency descent must be initiated as the cabin pressure cannot be controlled.","Automatic pressurization is operational - automatic switching has occurred and the alternate controller is maintaining pressurization."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-17","source":"tech2","category":"Air Systems","question":"On the Bleed Air Duct pressure indicator the L pressure indicates 40psi, the R pressure indicates 50psi - is this an acceptable condition?","options":["No. You must set R RECIRC FAN to OFF.","No. You must select L pack to HIGH until pressure indications equalize.","No. You must set both packs to high for 2 minutes.","Yes. As long as there is sufficient air for cabin pressurization, this is normal."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-18","source":"tech2","category":"Engines & APU","question":"Which answer best describes the operation of an engine bleed air valve with the related Engine Bleed Air Switch in the ON position?","options":["The valve is AC activated and pressure operated.","The valve is DC activated and pressure operated.","The valve is DC activated and AC operated.","The valve is DC activated and temperature operated."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-19","source":"tech2","category":"Air Systems","question":"What is indicated by a PACK Light illumination (amber) during Master Caution recall, that extinguishes when Master Caution is reset?","options":["Failure of the zone temp controller","Failure of both standby pack controllers.","Failure of both primary controllers.","Failure of either primary or standby pack controller."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-20","source":"tech2","category":"Engines & APU","question":"How is an APU bleed air duct leak annunciated in the flight deck?","options":["By the MASTER CAUTION, AIR COND and Left WING-BODY OVERHEAT lights.","By the MASTER CAUTION, AIR COND and Right WING-BODY OVERHEAT lights.","By the MASTER CAUTION, AIR COND and BLEED TRIP OFF lights.","By the MASTER CAUTION, OVHT/DET and the APU fire switch lights."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-21","source":"tech2","category":"Engines & APU","question":"The COWL ANTI-ICE light illuminates amber to indicate what condition?","options":["To indicate overtemperature in the duct at the cowl anti-ice valve.","To indicate an overpressure condition in the duct downstream of the engine cowl anti-ice valve.","To indicate low pressure in the duct around the cowl lip.","To indicate hot air leaks around the engine cowl lip."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-22","source":"tech2","category":"Engines & APU","question":"With reference to Anti-Icing of the alpha vanes, which of the following statements is true?","options":["Are heated by LEFT or RIGHT FWD window heat switches.","Are heated whenever the alternate static ports are heated.","Are heated by independent 115V AC heating elements, controlled by the PROBE HEAT switches.","Are heated whenever engine anti-icing is being used."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-23","source":"tech2","category":"Anti-Ice & Rain","question":"When the ENG ANTI-ICE switch are positioned to ON in flight. what is the affect on the stall warning logic?","options":["Does NOT adjust the minimum manoeuvre speed bar on the airspeed indicator.","Does not adjust stick shaker or minimum maneuver speed bars.","Adjusts FMC displayed Vref automatically when ENG ANTI-ICE switch is ON.","Adjusts stick shaker and minimum maneuver speed bars on the airspeed indicator."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-24","source":"tech2","category":"Electrical","question":"Which of the following statements are true when operating on standby power?","options":["Only the F/O's pitot probe is heated.","Both captain's and F/O's primary pitot probes are heated.","Only the captain's pitot probe is heated. The CAPT PITOT amber light will not illuminate for a failure.","Only the captain's pitot probe is heated and the CAPT PITOT amber light will illuminate in case of failure."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-25","source":"tech2","category":"Anti-Ice & Rain","question":"What indication will there be if a cowl anti-ice valve fails to move to the selected position?","options":["The COWL ANTI-ICE light momentarily illuminates bright blue.","The COWL VALVE OPEN light remains illuminated bright blue.","A green TAI indication illuminates on the CDS after a short delay.","The COWL ANTI-ICE light illuminates amber."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-26","source":"tech2","category":"Fire Protection","question":"Which statement is correct for when the window heat Test Switch is put into the OVHT position?","options":["Simulates an overheat condition in order to test the system.","Performs a voltage check of the power supplies.","Can only be used if all green lights are on.","Checks for a system failure."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-27","source":"tech2","category":"Automatic Flight","question":"What pitch mode is annunciated in the FMA after takeoff when the autopilot is first engaged in CMD?","options":["CWS P","VNAV","V/S","MCP SPD"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-28","source":"tech2","category":"Airplane General","question":"After a normal takeoff with sufficient rate of climb achieved, which F/D pitch command can you expect?","options":["V2 to V2 plus 15kts.","V2.","V2 to V2 plus 20kts.","V2 plus 20kts."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-29","source":"tech2","category":"Automatic Flight","question":"When will LNAV automatically disengage?","options":["When VNAV is engaged.","Reaching a route discontinuity.","Upon glideslope capture.","When HDG SEL is disengaged."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-30","source":"tech2","category":"Automatic Flight","question":"During a single autopilot approach and landing, a single press of either TO/GA switch in response to a Go-around will result in which of the following situations?","options":["Automatic A/P Go-around occurs after FLARE armed annunciates.","The A/P Go-around is only available after the second push of the TO/GA switch.","An A/P Go-around will automatically engage.","A manual F/D Go-around is available"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-31","source":"tech2","category":"Automatic Flight","question":"With LNAV armed on the ground, at what altitude will it engage?","options":["LNAV is manually selected once above 3000 feet with flaps up no lights.","50 feet RA.","Passing 400 feet AGL.","800 feet RA."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-32","source":"tech2","category":"Airplane General","question":"After lift-off the A/T remains in THR HLD until which altitude?","options":["400 feet Radio Altitude and 18 seconds after lift-off.","800 feet Radio Altitude and 18 seconds after lift-off.","800 feet above Field Elevation.","400 feet Radio Altitude."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-33","source":"tech2","category":"Airplane General","question":"Which statement is correct when the ALT-NORM switch on the Audio Control Panel (ACP) is set to ALT?","options":["The ACP switches to an alternate ACP and all functions operate normally and the crewmember can communicate on all radios.","The ACP at that station is inoperative and the crewmember cannot communicate on any radios.","The ACP switches to standby ACP and all functions operate normally except PA and interphone.","The ACP at that station is inoperative but the crewmember can communicate on one radio."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-34","source":"tech2","category":"Airplane General","question":"How long can the cockpit voice recorder record audio?","options":["60 minutes.","90 minutes.","180 minutes.","120 minutes."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-35","source":"tech2","category":"Warning Systems","question":"Which statement is correct at that station, when the Captain's ACP operating in degraded mode?","options":["Audio warnings for altitude alert, GPWS and windshear are not heard.","VHF-2 is the only useable radio.","All ACP transmitter selectors remain functional, but receiver selectors are lost.","The flight interphone remains useable, the PA is lost."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-36","source":"tech2","category":"Landing Gear","question":"What is the result of pushing the ATTEND call switch?","options":["Sounds a horn in the nose wheel well.","Sounds a two-tone chime in the passenger cabin and illuminates both pink master call lights.","Sounds a single chime in the passenger cabin.","Both amber Master Call lights illuminate in the passenger cabin."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-37","source":"tech2","category":"Electrical","question":"During charging of the battery, would the battery voltage be.","options":["Less than 28 Volts","Equal to 28 Volts","Over 32 volts.","Less than 28 Volts or more than 28 Volts"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-38","source":"tech2","category":"Electrical","question":"Which statement is correct when the aircraft batteries are the only source of power?","options":["The Captain's inboard and F/Os inboard and outboard displays are inoperative.","The Captain's inboard and outboard DUs operate until the battery is discharged and the F/Os inboard and outboard DUs operate for a minimum of 5 minutes.","The Captain's inboard and outboard DUs operate until the battery is discharged.","Both the Captain's and F/Os DUs remain operative but only DEU No.1 is powered until the battery is discharged."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-39","source":"tech2","category":"Electrical","question":"Switching the CAB/UTIL Switch to the OFF position removes electrical power from all 115v AC galley busses, and which other buses?","options":["Cargo compartment heaters","Forward airstairs","Left and right recirculation fans","Landing lights"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-40","source":"tech2","category":"Electrical","question":"Which statement is true when the STANDBY POWER Switch is selected to OFF (the center position)?","options":["The 'STANDBY PWR OFF' light will extinguish.","The 'STANDBY PWR OFF' light will illuminate (amber).","The Static Inverter provides 28 volt DC power to Transfer Bus No 1.","Automatic switching is provided from normal power sources to alternate power sources"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-41","source":"tech2","category":"Electrical","question":"When will the ELEC Light illuminate on the ground?","options":["When a fault exists in the AC or standby power system.","The ELEC light only operates in flight.","When a fault exists in the AC, DC or the standby system.","When a fault exists in the DC or standby system."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-42","source":"tech2","category":"Electrical","question":"When will the APU GEN OFF BUS illuminate?","options":["Whenever the APU is supplying power to generator bus No 2.","When the APU is at operational speed but is not supplying an AC transfer bus.","Whenever the APU is not running.","Whenever the APU is supplying power to generator bus No l."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-43","source":"tech2","category":"Electrical","question":"Under what conditions can the APU generator can supply both transfer busses?","options":["On the ground only.","It cannot supply both transfer busses simultaneously.","In flight only.","Both on the ground or in flight."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-44","source":"tech2","category":"Electrical","question":"What does illumination of the ELEC light indicate whilst on the ground?","options":["A fault in the AC power system","A fault exists in the DC Power System or Standby Power System","DC power system fault.","Standby power system fault."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-45","source":"tech2","category":"Electrical","question":"Which of the following statements is one of the basic principles of operation for the 737 electrical system?","options":["An AC power source may be used in parallel with a DC power source.","There is no paralleling of the AC sources of power.","There is paralleling of AC sources of power.","All generator bus sources can be automatically connected by the Standby Power System."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-46","source":"tech2","category":"Electrical","question":"What is the function of the TR´s (Transformer Rectifier Units)?","options":["To rectify 115 volts DC to 28 volts.","To convert 115 volts AC to 28 volts AC.","To convert 115 volts AC to 28 volts DC.","To convert 115 volts DC to 28 volts AC."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-47","source":"tech2","category":"Electrical","question":"When using the APU in flight, which of the following statements is true?","options":["The APU may only be used as a bleed air source up to 10,000 feet","The APU may be used as an electrical and bleed air source simultaneously up to 17,000 feet","The APU may be used to feed two air conditioning packs up to 41,000 feet","The APU may be used as an electrical and bleed air source simultaneously up to 10,000 feet"],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-48","source":"tech2","category":"Engines & APU","question":"During a normal engine start, which of the following statements is true? Select one:","options":["Only oil pressure and engine vibration are available prior to placing the engine start switch to GRD.","Only round dials are visible for engine indications prior to placing the engine start switch to GRD.","Only N1, N2, oil quantity and engine vibration are available prior to placing the engine start switch to GRD.","Only N1, N2, oil quantity indications are available until the engine accelerates to a speed greater than 15% N2."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-49","source":"tech2","category":"Engines & APU","question":"What is the approximate engine starter cutout speed?","options":["56% N1","25% N1","56% N2","25% N2"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-50","source":"tech2","category":"Engines & APU","question":"Which of the following actions would cause a displayed ENG FAIL Alert to extinguish?","options":["Engine fire switch pulled.","EEC set to ALTERNATE","Engine fire bottle discharged","Start lever moved to IDLE."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-51","source":"tech2","category":"Engines & APU","question":"Which of the following statements would cause the EEC to automatically turn off ignition, and shut of fuel to the engine when the EGT display box and dial turn red?","options":["An impending wet start is detected during ground starts.","The EGT exceeds the starting limit during ground or in flight starts.","The EGT exceeds the starting limit during ground starts.","An impending hot start is detected during ground starts or in flight starts."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-52","source":"tech2","category":"Engines & APU","question":"Where is the Engine Fuel Flow is measured?","options":["Before the fuel reaches the HMU.","After passing through the fuel filter.","After passing through the engine fuel shutoff valve.","Before passing through the second stage engine fuel pump."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-53","source":"tech2","category":"Engines & APU","question":"If the EGT exceeds the starting limit during an engine start, in what circumstances would the EEC automatically turn off ignition and shut off fuel to the engine?","options":["On the ground only","On the ground and in flight","In flight only","Never"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-54","source":"tech2","category":"Engines & APU","question":"Which of the following actions occur when positioning the Engine Start Lever to CUTOFF?","options":["Closes Spar Fuel Shutoff Valve and resets ignition system through EEC.","Closes engine fuel shutoff valve only.","Shuts the spar fuel shutoff valve only.","Closes both spar and engine fuel shutoff valves."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-55","source":"tech2","category":"Engines & APU","question":"The CFM56-7 is a twin spool engine. Which spool is connected to the accessory gearbox","options":["The fan driveshaft","High pressure (N2)","Both (N1 and N2)","Low pressure (N1)"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-56","source":"tech2","category":"Engines & APU","question":"During engine ground start, how long before the EEC detects a Wet Start and shuts off ignition and fuel if there is no rise in EGT after the start lever is moved to IDLE?","options":["15 seconds.","10 seconds.","Until starter cut out.","20 seconds."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-57","source":"tech2","category":"Electrical","question":"What is the electrical power source of the APU fire detection system?","options":["The AC standby bus.","The battery bus.","The switched hot battery bus.","The hot battery bus"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-58","source":"tech2","category":"Engines & APU","question":"In flight, what does illumination of the amber FAULT light on the Overheat/Fire Protection Panel indicate?","options":["There is a fault in APU, engines or cargo hold detector loops.","Both detector loops for an engine have failed.","One of the detector loops for an engine has failed.","One detector loop for each engine has failed."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-59","source":"tech2","category":"Engines & APU","question":"What additional engine fire indication is shown or heard on the flight deck of later aircraft (YF685 through YF695, YW001 through YW164) in the event of engine fire or during an engine fire test?","options":["The fire warning is a siren and not a bell.","The engine fire is displayed as a temperature exceedance on the lower DU.","The associated engine start lever will illuminate red.","The engine fire is displayed as a temperature exceedance on the upper DU."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-60","source":"tech2","category":"Hydraulics","question":"Which statement is correct when the number 2 engine fire switch has been pulled up?","options":["Isolates the System B engine driven hydraulic pump, trips the number 2 IDG control relay and breaker and therefore will cause a loss of Hydraulic System B.","Arms both discharge squibs on the number 2 fire bottle only.","Closes the number 2 bleed valve and leaves the right pack unusable.","Isolates the System B engine driven Hydraulic pump, but the electric motor driven pump maintains System B pressure."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-61","source":"tech2","category":"Electrical","question":"What do the 3 green lights indicate, when the EXT TEST switch is moved to either 1 or 2 position?","options":["To check if there is power to the squibs from the associated DC bus.","That the bottles are full.","This is just a test to see if the discharge switches are operational.","That the circuit continuity from the squib to the engine and APU fire switch is checked."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-62","source":"tech2","category":"Fire Protection","question":"To silence the fire bell you can press either of the two Master Fire Warning (FIRE WARN) lights on the glareshield. There is another switch which will also silence the fire bell. Where is it located?","options":["On the aft overhead panel.","On the Overheat/Fire Protection panel.","On the P6 circuit breaker panel.","On the cargo fire panel."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-63","source":"tech2","category":"Fire Protection","question":"What is the result of operating the Cargo Fire Discharge switch?","options":["Results in the total discharge of the cargo compartment fire extinguisher bottle contents into the cargo hold selected by the Cargo Fire ARM Switch.","Results in the total discharge of the cargo compartment fire extinguisher bottle contents into the FWD and AFT cargo holds simultaneously.","Results in the total discharge of the FWD cargo compartment fire extinguisher bottle contents into the FWD cargo hold and the AFT cargo compartment fire extinguisher bottle contents into the AFT cargo hold.","Arms the cargo compartment fire extinguisher bottle for the hold where smoke is detected."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-64","source":"tech2","category":"Electrical","question":"Which bus or busses power the cargo compartment smoke detection system?","options":["AC standby bus.","Hot battery bus.","DC standby bus.","DC bus 1 and DC bus 2."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-65","source":"tech2","category":"Engines & APU","question":"If one of the two engine fire detection loops (A or B) in engine No.1 is inoperative, how will you be alerted to this?","options":["It will be noticed when performing the OVHT/FIRE test.","You may not notice this and a fire in engine No.1 would not be detected.","The FAULT light will be illuminated.","There will be a warning on RECALL."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-66","source":"tech2","category":"Engines & APU","question":"Is automatic shutdown protection provided for the APU in the event of an APU fire if the APU fire detection system is inoperative?","options":["Yes, in flight only","Yes, on the ground only","No","Yes"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-67","source":"tech2","category":"Airplane General","question":"On a non-short field performance aircraft (YF501 - YW097), with the TE flaps set to position 15, what is the correct indication that should be seen on the Aft Overhead panel for the leading edge devices?","options":["All LE devices EXT (intermediate) lights illuminated green","All LE devices FULL EXT lights illuminated green","LE slats EXT (intermediate) lights and LE flaps FULL EXT lights illuminated green.","All LE devices TRANSIT lights illuminated amber."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-68","source":"tech2","category":"Flight Controls","question":"Above what speed will the Mach Trim System operate?","options":["Mach .555","Mach .455","Mach .615","Mach .505"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-69","source":"tech2","category":"Airplane General","question":"How many flight spoilers are there on each wing?","options":["6","2","4","8"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-70","source":"tech2","category":"Airplane General","question":"How many spoilers deploy on the ground on each wing?","options":["0","All","4","2"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-71","source":"tech2","category":"Flight Controls","question":"What is the result of selecting the Stabilizer Trim Override Switch (on the AFT Electronic Panel) to OVERRIDE?","options":["Isolates the stabilizer trim motor.","Bypasses the stabilizer trim main electric cutout switch and the stabilizer trim autopilot cutout switch on the control stand.","Overrides the main electric switch.","Bypasses the control column actuated stabilizer trim cutout switches to restore power to the stabilizer trim switches on each control wheel."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-72","source":"tech2","category":"Hydraulics","question":"With reference to the flight controls and manual reversion, which statement is correct?","options":["The secondary flight controls are powered by hydraulic system A, with backup from the standby hydraulic system for the rudder and manual reversion for the rest if system A and B pressure is lost.","The primary flight controls are powered by hydraulic systems A and B with manual reversion if system A and B pressure is lost.","The secondary flight controls are powered by hydraulic system B, with backup from hydraulic system A for the rudder and manual reversion for the rest if system A and B pressure is lost.","The primary flight controls are powered by hydraulic systems A and B, with backup from the standby hydraulic system for the rudder and manual reversion for the rest if system A and B pressure is lost."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-73","source":"tech2","category":"Hydraulics","question":"What will cause the FEEL DIFF PRESS light to illuminate?","options":["Flaps are either up or down and either hydraulic system fails or either elevator pitot system fails, and an excessive hydraulic pressure imbalance is sensed.","Flaps are not up and an excessive hydraulic pressure imbalance between hydraulic System B and the Standby hydraulic system is sensed.","Captain's pitot system fails.","Flaps are up and an excessive hydraulic pressure imbalance between hydraulic System A and the Standby hydraulic system is sensed."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-74","source":"tech2","category":"Landing Gear","question":"What is the maximum permitted lever position of the speed brake lever in flight?","options":["UP","DOWN (Speed brake use is prohibited in flight).","FLIGHT DETENT","ARMED"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-75","source":"tech2","category":"Flight Controls","question":"What protection does the flap/slat electronics unit (FSEU) provide?","options":["Protection from uncommanded motion, for LE devices if two or more slats on one wing move from the commanded position.","LE skew detection for slats 1 through 8.","Slat and skew protection during auto-slat operation.","Skew detection for LE flaps."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-76","source":"tech2","category":"Hydraulics","question":"Which hydraulic system normally powers the Autoslats.","options":["Powered by hydraulic system A through the Power Transfer Unit (PTU)","Hydraulic system A.","Hydraulic system B.","Powered by the standby hydraulic system if a loss of pressure is sensed from the system B engine driven pump."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-77","source":"tech2","category":"Automatic Flight","question":"What does an amber ROLL displayed in the lower portion of the attitude indicator on the PFD mean?","options":["The Captain's and F/O's attitude displays differ by more than 5 degrees in roll.","The airplane is experiencing an uncommanded roll.","The airplane has exceeded 46 degrees of bank.","No flight director or autopilot roll mode engaged."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-78","source":"tech2","category":"Airplane General","question":"When does the Rad Alt display a digital readout only?","options":["Below 2,500ft AGL.","From 1,000ft AGL to 300ft AGL.","Below 1,000ft AGL.","From 2,500ft AGL to 1,000ft AGL."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-79","source":"tech2","category":"Warning Systems","question":"During approach the Captain observes his BARO minimum reference/altitude turns from green to flashing amber for three seconds, what does this means?","options":["The aircraft has descended below the Captain's selected minimum altitude (DA).","A windshear has been encountered.","Radio altitude data is unreliable.","The aircraft has descended below 1000 feet."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-80","source":"tech2","category":"Airplane General","question":"With reference to the Wind Direction/Speed and Wind Arrow on the ND; which statement is correct?","options":["Displayed only in APP mode.","Blanked if wind speed becomes less than 10 knots.","Displayed if wind speed is greater than 6 knots.","Displayed only in ND MAP mode."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-81","source":"tech2","category":"Engines & APU","question":"If an outboard display unit fails, where will the PFD be automatically displayed?","options":["It will not automatically display. It can only be displayed manually with the MAIN PANEL DU selectors.","On the ENGINE SECONDARY display.","On the ENGINE PRIMARY display.","On the inboard display unit."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-82","source":"tech2","category":"Automatic Flight","question":"The First Officer observes the word PITCH displayed in amber in the lower portion of the PFD during an ILS approach. What does this mean?","options":["The First Officer's pitch angle display has failed.","The Captain's and First Officer's pitch angle displays differ by more than 5 degrees.","The autopilot has defaulted to CWS pitch.","Glide slope information is not being followed."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-83","source":"tech2","category":"Flight Instruments","question":"When is the current Mach number displayed at the bottom of the airspeed indications tape on the PFD?","options":["When above 20,000 feet.","When above 10,000 feet and airspeed is 0.35 Mach and above.","When airspeed is 0.615 Mach and above.","When airspeed is 0.40 Mach and above."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-84","source":"tech2","category":"Automatic Flight","question":"What does an amber IAS DISAGREE alert in the bottom of the speed tape indicate?","options":["The Captain's and FO's airspeed indications disagree by more than 5 KTS for more than 5 continuous seconds.","There is a difference of more than 10 KTS between the MCP and FMC speeds.","The selected VREF is not correct for actual airplane gross weight.","The selected VREF is not correct for actual airplane configuration."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-85","source":"tech2","category":"Airplane General","question":"What does an amber MAP RANGE DISAGREE annunciation on the ND indicate?","options":["The selected range on the EFIS control panel is different from the weather radar display range.","Range information is not being fed to the map display.","Range information cannot be read from the EFIS control panel.","The selected range on the EFIS control panel is different from the map display range."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-86","source":"tech2","category":"Airplane General","question":"When does the Rad Alt display a digital readout with no circular display around it?","options":["From 1,000ft AGL to 300ft AGL.","From 2,500ft AGL to 1,000ft AGL.","Below 1,000ft AGL.","Below 2,500ft AGL."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-87","source":"tech2","category":"FMS & Navigation","question":"What does the FMC Advisory Message BUFFET ALERT indicate?","options":["Current conditions result in a manoeuvre margin less than specified.","Encountering turbulence will cause initial buffet.","The airplane is in partial or full stall.","Flaps need to be retracted because airspeed is greater than Vfe."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-88","source":"tech2","category":"Engines & APU","question":"If you push both thrust levers fully forward whilst using a 22K Thrust is selected in the FMC, the engines will produce.","options":["Manually advancing the thrust levers with Autothrottle engaged will have no effect on N1","22K thrust","Full 26K thrust","VMCG limited thrust"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-89","source":"tech2","category":"FMS & Navigation","question":"What will be the result on the APPROACH REF page if airplane gross weight is not available from the FMC?","options":["GROSS WT will be flashing.","GROSS WT will display dashes.","GROSS WT will display box prompts.","GROSS WT will be blank."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-90","source":"tech2","category":"Engines & APU","question":"Which statement is correct if an engine fails in flight?","options":["Execution of the engine out cruise (ENG OUT CRZ) page disengages VNAV.","VNAV immediately disengages and can not be re-engaged.","Execution of the engine out cruise (ENG OUT CRZ) page will change the VNAV speed to drift down speed.","The engine out cruise (ENG OUT CRZ) page is information only and the EXEC light will not illuminate."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-91","source":"tech2","category":"FMS & Navigation","question":"What information is available with the IRS mode selector in ATT?","options":["Heading information only.","Attitude information only.","Attitude, heading and position.","Attitude and heading information."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-92","source":"tech2","category":"FMS & Navigation","question":"On the FMC FIX INFO page what does the RAD/DIS FR indicate?","options":["The radial and distance of your next abeam point.","The radial and distance from the fix to the airplane, this information will update as the aircraft changes position.","The radial and distance from the airplane to the fix, this is not updated as the airplane changes position.","The radial and distance of the destination field."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-93","source":"tech2","category":"Engines & APU","question":"Under what circumstances will the V Speeds be removed from the FMC, the No V Speeds Flag reappear on the PFD, and the Scratchpad message TAKEOFF SPEEDS DELETED appear?","options":["OAT has been changed on the TAKEOFF REF page after the V Speeds have been entered.","If the MFRA is adjusted before TO/GA is pressed.","After first engine start, if the sensed OAT differs by more than 6 degrees C from the OAT entered on the TAKEOFF REF page.","If the FMC generated QRH V Speeds differ by more than 1kt from the entered OPT calculated V Speeds."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-94","source":"tech2","category":"Fuel","question":"When will the FMC Alerting Message VERIFY GW AND FUEL be shown in the CDU scratchpad?","options":["When gross weight is out of limit.","When fuel quantity data is invalid causing VNAV to disengage.","The FMC has detected an unexpected drop in fuel quantity.","When fuel quantity data is invalid and estimated fuel weight has to be entered manually."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-95","source":"tech2","category":"Fuel","question":"When will the fuel CONFIG alert extinguish?","options":["Centre fuel tank quantity less than 363 kgs.","Centre fuel tank quantity less than 91 kgs.","Centre tank quantity less than 726 kgs.","Total tank quantity less than 726 kgs."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-96","source":"tech2","category":"Fuel","question":"Which statement is correct when the aircraft is in flight, with 2500 kgs of fuel in main tank No.1 and 3060 kgs of fuel in main tank No.2 ?","options":["This will cause an amber LOW alert below main tank No.1 accompanied by MASTER CAUTION lights and a System Annunciation light for FUEL.","The fuel quantity digits for main tank No.2 turn amber.","This will cause an amber IMBAL alert below main tank No.1. The fuel quantity digits for the tank also turn amber.","This will cause an amber IMBAL indication below main tank No.1 accompanied by MASTER CAUTION lights and a System Annunciation Light for FUEL"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-97","source":"tech2","category":"Engines & APU","question":"When ALL of the AC fuel pumps are switched on and operating and there is fuel in each tank, which tank would fuel for the APU normally be supplied from?","options":["The right hand side of the fuel manifold.","Main tank No.2","Main tank No.1","The Centre tank."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-98","source":"tech2","category":"Engines & APU","question":"What is the result when the engine start lever is placed to CUTOFF?","options":["The spar fuel shutoff valve and engine fuel shutoff valve both close.","The spar fuel shutoff valve, engine fuel shutoff valve and engine bypass valve all close.","Only the spar fuel shutoff valve closes.","Only the engine fuel shutoff valve closes."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-99","source":"tech2","category":"Electrical","question":"In the unlikely situation of total generator failure at high altitude, thrust deterioration may occur. Why?","options":["When on STBY power the HMU will be unreliable, therefore thrust deterioration might occur at high altitude.","Loss of AC power will affect the ignition system and therefore create a potential risk of flameout.","The fuel will be suction fed, which may cause dissolved air released from the fuel to restrict fuel flow in the suction feed line.","When on STBY power the fuel pumps run a little slower."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-100","source":"tech2","category":"Engines & APU","question":"In-flight, if the two fuel pump LOW PRESSURE Lights for main tank No.1 illuminate. What happens to the No.1 engine?","options":["It will shut down due to fuel starvation.","It receives fuel from main tank No. 2 automatically.","It receives fuel from main tank No.1 through a suction feed line that bypasses the pumps.","It continues to operate due to the Cross Feed valve automatically opening."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-101","source":"tech2","category":"Landing Gear","question":"When are the NO SMOKING signs illuminated?","options":["The NO SMOKING Signs illuminate when the landing gear is retracted.","The NO SMOKING Signs illuminate when the flaps are extended.","The NO SMOKING Signs extinguish when the flaps are retracted.","The NO SMOKING Signs are permanently illuminated."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-102","source":"tech2","category":"Airplane General","question":"For RVSM operation, the maximum allowable altitude display difference for sea level, between the Captain and F/O's on the ground is?","options":["60 feet.","75 feet.","50 feet.","200 feet."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-103","source":"tech2","category":"Airplane General","question":"Where is the flight crew oxygen system pressure displayed on the flight deck?","options":["On panel P18 behind the Captain's seat.","On the crew oxygen pressure indicator on the aft overhead panel.","The gauge on the oxygen cylinder.","At the flight crew oxygen shut-off valve."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-104","source":"tech2","category":"Airplane General","question":"The PASS OXY ON Light illuminates, what does this indicate?","options":["Passenger oxygen system is activated","Passenger oxygen quantity is low","Oxygen shutoff valve is ON","Passenger oxygen system pressure is low"],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-105","source":"tech2","category":"Airplane General","question":"What is the maximum crew oxygen system pressure?","options":["1150 psi","1850 psi","1800 psi","1100 psi"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-106","source":"tech2","category":"Hydraulics","question":"When will hydraulic pressure from System B be used to retract the landing gear?","options":["When the ALTERNATE NOSE WHEEL Switch is positioned ON.","Number 1 engine RPM drops below limit value, with either main landing gear still down and the landing gear lever is positioned UP.","When System A pressure is zero and the landing lever is positioned UP.","After a failure of the number 1 engine hydraulic pump with the landing gear still down and the landing gear lever is positioned UP"],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-107","source":"tech2","category":"Hydraulics","question":"With the No 1 engine running, what is the effect of switching ENG 1 hydraulic pump OFF?","options":["Pump continues to run and output is diverted to Electric hydraulic pump.","Transfers system to ENG 2 pump output.","Pump drive is disconnected.","Pump continues to be driven by the engine, but it's output is isolated from the rest of the hydraulic system."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-108","source":"tech2","category":"Hydraulics","question":"What would you expect to see when the standby hydraulic system is automatically activated?","options":["STBY RUD ON with no Master Caution.","No indications of automatic operation.","Illumination of the STBY RUD ON, Master Caution, and FLT CONT lights.","Master Caution and FLT CONT light only."],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-109","source":"tech2","category":"Hydraulics","question":"What is the minimum fuel quantity limitation for ground operation of the electric motordriven hydraulic pumps?","options":["453 Kgs in the related main tank.","760 Kgs in the related main tank.","363 Kgs in the related main tank.","There is no minimum fuel quantity limitation on the ground."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-110","source":"tech2","category":"Landing Gear","question":"What happens if you reject a takeoff with a groundspeed of 100 knots with Autobrakes set to RTO?","options":["Maximum braking is applied automatically when the thrust levers are retarded to idle.","Automatic speed brake deployment will occur when manual braking is applied","Maximum braking is applied automatically when reverse thrust selected.","AUTO BRAKE DISARM Light will illuminate."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-111","source":"tech2","category":"Landing Gear","question":"Which of the following conditions must exist to arm the RTO mode prior to takeoff?","options":["AUTOBRAKE switch to MAX.","Forward thrust levers positioned to IDLE.","AUTO BRAKE select switch OFF.","Wheel speed greater than 60 knots."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-112","source":"tech2","category":"Landing Gear","question":"Which of the following conditions would prevent the RTO mode from being armed prior to takeoff?","options":["Wheel speed less than 60 knots.","Thrust levers set to idle.","AUTO BRAKE select switch set to RTO","ANTISKID system inoperative."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-113","source":"tech2","category":"Warning Systems","question":"Which statement is correct for TCAS, proximate traffic?","options":["It is always a TA.","It is not indicated.","It is only shown as 'OFFSCALE.'","It is within 6 miles and 1200ft vertically."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-114","source":"tech2","category":"Warning Systems","question":"When are all TCAS alerts inhibited?","options":["By GPWS and windshear warnings.","Below approximately 1,100 feet radio altitude.","Below approximately 1000 feet radio altitude.","Until the flaps are fully retracted after takeoff."],"answer":0,"explanation":"","type":"mcq"},{"id":"tech2-3-115","source":"tech2","category":"Flight Controls","question":"When will the Takeoff Configuration Warning horn sound?","options":["TOGA not pressed.","If stabilizer trim is not in the green band when throttles advanced for takeoff.","If the parking brake is not set.","TE flaps set to position 5."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-116","source":"tech2","category":"Landing Gear","question":"Which statement is correct about the colour on the Terrain Display (with landing gear up)?","options":["Dotted red - terrain more than 5000ft above the aircraft's current altitude","Dotted green - terrain from 2500ft below to 500ft below the aircraft's current altitude","Solid red - look ahead terrain warning active","Dotted amber - terrain 250ft below to 2500ft above the aircraft's current altitude"],"answer":2,"explanation":"","type":"mcq"},{"id":"tech2-3-117","source":"tech2","category":"FMS & Navigation","question":"What is the meaning of a 'down arrow' and '-07' alongside a TA symbol showing on the Navigation Display (ND)?","options":["The traffic is descending at 700fpm.","The traffic is descending at minimum 500fpm.","You should descend at minimum 500fpm.","You should descend at 700fpm."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-118","source":"tech2","category":"FMS & Navigation","question":"Which of the statements is true when checking the mach/airspeed warning system?","options":["Cannot be checked on the ground.","Can only be checked on the ground with Flaps extended.","Can only be checked after IRS alignment","The system can be checked on the ground."],"answer":3,"explanation":"","type":"mcq"},{"id":"tech2-3-119","source":"tech2","category":"Warning Systems","question":"Which statement is correct when the FO does not correctly set the baro minima, but the Captain sets the minima correctly?","options":["It is impossible to omit to set the minima before any approach because the GPWS will remind you in time.","There will be a GPWS 'minimums' callout since the callouts are based on the captains minimums selector.","None of the answers are correct.","There will be no GPWS 'minimums' callouts."],"answer":1,"explanation":"","type":"mcq"},{"id":"tech2-3-120","source":"tech2","category":"Anti-Ice & Rain","question":"Where do the SMYD computers receive inputs from to determine when a Stall Warning is required?","options":["ADIRU's only.","Anti-ice controls, ADIRUs, alpha vane output, wing configuration, air/ground sensing, thrust and FMC outputs.","FMC, Thrust reverser lever position.","Anti-ice controls only."],"answer":1,"explanation":"","type":"mcq"},{"id":"techred-1-1","source":"techred","category":"Red Questions","question":"A fluid leak develops in System A electric pump","options":["-----------------------------------------------------","Fluid quantity in System A reservoir decreases to zero and all System A pressure is lost","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-2","source":"techred","category":"Red Questions","question":"A hot air leak is detected in the APU bleed air ducting. This is indicated on the forward overhead panel by:","options":["-----------------------------------------------------","Left (1) WING-BODY OVERHEAT light","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-3","source":"techred","category":"Red Questions","question":"A leak develops in the System A electronic-driven pump; how does this effect the operation of the PTU?","options":["-----------------------------------------------------","The PTU will not function as all system pressure is lost","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-4","source":"techred","category":"Red Questions","question":"A leak in standby hydraulic system will cause system B fluid indication decrease, to approximately:","options":["-----------------------------------------------------","0,72","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-5","source":"techred","category":"Red Questions","question":"A pack light illuminates, it does not extinguish on reset of the master caution recall. What could have been the cause of the alert?","options":["-----------------------------------------------------","A dual pack failure in which the pack will continue to operate until excessive temperature is sensed","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-6","source":"techred","category":"Red Questions","question":"AFDS is engaged in altitude hold and heading select. If the heading select switch on the MCP was pushed what would the FMAs display?","options":["-----------------------------------------------------","MCP SPD/CWS R (amber, below the FMA) / ALT HOLD","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-7","source":"techred","category":"Red Questions","question":"Air from the preconditioned ground source enter the air conditioning system through","options":["-----------------------------------------------------","The Mix Manifold","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-8","source":"techred","category":"Red Questions","question":"An OFFSCALE annunciation appears on the Navigation Display (ND). To view the TA or RA an appropriate action would be","options":["-----------------------------------------------------","Increase ND display range on the EFIS control Panel","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-9","source":"techred","category":"Red Questions","question":"An OVERHEAT light on the hydraulic panel illuminates in-flight. What does this mean?","options":["-----------------------------------------------------","The hydraulic fluid used to cool & lubricate the related electric-driven pump has overheated or the pump itself has overheated","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-10","source":"techred","category":"Red Questions","question":"At 100ft above DH/MDA the GPWS callout is:","options":["-----------------------------------------------------","PLUS HUNDRED","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-11","source":"techred","category":"Red Questions","question":"At glide slope capture during an autopilot ILS approach the cross bus tie relay automatically opens:","options":["-----------------------------------------------------","and the BUS TRANSFER switch returns to OFF (spring loaded) to isolate DC bus 1 from DC bus 2","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-12","source":"techred","category":"Red Questions","question":"At which flap settings is the flap load relief system operational for Short Field Performance aircraft?","options":["-----------------------------------------------------","Flaps 10, 15, 25 , 30 and 40","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-13","source":"techred","category":"Red Questions","question":"ATT:RST displayed in amber on an ISFD means:","options":["-----------------------------------------------------","Attitude must be reset during the ATTITUDE RESET switch","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-14","source":"techred","category":"Red Questions","question":"Automatic operation of the Standby Hydraulic System is initiated when:","options":["-----------------------------------------------------","The main rudder PCU Force Flight Monitor (FFM) trips","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-15","source":"techred","category":"Red Questions","question":"Battery power is provided by:","options":["-----------------------------------------------------","Two 24 volt nickel-cadmium batteries, main and auxiliary, which are located in the electronics compartment","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-16","source":"techred","category":"Red Questions","question":"During TOGA - Take off pitch mode, the AFDS commands","options":["-----------------------------------------------------","10 degrees nose down until 60kts IAS","-----------------------------------------------------",""],"answer":1,"explanation":"","type":"flashcard"},{"id":"techred-1-17","source":"techred","category":"Red Questions","question":"During a single engine go-around, one push of a TO/GA switch","options":["-----------------------------------------------------","F/D roll commands hold c function saveWritten(v){if(!session)return;session.written[session.i]=v;if(session.mode==='practice'){let b=document.querySelector('button[onclick="revealWritten()"]');if(b)b.disabled=!v.trim()}else if(v.trim())session.answers[session.i]='written';else session.answers[session.i]=null;persistDraft()}
function revealWritten(){if(!session||!String(session.written[session.i]||'').trim())return;session.selfGrades['reveal-'+session.i]=true;persistDraft();quizView()}
function gradeWritten(ok){if(!session)return;session.selfGrades[session.i]=ok;session.answers[session.i]='written';persistDraft();quizView()}
function respond(i){if(!session)return;if(session.mode==='practice'&&session.answers[session.i]!==null)return;session.answers[session.i]=i;db.seen[session.questions[session.i].id]=true;save();persistDraft();quizView()}
function move(d){if(!session)return;session.i=Math.max(0,Math.min(session.questions.length-1,session.i+d));persistDraft();quizView()}
function confirmFinish(){if(!session)return;if(confirm('Submit and finish this test? Results will be calculated and the test cannot be resumed.'))finish(false)}
function finish(auto){if(!session)return;let s=session;session=null;stopTimer();clearDraft();let items=s.questions.map((q,i)=>({qid:q.id,answer:s.answers[i],written:s.written[i]||'',selfGrade:s.selfGrades[i]===true?true:s.selfGrades[i]===false?false:null}));let graded=items.filter((it,i)=>!isWritten(s.questions[i])||it.selfGrade!==null);let correct=graded.filter((it)=>{let q=BANK.find(x=>x.id===it.qid);return q&&(typeof it.answer==='number'?it.answer===q.answer:it.selfGrade===true)}).length;let total=s.questions.length,score=graded.length?Math.round(correct/graded.length*100):null;let record={id:s.id,date:new Date().toISOString(),mode:s.mode,group:s.group,source:s.group,topics:s.topics,total,correct,graded:graded.length,score,seconds:Math.round((Date.now()-s.started)/1000),auto,items};db.attempts.unshift(record);items.forEach(it=>{if(it.answer!==null)db.seen[it.qid]=true});save();reviewAttempt=record;page='result';render()}
function result(){let r=reviewAttempt;if(!r){page='history';return render()}let pending=r.items.filter(it=>{let q=BANK.find(x=>x.id===it.qid);return q&&isWritten(q)&&it.selfGrade===null}).length;let score=r.score;let status=score===null?'NOT GRADED':score>=75?'PASS':'FAIL';$('app').innerHTML=head('TEST RESULTS','Session completed',new Date(r.date).toLocaleString('en-GB'))+`<div class="hero"><div class="eyebrow">${r.mode==='mock'?'MOCK EXAM':'PRACTICE TEST'}</div><div class="stat ${score===null?'':score>=75?'pass':'fail'}">${score===null?'—':score+'%'} · ${status}</div><p>${r.correct} correct out of ${r.graded??r.total} graded · Pass mark 75% · ${Math.round(r.seconds/60)} min</p>${pending?`<p class="muted">${pending} written answers are awaiting self-assessment. Review them below to complete your grade.</p>`:''}<div class="toolbar"><button class="btn" onclick="choose('${r.group||grp(r.source)}')">Practice again</button><button class="btn secondary" onclick="go('history')">View history</button></div></div><div class="section">Answer review</div><div class="card">${r.items.map((it,i)=>{let q=BANK.find(x=>x.id===it.qid);if(!q)return '';let written=isWritten(q),ok=written?it.selfGrade:it.answer===q.answer;return `<div class="review"><div class="topline"><strong>${i+1}. ${esc(q.category)}</strong><span class="${ok===null?'muted':ok?'pass':'fail'}">${ok===null?'Not graded':ok?'✓ Correct':'✕ Incorrect'}</span></div><p>${esc(q.question)}</p><div class="small">Your answer: ${written?esc(it.written||'Not answered'):it.answer===null?'Not answered':esc(q.options[it.answer]||'Not available')}</div><div class="small">Reference answer: <strong>${esc(q.options[q.answer]||'Not available')}</strong></div>${q.explanation?`<p class="small">${esc(q.explanation)}</p>`:''}${written?`<div class="toolbar"><button class="btn ${it.selfGrade===true?'':'secondary'}" onclick="gradeResult(${r.id},${i},true)">✓ Correct</button><button class="btn ${it.selfGrade===false?'':'secondary'}" onclick="gradeResult(${r.id},${i},false)">✕ Incorrect</button></div>`:''}</div>`}).join('')}</div>`}
function gradeResult(id,i,ok){let r=db.attempts.find(x=>x.id===id);if(!r)return;r.items[i].selfGrade=ok;let graded=r.items.filter(it=>{let q=BANK.find(x=>x.id===it.qid);return q&&(!isWritten(q)||it.selfGrade!==null)});r.graded=graded.length;r.correct=graded.filter(it=>{let q=BANK.find(x=>x.id===it.qid);return typeof it.answer==='number'?it.answer===q.answer:it.selfGrade===true}).length;r.score=graded.length?Math.round(r.correct/graded.length*100):null;save();reviewAttempt=r;result()}
function unfinishedCard(){if(!session)return '';let answered=session.answers.filter(a=>a!==null).length;let remaining=session.mode==='mock'?Math.max(0,session.deadline-Date.now()):null;return `<div class="card" style="margin:20px 0;border:1.5px solid #f6b17e;background:#fff8f2"><div class="topline"><div><span class="tag">IN PROGRESS</span><h3 style="margin:12px 0 5px">${esc(gname(session.group))} · ${session.mode==='mock'?'Mock exam':'Practice test'}</h3><p class="small">${answered}/${session.questions.length} questions answered${remaining!==null?' · '+clock(remaining)+' remaining':''}</p></div><button class="btn" onclick="resumeTest()">Continue test →</button></div><div class="progress"><div style="width:${answered/session.questions.length*100}%"></div></div><button class="btn ghost" onclick="discardTest()">Discard unfinished test</button></div>`}
function history(){let a=db.attempts.filter(x=>historyFilter==='all'||x.mode===historyFilter);$('app').innerHTML=head('YOUR PROGRESS','Test history','Every completed attempt is saved locally in this browser.')+(session?unfinishedCard():'')+`<div class="toolbar"><button class="btn secondary" onclick="backup()">Export backup</button><label class="btn secondary" style="cursor:pointer">Import backup<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div><div class="filterline" style="margin-bottom:16px">${[['all','All attempts'],['practice','Practice'],['mock','Mock exams']].map(([id,n])=>`<button class="chip ${historyFilter===id?'active':''}" onclick="historyFilter='${id}';history()">${n}</button>`).join('')}</div><div class="card">${a.length?`<table class="history"><thead><tr><th>Date</th><th>Bank</th><th>Mode</th><th>Score</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td>${new Date(x.date).toLocaleDateString('en-GB')}</td><td>${esc(gname(x.group||grp(x.source)))}</td><td>${x.mode==='mock'?'Mock':'Practice'}</td><td class="${x.score===null?'':x.score>=75?'pass':'fail'}">${x.score===null?'—':x.score+'%'}</td><td><button class="btn ghost" onclick="openResult(${x.id})">Review</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No attempts yet. Start a test to create your first record.</div>'}</div>`}
function openResult(id){reviewAttempt=db.attempts.find(x=>x.id===id);page='result';render()}
function analysis(){let groups=GROUPS.map(([id,n])=>{let a=db.attempts.filter(x=>(x.group||grp(x.source))===id),graded=a.reduce((s,x)=>s+(x.graded??x.total),0),correct=a.reduce((s,x)=>s+x.correct,0);return {id,n,attempts:a.length,accuracy:graded?Math.round(correct/graded*100):null}});$('app').innerHTML=head('INSIGHTS','Your statistics','Accuracy and attempts by question bank.')+`<div class="grid">${groups.map(g=>`<div class="card"><div class="small">${esc(g.n)}</div><div class="stat">${g.accuracy===null?'—':g.accuracy+'%'}</div><div class="small">${g.attempts} attempts</div><div class="progress"><div style="width:${g.accuracy||0}%"></div></div><button class="btn ghost" onclick="choose('${g.id}')">Practice →</button></div>`).join('')}</div>`}
function settings(){$('app').innerHTML=head('PREFERENCES','Settings','Manage your study records and local data.')+`<div class="card" style="margin-top:22px"><h3>Additional question bank</h3><p class="muted">The additional 1,235 Technical and SOP questions are loaded automatically from the site. The manual import remains available as an offline fallback.</p><label class="btn secondary" style="cursor:pointer;display:inline-flex">Import Technical + SOP questions<input type="file" accept=".json,application/json" hidden onchange="importQuestions(this.files[0]);this.value=''"></label><p class="muted" style="margin-top:10px">Imported questions currently stored: ${BANK.filter(q=>q.source==='importTECH'||q.source==='importSOP').length}</p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Data & backup</h3><p class="muted">Your attempts, saved tests and statistics are stored in this browser. Export a backup before changing devices or clearing browser data.</p><div class="toolbar"><button class="btn secondary" onclick="backup()">Export backup</button><label class="btn secondary" style="cursor:pointer">Import backup<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>Reset statistics</h3><p class="muted">Permanently delete all saved attempts, answer history and progress statistics from this browser. This does not delete the question bank.</p><button class="btn dangerbtn" onclick="resetStats()">Reset all statistics</button></div>`}
function resetStats(){if(!confirm('Delete ALL test history, answers and statistics? This cannot be undone.'))return;if(!confirm('Final confirmation: permanently reset your study progress?'))return;db={attempts:[],seen:{}};session=null;stopTimer();clearDraft();save();page='home';render()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='B737_Study_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restore(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.attempts))throw Error();if(confirm('Replace your current records with this backup?')){db=x;if(!db.seen)db.seen={};session=null;stopTimer();clearDraft();save();render()}}catch(e){alert('Invalid backup file')}}
// Single-user mode: no authentication or network requests.
// Migrate previously saved NICO data on this browser, without overwriting existing progress.
function initializeLocalStudy(){
 try{
  const old='b737academy_account_nico-initial';
  const oldDraft='b737academy_draft_nico-initial';
  if(!localStorage.getItem(KEY)&&localStorage.getItem(old))localStorage.setItem(KEY,localStorage.getItem(old));
  if(!localStorage.getItem(DRAFT_KEY)&&localStorage.getItem(oldDraft))localStorage.setItem(DRAFT_KEY,localStorage.getItem(oldDraft));
 }catch(e){console.warn('Unable to migrate prior local progress',e)}
 loadImportedQuestions();loadAccount();restoreDraft();render();loadRemoteQuestions();if(session)startTimer();
}
window.addEventListener('pagehide',persistDraft);initializeLocalStudy();</script></body></html>
